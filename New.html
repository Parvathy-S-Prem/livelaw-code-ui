/* ===== ACTIONS: header controls, history drawer, home search. Uses data-a / data-hist attributes ===== */
const ACTIONS = {};   // name -> (el, event) => void ; modules add their own entries

function doSearch(q, cat, adv){
  q = (q||'').trim();
  const hit = !adv && q && lookupResults(q).find(r=>r.key && NODES[r.key] && !NODES[r.key].stub);
  if(hit && cat==='Section or Article lookup' && parseCite(q)){ addHistory(q,'statute','/section/'+hit.key); go('/section/'+hit.key); return; }
  RQ = {q: q||'Section 138 NI Act', cat: cat||'All sources', adv: adv||{}, f:{}, tab:'All', court:'All'};
  addHistory(RQ.q, 'search');
  go('/research?q='+encodeURIComponent(RQ.q)+'&r='+Date.now());
}
function advToQuery(v){ return [v.all, v.phrase?'"'+v.phrase+'"':'', v.title, v.act&&v.section?v.section+' '+v.act:(v.act||v.section||''), v.citation].filter(Boolean).join(' ').trim(); }

Object.assign(ACTIONS, {
  homesearch: () => doSearch($('homeQ').value, $('homeCat').value),
  chipq: el => { $('homeQ') && ($('homeQ').value = el.dataset.v); doSearch(el.dataset.v, 'All sources'); },
  toggleadv: () => $('adv').classList.toggle('open'),
  advreset: el => { const root = el.closest('.advform'); root.querySelectorAll('[data-adv]').forEach(e=>{ if(e.type==='checkbox') e.checked = e.dataset.adv==='sc1st'; else e.value=''; }); },
  advsearch: el => { const v = readAdv(el.closest('.advform')); const q = advToQuery(v); doSearch(q || (v.subject||v.courtType||'Judgments'), $('homeCat')?.value || 'All sources', v); },
  histopen: () => openDrawer()
});

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if(a && ACTIONS[a.dataset.a]){ if(!/^(INPUT|SELECT|TEXTAREA|OPTION)$/.test(e.target.tagName)) e.preventDefault(); ACTIONS[a.dataset.a](a, e); return; }
  const h = e.target.closest('[data-hist]');
  if(h){
    const k = h.dataset.hist;
    if(k==='close') closeDrawer();
    else if(k==='new'){ go('/'); setTimeout(()=>$('homeQ')?.focus(),50); }
    else if(k==='open'){ const to=h.dataset.to; if(to) go(to); else doSearch(h.dataset.q, 'All sources'); }
    else if(k==='del'){ HIST = HIST.filter(x=>x.q!==h.dataset.q); store('hist2', HIST); drawDrawer($('histQ')?.value||''); }
    else if(k==='clear'){ HIST=[]; store('hist2', HIST); drawDrawer(); }
    return;
  }
  if(e.target.closest('#histBtn')){ document.body.classList.contains('hist-open') ? closeDrawer() : openDrawer(); return; }
  if(e.target.closest('#bellBtn')){ toggleBell(); return; }
  if(!e.target.closest('.bellwrap')) closeBell();
});
document.addEventListener('input', e => { if(e.target.id==='histQ') drawDrawer(e.target.value); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closeBell(); }
  else if(e.key==='Enter' && e.target.id==='homeQ'){ e.preventDefault(); ACTIONS.homesearch(); }
});

const words = s => (s||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ\s()\/.-]/g,' ').split(/\s+/).map(w=>w.replace(/^[.()\-]+|[.()\-]+$/g,'')).filter(w=>w && !STOP.has(w) && (w.length>2 || /^\d+$/.test(w)));
function benchClass(b){ b=(b||'').toLowerCase(); return /constitution|five|seven|nine|thirteen|\b[5-9]\b/.test(b)?'Constitution Bench':/three|\b3\b/.test(b)?'Three judges':/two|\b2\b|division/.test(b)?'Two judges':'Not recorded'; }
function courtClass(c){ return c==='Supreme Court'?'Supreme Court':/^High Court/.test(c)?'High Court':/Tribunal|NCLT|NCLAT|ITAT|NCDRC|NGT|SAT|CESTAT/i.test(c)?'Tribunal':'District'; }

/* ---------- corpus ---------- */
function corpus(){
  const d = [];
  CASES.forEach(c => d.push({kind:'case', tab:'Judgments', c, title:c.name, type:'Judgment', court:c.court, cc:courtClass(c.court), year:c.year, issue:c.issue, treat:c.treat||'', bench:benchClass(c.bench), subject:GROUP_SUBJECT[c.group]||'', group:c.group, text:[c.name,c.cite,c.prop,c.note,c.issue].join(' ')}));
  Object.entries(NODES).filter(([k,n])=>!n.stub).forEach(([k,n]) => d.push({kind:'node', tab:'Acts', key:k, n, title:`${nodeLabel(n)} · ${n.head}`, type:'Section', year:null, subject:GROUP_SUBJECT[n.group]||'', group:n.group, status:n.status==='repealed'?'Repealed':'In force', jur:'Central', docType:'Main Act', text:[nodeLabel(n),n.head,n.body.map(b=>b.t||'').join(' ')].join(' ')}));
  CENTRAL.concat(STATE_LAWS).forEach(x => d.push({kind:'law', tab:'Acts', x, title:lawTitle(x), type:'Act', year:x.year, subject:x.subject, status:STATUS_LABEL[x.status], jur:x.jur, docType:'Main Act', text:[x.name,x.abbr,x.subject,x.state||''].join(' ')}));
  RULES_REGS.forEach(x => d.push({kind:'law', tab:x.tab, x, title:lawTitle(x), type:x.type.replace(/s$/,''), year:x.year, subject:x.subject, status:STATUS_LABEL[x.status], jur:x.jur, docType:x.type.replace(/s$/,''), text:[x.name,x.under,x.subject].join(' ')}));
  OTHER_DOCS.forEach(o => d.push({kind:'other', tab:o.type==='Notification'?'Notifications':o.type, o, title:`${o.name}, ${o.year}`, type:o.type, year:o.year, subject:o.subject, jur:'Central', docType:o.type, text:[o.name,o.note,o.subject].join(' ')}));
  CONST_ARTICLES.forEach(a => d.push({kind:'art', tab:'Acts', a, title:`Article ${a[0]} · ${a[1]}`, type:'Constitution', year:1950, subject:'Constitutional', jur:'Central', status:'In force', docType:'Main Act', text:['Article',a[0],a[1],a[2]].join(' ')}));
  NEWS.forEach(n => d.push({kind:'news', tab:'LiveLaw reports', n, title:n.title, type:'LiveLaw reports', year:null, subject:'', text:[n.title,n.sub].join(' ')}));
  return d;
}
function relevance(doc, terms, q){
  if(!terms.length) return 1;
  const t = doc.title.toLowerCase(), x = doc.text.toLowerCase(); let s = 0;
  terms.forEach(w => { if(t.includes(w)) s += 3; else if(x.includes(w)) s += 1; });
  const sc = researchScope(q); if(doc.group && doc.group===sc) s += 2;
  return s;
}
function researchScope(q){
  const t = (q||'').toLowerCase();
  if(/\b138\b|cheque|dishonour|negotiable/.test(t)) return 'ni138';
  if(/\b302\b|\b103\b|murder|culpable/.test(t)) return 'murder';
  return '';
}
function advMatch(doc, a){
  const x = (doc.text+' '+doc.title).toLowerCase();
  if(a.all && !words(a.all).every(w=>x.includes(w))) return false;
  if(a.phrase && !x.includes(a.phrase.toLowerCase())) return false;
  if(a.any && !words(a.any).some(w=>x.includes(w))) return false;
  if(a.none && words(a.none).some(w=>x.includes(w))) return false;
  if(a.title && !doc.title.toLowerCase().includes(a.title.toLowerCase())) return false;
  if(a.citation && !(doc.c && doc.c.cite.toLowerCase().includes(a.citation.toLowerCase()))) return false;
  if(a.act && !x.includes(a.act.toLowerCase().replace(/,.*$/,''))) return false;
  if(a.section && !new RegExp('(^|\\D)'+a.section.replace(/[^\w()]/g,'')+'(\\D|$)','i').test(x)) return false;
  if(a.subject && doc.subject && doc.subject!==a.subject) return false;
  if(a.subject && !doc.subject) return false;
  if(a.docType && doc.docType!==a.docType && !(a.docType==='Main Act' && doc.kind==='case' && false)) { if(doc.kind!=='case' || a.docType!=='Judgment') return false; }
  if(a.courtType){ if(doc.kind!=='case') return false; const m={'Supreme Court':'Supreme Court','High Court':'High Court','Tribunal or commission':'Tribunal','District or subordinate court':'District'}; if(doc.cc!==m[a.courtType]) return false; }
  if(a.hc && !(doc.court||'').toLowerCase().includes(a.hc.toLowerCase())) return false;
  if(a.bench){ if(doc.kind!=='case') return false; const m={'Single judge':'Not recorded','Division bench (2 judges)':'Two judges','Three judges':'Three judges','Constitution Bench (5 or more)':'Constitution Bench'}; if(doc.bench!==m[a.bench]) return false; }
  if(a.treatment && doc.treat!==a.treatment) return false;
  const yf = a.from ? +a.from.slice(0,4) : 0, yt = a.to ? +a.to.slice(0,4) : 0;
  if((yf||yt) && !doc.year) return false; if(yf && doc.year<yf) return false; if(yt && doc.year>yt) return false;
  return true;
}
function sideMatch(doc){
  const f = RQ.f;
  if(f.court?.length && !f.court.includes(doc.cc||'')) return false;
  if(f.issue?.length && !f.issue.includes(doc.issue)) return false;
  if(f.treat?.length && !f.treat.includes(doc.treat)) return false;
  if(f.bench?.length && !f.bench.includes(doc.bench)) return false;
  if(f.subject?.length && !f.subject.includes(doc.subject)) return false;
  if(f.status?.length && !f.status.includes(doc.status)) return false;
  if(f.jur?.length && !f.jur.includes(doc.jur)) return false;
  if(f.from && (!doc.year || doc.year < +f.from)) return false;
  if(f.to && (!doc.year || doc.year > +f.to)) return false;
  return true;
}
function runSearchCore(){
  const terms = words(RQ.q.replace(/"/g,'')); const pc = parseCite(RQ.q);
  let docs = corpus().map(d => ({d, s: relevance(d, terms, RQ.q)})).filter(o => o.s>0 && advMatch(o.d, RQ.adv));
  if(pc){ const lab = ((ACT_SHORT[pc.act]||'')+' '+pc.no).toLowerCase(); docs = docs.filter(o => o.d.kind==='node' ? (o.d.n.act===pc.act && o.d.n.no.toUpperCase()===pc.no.replace(/\(.*\)/,'')) || o.d.group===researchScope(RQ.q) : true); }
  return docs;
}
function tabOf(doc){ return doc.tab; }
function inTab(doc, tab){
  if(tab==='All') return true;
  if(tab==='More') return !R_TABS.includes(doc.tab) && doc.tab!=='Judgments';
  return doc.tab===tab;
}

/* ---------- answer composer ---------- */
const caseById = id => CASES.find(c=>c.id===id);
function scoreTopic(t, q){ const s=q.toLowerCase(); let n=0; t.kw.forEach(k=>{ if(s.includes(k)) n += k.length>4?2:1; }); return n; }
function composeAnswer(q){
  const s = q.toLowerCase().trim(); if(!s) return null;
  const sc = researchScope(q);
  const pc = parseCite(q);
  /* 1. A bare section reference: show its correspondence */
  if(pc && !/\b(bail|limit|punish|notice|company|security)\b/.test(s)){
    const lab = ((ACT_SHORT[pc.act]||'')+' '+pc.no).toLowerCase();
    const row = CROSSWALK.find(r => r.old.toLowerCase()===lab || r.nw.toLowerCase().replace(/\(.*\)/,'').replace(/ and related/,'')===lab);
    if(row){ const oldN = row.oldKey&&NODES[row.oldKey], newN = row.nwKey&&NODES[row.nwKey];
      return {title:`${row.old} ↔ ${row.nw}`, paras:[`${CODE_NAME[row.code]?CODE_NAME[row.code][0]:''} ${row.old.replace(/^\D+/,'')} corresponds to ${CODE_NAME[row.code]?CODE_NAME[row.code][1]:''} ${row.nw.replace(/^\D+/,'')} (${REL_LABEL[row.rel].toLowerCase()}). ${row.note}`], law:[[row.old, row.nw, oldN?'/section/'+row.oldKey:'', newN?'/section/'+row.nwKey:'']], cases:[], flags:['Offences committed before 1 July 2024 are still tried under the old law. Check the date of the offence.','Mapping is pending editorial verification.'], more:`<button class="btn sm" data-go="/compare?q=${encodeURIComponent(q)}">Compare these provisions →</button>`}; }
  }
  /* 2. Section 138 NI Act */
  if(sc==='ni138') return composeNI(s);
  if(sc==='murder' && !/bail|anticipatory/.test(s)) return composeMurder(s);
  /* 3. General topics */
  let best=null, bs=0; TOPICS.forEach(t=>{ const n=scoreTopic(t,q); if(n>bs){ bs=n; best=t; } });
  if(best && bs>=1) return {title:best.title, paras:best.answer, law:best.law.map(l=>[l[0], l[1], '', '']), cases:best.cases.map(caseById).filter(Boolean), flags:best.flags};
  return null;
}
const CODE_NAME = {ipc:['IPC','BNS'],crpc:['CrPC','BNSS'],iea:['Evidence Act','BSA']};
function composeNI(s){
  const n = NODES['ni-138']; const pick = re => re.test(s);
  const base = {law:[['Negotiable Instruments Act, 1881, s.138',null,'/section/ni-138','']], flags:[]};
  const casesFor = issue => CASES.filter(c=>c.group==='ni138' && !c.ph && (!issue || c.issue===issue));
  if(pick(/time|limit|day|period|deadline|within/)) return {...base, title:'Section 138: time limits', paras:['Three time limits matter. The cheque must be presented within three months of its date (or within its validity, if shorter). The payee must give written notice within 30 days of receiving the bank’s information of dishonour. The drawer then has 15 days from receiving the notice to pay.','If the drawer does not pay, the complaint must be filed within one month after those 15 days expire (see s.142). Missing any step defeats the complaint.'], cases:casesFor('Service of notice').slice(0,1), flags:['Compute each period from the correct trigger date. The 30 days run from receipt of the bank’s information, not from the date on the cheque return memo alone.','The deadline helper in the Reminders calendar can add all three dates for you.'], more:'<button class="btn sm" data-go="/calendar?helper=138">Open the Section 138 deadline helper →</button>'};
  if(pick(/notice|serv|dispatch|registered post/)) return {...base, title:'Section 138: service of notice', paras:['The demand notice must be in writing and reach the drawer within 30 days of the payee receiving the bank’s information of dishonour.','Where notice is sent by registered post to the correct address, service can be presumed. A drawer who does not pay even after receiving the summons cannot then argue that the notice was never received.'], cases:casesFor('Service of notice'), flags:['Keep the postal receipt, tracking report and acknowledgment. The address on the notice should match the one in the cheque records.']};
  if(pick(/compan|director|vicarious|141/)) return {...base, title:'Section 138: offences by companies', paras:['Where the drawer is a company, s.141 makes persons in charge of its business liable. The Supreme Court has held that the company itself must be arraigned for the directors or officers to be prosecuted vicariously.','Mere designation as a director is not enough; the complaint should say how the person was in charge of, and responsible for, the conduct of the business.'], cases:casesFor('Company liability'), flags:['Check the specific averments against each director. A bare allegation is a common ground for quashing.']};
  if(pick(/security|blank|post-?dated|pdc/)) return {...base, title:'Section 138: cheques given as security', paras:['A cheque given as security can attract s.138 if the underlying liability has crystallised by the time it is presented. A cheque for a debt that is not yet due, or is disputed in a way that defeats the liability, stands differently.'], cases:casesFor('Security cheques'), flags:['The outcome turns on the facts: what was the debt, when did it fall due, and what did the parties agree about the cheque.']};
  if(pick(/jurisdiction|territorial|where.*(file|lodg)|142/)) return {...base, title:'Section 138: where to file', paras:['In 2014 the Supreme Court held that jurisdiction lay where the cheque was dishonoured. Parliament then amended the Act in 2015 so that, for a cheque delivered for collection through an account, jurisdiction lies where the payee’s branch is situated.'], cases:casesFor('Jurisdiction'), flags:['The 2014 decision is partly overridden by the 2015 amendment. Cite it only for what survives.']};
  if(pick(/presum|burden|139|rebut|enforceable debt/)) return {...base, title:'Section 138: presumption and burden', paras:['Section 139 raises a presumption that the cheque was issued for a legally enforceable debt. The accused can rebut it by showing a probable defence on a preponderance of probability, and need not always lead evidence.'], cases:casesFor('Presumption & burden'), flags:[]};
  if(pick(/compound|settle|147|summary|interim|143a|148/)) return {...base, title:'Section 138: compounding, summary trial and interim relief', paras:['The offence is compoundable (s.147) and the Supreme Court encourages early settlement. Trial should proceed summarily where possible (s.143).','Section 143A lets the court direct interim compensation to the complainant, and s.148 lets the appellate court order a deposit pending appeal.'], cases:casesFor('Compounding & trial'), flags:['Check the current limits on interim compensation and the appeal deposit in the text of ss.143A and 148.']};
  if(pick(/bail/)) return {...base, title:'Section 138: bail', paras:['The offence is bailable and non-cognizable, and it is triable by a Magistrate.'], cases:[], flags:['Under the BNSS, summons and trial procedure can differ. Check the date of the complaint.']};
  if(pick(/punish|penalt|sentence|fine|imprison/)) return {...base, title:'Section 138: punishment', paras:['Imprisonment up to two years, or fine up to twice the amount of the cheque, or both.'], cases:[], flags:[]};
  const cs = ['c4','c3','c2'].map(caseById).filter(Boolean);
  return {...base, title:'Section 138, Negotiable Instruments Act, 1881', paras:['Section 138 makes it an offence if a cheque is returned unpaid because the drawer’s account has insufficient funds or the amount exceeds the arrangement with the bank.','The offence is complete only if all three conditions are met: the cheque is presented within three months (or its validity); written notice is given within 30 days of the bank’s information; and the drawer fails to pay within 15 days of receiving the notice.','Punishment: imprisonment up to two years, or fine up to twice the cheque amount, or both. The offence is bailable, non-cognizable, compoundable (s.147) and triable by a Magistrate.'], cases:cs, quote:{t:n.body[0].t, src:'Summary of s.138 (gazetted wording to be inserted)'}, flags:['The three time limits are strict. Compute each from the correct trigger date.'], more:'<button class="btn sm" data-go="/section/ni-138">Open Section 138 →</button>'};
}
function composeMurder(s){
  const n = NODES['ipc-302']; const base = {law:[['Indian Penal Code, 1860, s.302 (repealed)','Bharatiya Nyaya Sanhita, 2023, s.103(1)','/section/ipc-302','/section/bns-103']], flags:['Offences committed before 1 July 2024 continue under the IPC, and Article 20(1) of the Constitution bars a heavier penalty than the law allowed when the act was done.']};
  const by = issue => CASES.filter(c=>c.group==='murder' && c.issue===issue);
  if(/sentenc|death|capital|rarest|life imprison|remission/.test(s)) return {...base, title:'Murder: sentencing', paras:['The sentence is death or imprisonment for life, and fine. Death is confined to the rarest of rare cases, decided by weighing aggravating and mitigating circumstances together. The Supreme Court has also recognised a fixed-term life sentence beyond the usual remission period as a middle path.'], cases:by('Sentencing')};
  if(/intention|culpable|knowledge|differ/.test(s)) return {...base, title:'Murder and culpable homicide: intention', paras:['The difference turns on intention and knowledge. For murder by intentional bodily injury, the injury must exist, be intentionally inflicted, and be sufficient in the ordinary course of nature to cause death.'], cases:by('Intention')};
  if(/evidence|circumstantial|dying declaration/.test(s)) return {...base, title:'Murder: proof by evidence', paras:['On circumstantial evidence, each circumstance must be fully proved and together they must form a chain pointing to guilt and nothing else. A dying declaration can be relied on without a doctor’s certificate of fitness if the court is satisfied that it is voluntary and true.'], cases:by('Evidence')};
  return {...base, title:'Murder: IPC section 302 and BNS section 103', paras:['Whoever commits murder is punished with death, or imprisonment for life, and is liable to fine. The offence is cognizable, non-bailable, non-compoundable and triable by a Court of Session.','IPC s.302 corresponds to BNS s.103(1), which carries the same punishment. BNS s.103(2) is new: murder by a group of five or more persons acting in concert on specified discriminatory grounds, which has no IPC predecessor.'], cases:CASES.filter(c=>c.group==='murder').slice(0,3), quote:{t:n.body[0].t, src:'IPC s.302 (text until 30 June 2024)'}};
}
function answerHTML(a, q){
  if(!a){
    return `<div class="aibox"><div class="ai-h"><span class="ai-ico">✦</span>No direct answer in the loaded material</div><p style="margin:0 0 8px">The sample database does not answer that question directly. In the live product this stage would say so instead of guessing. The results below match your words. You can also try one of these questions:</p><div class="chips">${TOPICS.map(t=>`<button class="chip" data-a="chipq2" data-v="${esc(t.title)}">${esc(t.title)}</button>`).join('')}</div><div class="disc">Not legal advice.</div></div>`;
  }
  const ca = a.cases.slice(0,3).sort((x,y)=>(x.court==='Supreme Court'?0:1)-(y.court==='Supreme Court'?0:1));

   <h3 style="margin:0 0 6px">${esc(a.title)}</h3>${a.paras.map(p=>`<p style="margin:0 0 8px">${esc(p)}</p>`).join('')}

   ${a.law?.length?`<div class="overline" style="margin-top:12px">The law</div><div class="ans-law">${a.law.map(l=>`<div class="ans-row"><span class="pill ${l[1]?'old':'in'}">${l[1]?'Old':'Law'}</span> ${l[2]?`<button class="xref" data-go="${l[2]}">${esc(l[0])}</button>`:esc(l[0])}${l[1]?` <span class="arrow">↔</span> <span class="pill in">New</span> ${l[3]?`<button class="xref" data-go="${l[3]}">${esc(l[1])}</button>`:esc(l[1])}`:''}</div>`).join('')}</div>`:''}
   ${ca.length?`<div class="overline" style="margin-top:12px">Leading cases (Supreme Court first)</div>${ca.map(c=>`<div class="ans-case"><b>${esc(c.name)}</b> <span class="muted">${esc(c.cite)} · ${esc(c.court)}${c.year?' · '+c.year:''}</span><div>${esc(c.prop.length>230?c.prop.slice(0,228)+'…':c.prop)}</div><button class="xref" data-judg="${c.id}">Read exact paragraph →</button></div>`).join('')}`:''}
   ${a.flags?.length?`<div class="overline" style="margin-top:12px">Check before relying</div>${a.flags.map(f=>`<div class="flag"><span>⚠</span><span>${esc(f)}</span></div>`).join('')}`:''}
   <div class="row" style="margin-top:12px">${a.more||''}<button class="btn sm" data-a="copyans">Copy answer with citations</button><button class="btn sm" data-a="savequery">★ Save this issue</button>${window.LLR_AI_ENDPOINT?'<button class="btn sm" data-a="refineai">Refine with the connected model</button>':''}</div>
   <div id="aiextra"></div><div class="disc">Compiled from the loaded statute text and case summaries. Verify against the judgment and the gazette. Not legal advice.</div></div>`;
}
function answerText(a){
  return [a.title, ...a.paras, '', ...(a.law||[]).map(l=>l[1]?`${l[0]} <-> ${l[1]}`:l[0]), '', ...a.cases.map(c=>`${c.name}, ${c.cite} (${c.court}${c.year?', '+c.year:''})`)].join('\n');
}

/* ---------- view ---------- */
VIEWS.research = () => {
  const q = parseHash().query.q;
  if(q !== undefined && RQ.q !== q) RQ = {q, cat:'All sources', adv:{}, f:{}, tab:'All', court:'All', sort:'rel', advOpen:false};
  const m = CAT_TO_TAB[RQ.cat]; if(m && !RQ._mapped){ RQ._mapped = true; RQ.tab = m[0]; if(m[1]) RQ.court = m[1]; }
  return `<div class="page"><div class="crumb"><a href="#/">Home</a> / Research</div>
  <div class="page-head"><div><h1>Research</h1><p class="lede">Ask a question, or search judgments, Acts, rules, regulations, notifications and circulars together. Supreme Court decisions come first.</p></div><button class="btn" data-a="uploadsum">↑ Upload a document to summarise</button></div>

  <div class="advanced ${RQ.advOpen?'open':''}" id="radvp" style="max-width:100%;margin:0 0 14px">${advForm(RQ.adv)}</div>

VIEWS.research.after = () => drawResearch(true);
function drawTabs(counts){
  const label = t => ({All:'All','LiveLaw reports':'LiveLaw reports'})[t]||t+(['Judgments','Acts','Rules','Regulations','Notifications','Circulars'].includes(t)?'':'');
  const moreActive = RQ.tab==='More' || R_MORE.includes(RQ.tab);
  return `<div class="tabs libtabs" style="margin:6px 0 14px">${R_TABS.map(t=>`<button class="${RQ.tab===t?'active':''}" data-a="rtab" data-v="${t}">${label(t)} <span class="tabcount">${counts[t]??0}</span></button>`).join('')}<select class="moretab ${moreActive?'active':''}" data-a="rmore" aria-label="More document types"><option value="">More</option>${R_MORE.map(t=>`<option ${RQ.tab===t?'selected':''}>${t}</option>`).join('')}</select></div>`;
}
function filterGroupHTML(label,key,list){ return `<div class="fgroup"><span class="fl">${label}</span>${list.map(o=>`<label class="opt"><input type="checkbox" data-rf="${key}" value="${esc(o)}" ${(RQ.f[key]||[]).includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`; }
function drawResearch(full){
  if(!$('rres')) return;
  const all = runSearchCore();
  const counts = {All:0}; all.forEach(o=>{ counts.All++; counts[o.d.tab]=(counts[o.d.tab]||0)+1; });
  counts.More = all.filter(o=>!R_TABS.includes(o.d.tab)).length;
  if(full){
    $('rtabs').innerHTML = drawTabs(counts);
    const issues = [...new Set(CASES.map(c=>c.issue))].sort();
    $('rfilters').innerHTML = `<div class="row between"><h3 style="margin:0">Filters</h3><button class="linkbtn" data-rclear>Clear</button></div>

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const _scripts = {};
function loadScript(url){ return _scripts[url] ||= new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=()=>{ delete _scripts[url]; rej(new Error('Could not load '+url)); }; document.head.appendChild(s); }); }

const VDB = (() => {
  let db = null, tried = false; const mem = new Map();
  const open = () => new Promise(res => {
    if(db || tried || !window.indexedDB) return res(db); tried = true;
    try{ const rq = indexedDB.open('llr-vault', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('docs', {keyPath:'id'}); rq.onsuccess = () => { db = rq.result; res(db); }; rq.onerror = () => res(null); rq.onblocked = () => res(null); }catch(e){ res(null); }
  });
  const run = async (mode, fn) => { const d = await open(); return new Promise((res,rej)=>{ const t = d.transaction('docs', mode); const r = fn(t.objectStore('docs')); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    async put(d){ if(!(await open())){ mem.set(d.id, d); return; } await run('readwrite', s=>s.put(d)); },
    async get(id){ if(!(await open())) return mem.get(id); return run('readonly', s=>s.get(id)); },
    async all(){ if(!(await open())) return [...mem.values()]; return run('readonly', s=>s.getAll()); },
    async del(id){ if(!(await open())){ mem.delete(id); return; } await run('readwrite', s=>s.delete(id)); },
    persistent(){ return !!db; }
  };
})();

const splitParas = text => text.replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.replace(/\s*\n\s*/g,' ').trim()).filter(s=>s.length>1);
async function pdfParas(buf){
  await loadScript(PDFJS); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise; const out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent(); const lines = [];
    tc.items.forEach(it => { if(!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5]); let L = lines.find(l=>Math.abs(l.y-y)<=2); if(!L){ L={y,items:[]}; lines.push(L); } L.items.push({x:it.transform[4], s:it.str}); });
    lines.sort((a,b)=>b.y-a.y);
    const texts = lines.map(l=>({y:l.y, t:l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()})).filter(l=>l.t);
    const gaps = []; for(let i=1;i<texts.length;i++) gaps.push(texts[i-1].y-texts[i].y);
    const med = [...gaps].sort((a,b)=>a-b)[Math.floor(gaps.length/2)] || 12;
    let cur = '';
    texts.forEach((l,i) => { const gap = i ? texts[i-1].y-l.y : 0; if(i && gap > med*1.5 && cur){ out.push({t:cur, pg:p}); cur=''; } if(cur.endsWith('-')) cur = cur.slice(0,-1)+l.t; else cur += (cur?' ':'')+l.t; });
    if(cur) out.push({t:cur, pg:p});
  }
  return {paras:out, pages:pdf.numPages};
}
async function extractFile(file){
  const name = file.name.toLowerCase(); const ext = (name.match(/\.([a-z0-9]+)$/)||[])[1]||'';
  if(ext==='pdf' || file.type==='application/pdf'){ const r = await pdfParas(await file.arrayBuffer()); return {...r, kind:'pdf'}; }
  if(ext==='docx'){ await loadScript(MAMMOTH); const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); return {paras: splitParas(r.value).map(t=>({t})), pages:0, kind:'docx'}; }
  if(['txt','md','text','rtf','html','htm'].includes(ext) || file.type.startsWith('text/')){ let t = await file.text(); if(/html?$/.test(ext)) t = new DOMParser().parseFromString(t,'text/html').body.textContent; const ps = splitParas(t); return {paras:(ps.length>1?ps:t.split('\n').filter(x=>x.trim()).map(x=>x.trim())).map(t=>({t})), pages:0, kind:'text'}; }
  if(file.type.startsWith('image/')) return {paras:[], pages:1, kind:'image'};
  return {paras:[], pages:0, kind:'other'};
}
const uid = () => 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function addToVault(file, folder){
  let ex; try{ ex = await extractFile(file); }catch(e){ ex = {paras:[], pages:0, kind:'other', error:String(e.message||e)}; }
  const doc = {id:uid(), name:file.name, type:file.type, size:file.size, added:Date.now(), folder:folder||'General', tags:[], blob:file, paras:ex.paras, pages:ex.pages, kind:ex.kind, error:ex.error||'', highlights:[], excerpts:[], notes:'', summary:null};
  await VDB.put(doc); return doc;
}

  const paras = doc.paras; const text = paras.map(p=>p.t).join('\n'); const sents = sentencesOf(paras);
  const freq = {}; text.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).forEach(w=>{ if(w.length>3 && !SW.has(w)) freq[w]=(freq[w]||0)+1; });
  const score = (s,i) => { const ws = s.t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>3&&!SW.has(w)); let v = ws.reduce((a,w)=>a+(freq[w]||0),0)/Math.pow(Math.max(ws.length,4),0.6); if(CUE.test(s.t)) v*=1.6; if(/\bSections?\s+\d|Article\s+\d|\bv\.\s/.test(s.t)) v*=1.15; if(s.p<2) v*=1.1; if(s.t.length>420) v*=0.7; return v; };
  const ranked = sents.map((s,i)=>({...s,v:score(s,i),i})).sort((a,b)=>b.v-a.v);
  const pick = (arr,n) => arr.slice(0,n).sort((a,b)=>a.i-b.i);
  const kind = docKind(text);
  const head = text.slice(0,1800);
  const pm = head.match(/([A-Z][\w.&'\u2019-]*(?:\s+[A-Z&][\w.&'\u2019-]*){0,5})\s+(?:v\.?|vs\.?|versus)\s+([A-Z][\w.&'\u2019-]*(?:\s+[A-Za-z&][\w.&'\u2019-]*){0,6}?)(?=[.,;(\n]|\s+\d|$)/);
  const cm2 = head.match(/\b(supreme court of india|high court of [a-z&]+(?:\s(?!at\b)[a-z&]+){0,3})/i);
  const cm = head.match(/(Supreme Court of India|High Court of [A-Z][A-Za-z&]+(?:\s[A-Za-z&]+){0,3}|[A-Z][a-z]+ High Court|National Company Law (?:Appellate )?Tribunal|Income Tax Appellate Tribunal|National Green Tribunal|[A-Z][A-Za-z ]+ Tribunal)/);
  const op = sents.filter(s=>s.p>=Math.floor(paras.length*0.7)).map((s,i)=>({...s,v:/\b(dismissed|allowed|set aside|directed|ordered|remitted|quashed|convicted|acquitted|decreed|disposed)\b/i.test(s.t)?5:0})).filter(s=>s.v).slice(0,4);
  const issues = sents.filter(s=>/\b(whether|question (?:before|for)|issue)\b/i.test(s.t)).slice(0,3);
  const duties = sents.filter(s=>/\b(shall|must|agrees? to|undertakes?|liable to|bound to|obliged)\b/i.test(s.t)).slice(0,6);
  const st = findStatutes(paras);
  return {kind, kindLabel:KIND_LABEL[kind], words:text.split(/\s+/).filter(Boolean).length, parties: pm?{a:pm[1].trim(), b:pm[2].split(/\.\s+(?=[A-Z])/)[0].replace(/[.,;]+$/,'').trim()}:null, court: cm?cm[1].trim():(cm2?cm2[1].toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bOf\b/g,'of'):''), overview: pick(ranked,5), operative: op, issues, duties, statutes: st.sections, articles: st.articles, cites: findCitations(paras), dates: findDates(paras).slice(0,10), amounts: findAmounts(paras).slice(0,6), deadlines: findDeadlines(paras).slice(0,8)};
}
function pref(i){ return `<button class="pref" data-a="gopara" data-v="${i}" title="Go to this passage">\u00b6${i+1}</button>`; }
function statuteLink(e){ const k = e.act+'-'+e.no.replace(/\(.*/,''); const tag = e.inferred ? ' <span class="muted">(Act inferred from context)</span>' : ''; return (NODES[k] && !NODES[k].stub ? `<button class="xref" data-open="${k}">${esc(e.actName)}, s.${esc(e.no)}</button>` : esc(`${e.actName}, s.${e.no}`)) + tag; }
function summaryHTML(doc, s){
  const sec = (title, body) => body ? `<div class="sum-sec"><h4>${title}</h4>${body}</div>` : '';
  const li = (arr, f) => arr.length ? `<ul class="sum-list">${arr.map(f).map(x=>`<li>${x}</li>`).join('')}</ul>` : '';
  const sent = x => `${esc(x.t)} ${pref(x.p)}`;
  let h = `<div class="callout" style="margin-bottom:12px"><b>Automatic summary, built in your browser</b>It selects the most important sentences and finds citations, dates and provisions. It does not rewrite or interpret. Check each point against the source paragraph.</div>
   <div class="sum-meta"><span class="pill note">${esc(s.kindLabel)}</span><span class="pill act">${s.words.toLocaleString('en-IN')} words</span>${doc.pages?`<span class="pill act">${doc.pages} page${doc.pages>1?'s':''}</span>`:''}${s.court?`<span class="pill act">${esc(s.court)}</span>`:''}</div>`;
  if(s.parties) h += sec('Parties', `<p style="margin:0"><b>${esc(s.parties.a)}</b> <span class="muted">v.</span> <b>${esc(s.parties.b)}</b></p>`);
  h += sec('In short', li(s.overview, sent));
  if(s.issues.length) h += sec('Issues raised', li(s.issues, sent));
  if(s.operative.length) h += sec(s.kind==='judgment'||s.kind==='order'?'Operative part (result)':'Closing terms', li(s.operative, sent));
  if(['agreement','notice'].includes(s.kind)||(s.duties.length&&s.kind!=='judgment')) h += sec('Obligations and terms', li(s.duties, sent));
  if(s.deadlines.length) h += sec('Time limits mentioned', li(s.deadlines, d=>`${esc(d.t)} ${pref(d.p)}`));
  if(s.dates.length) h += sec('Dates', `<table class="mini">${s.dates.map(d=>`<tr><td>${esc(d.d)}</td><td>${esc(d.ctx)} ${pref(d.p)}</td></tr>`).join('')}</table>`);
  if(s.amounts.length) h += sec('Amounts', li(s.amounts, a=>`${esc(a.a)} ${pref(a.p)}`));
  if(s.statutes.length||s.articles.length) h += sec('Provisions cited', li([...s.statutes.map(e=>`${statuteLink(e)} <span class="muted">\u00d7${e.count}</span> ${pref(e.p)}`), ...s.articles.map(e=>`Constitution of India, Article ${esc(e.no)} <span class="muted">\u00d7${e.count}</span> ${pref(e.p)}`)], x=>x));
  if(s.cites.length) h += sec('Cases cited', li(s.cites, c=>`${c.name?`<b>${esc(c.name)}</b> `:''}${esc(c.cite)} ${pref(c.p)}`));
  h += `<div class="row" style="margin-top:14px"><button class="btn sm" data-a="copysum">Copy summary</button><button class="btn sm" data-a="sum2excerpts">Save key points to excerpts</button>${window.LLR_AI_ENDPOINT?'<button class="btn sm" data-a="sumai">Improve with the connected model</button>':''}</div><div id="sumai"></div>`;
  return h;
}
function summaryText(doc, s){
  return [doc.name, s.kindLabel, s.parties?`${s.parties.a} v. ${s.parties.b}`:'', '', 'In short:', ...s.overview.map(x=>'- '+x.t+' (para '+(x.p+1)+')'), '', s.operative.length?'Result:':'', ...s.operative.map(x=>'- '+x.t), '', s.statutes.length?'Provisions: '+s.statutes.map(e=>`${e.actName} s.${e.no}`).join('; '):'', s.cites.length?'Cases: '+s.cites.map(c=>`${c.name} ${c.cite}`.trim()).join('; '):''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');

/* ---------- ask this document: grounded in passages, never invented ---------- */
function askDocument(doc, q){
  const s = doc._sum || (doc._sum = summariseDoc(doc)); const t = q.toLowerCase();
  const lst = (title, arr, f) => arr.length ? {title, items:arr.map(f)} : null;
  if(/\bparties|who (is|are)|petitioner|appellant|respondent/.test(t) && s.parties) return {title:'Parties', items:[`${s.parties.a} v. ${s.parties.b}`], para:0};
  if(/\b(when|date|dates|timeline|chronolog)/.test(t) && s.dates.length) return {title:'Dates found in the document', items:s.dates.map(d=>`${d.d}: ${d.ctx}`), refs:s.dates.map(d=>d.p)};
  if(/(statute|section|provision|act|article|law)s?\b.*(cited|referred|relied|invoked|mentioned)|which sections|provisions/.test(t)) return {title:'Provisions cited', items:[...s.statutes.map(e=>`${e.actName}, s.${e.no} (\u00d7${e.count})`), ...s.articles.map(e=>`Article ${e.no} (\u00d7${e.count})`)], refs:[...s.statutes.map(e=>e.p), ...s.articles.map(e=>e.p)]};
  if(/(cases?|precedents?|judgments?|authorit)(ies)?\b.*(cited|referred|relied)|cited cases/.test(t)) return {title:'Cases cited', items:s.cites.map(c=>`${c.name} ${c.cite}`.trim()), refs:s.cites.map(c=>c.p)};
  if(/\b(amount|sum|rs\.?|rupees|money|payable|compensation)\b/.test(t) && s.amounts.length) return {title:'Amounts mentioned', items:s.amounts.map(a=>a.a), refs:s.amounts.map(a=>a.p)};
  if(/\b(deadline|time limit|within how|period|days)\b/.test(t) && s.deadlines.length) return {title:'Time limits mentioned', items:s.deadlines.map(d=>d.t), refs:s.deadlines.map(d=>d.p)};
  if(/\b(result|outcome|held|decision|decided|order|relief|direction|conclusion|dispos)/.test(t) && s.operative.length) return {title:'Result', items:s.operative.map(x=>x.t), refs:s.operative.map(x=>x.p)};
  const terms = words(q); if(!terms.length) return null;
  const df = {}; doc.paras.forEach(p=>{ const set = new Set(words(p.t)); terms.forEach(w=>{ if(set.has(w)) df[w]=(df[w]||0)+1; }); });
  const N = doc.paras.length||1;
  const scored = doc.paras.map((p,i)=>{ const pw = words(p.t); let v=0; terms.forEach(w=>{ const tf = pw.filter(x=>x===w).length; if(tf) v += (1+Math.log(tf)) * Math.log(1+N/(df[w]||1)); }); return {i,v,t:p.t}; }).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const need = Math.max(1, Math.min(terms.length, 2));
  if(!scored.length || scored[0].v < 1.0*need) return null;
  return {title:'Most relevant passages', passages:scored};
}

function pickFiles(multi, cb){ const i=document.createElement('input'); i.type='file'; i.multiple=multi; i.accept='.pdf,.docx,.txt,.md,.rtf,.html,.png,.jpg,.jpeg'; i.style.display='none'; document.body.appendChild(i); i.onchange=()=>{ cb([...i.files]); i.remove(); }; i.click(); }

/* ---------- Reader ---------- */
VIEWS.doc = id => `<div class="page"><div class="crumb"><a href="#/">Home</a> / <a href="#/workspace">Workspace</a> / Document</div><div id="rdroot"><p class="muted">Opening document…</p></div></div>`;
VIEWS.doc.after = async id => {
  const d = await VDB.get(id);
  if(!d){ $('rdroot').innerHTML = '<div class="callout"><b>Document not found</b>It may have been deleted, or it was stored in a different browser.<div style="margin-top:10px"><button class="btn" data-go="/workspace">Back to the vault</button></div></div>'; return; }
  const tab = parseHash().query.tab;
  RD = {doc:d, tab: tab || 'Summary', find:'', color:'yellow', view:'text', cur:-1, qa:[], sel:null};
  d.highlights ||= []; d.excerpts ||= []; d._sum = null; drawReader();
};
function isHeading(t){ return t.length<90 && (/^[A-Z0-9 ,.'()\-:&]{4,}$/.test(t) || /^(\d+\.|[IVX]+\.|[A-Z]\.|chapter|section|clause|article|schedule|part)\b/i.test(t)); }
function paraHTML(i){
  const d = RD.doc, p = d.paras[i]; const marks = [];
  d.highlights.filter(h=>h.p===i).forEach(h=>marks.push({s:h.s,e:h.e,cls:'hl hl-'+h.color+(h.note?' noted':''),id:h.id}));
  if(RD.find){ const t=p.t.toLowerCase(), f=RD.find.toLowerCase(); let k=0; while((k=t.indexOf(f,k))>=0){ marks.push({s:k,e:k+f.length,cls:'find',find:true}); k+=f.length; } }
  marks.sort((a,b)=>a.s-b.s||a.find-b.find); let out='', pos=0;
  marks.forEach(m=>{ if(m.s<pos) return; out += esc(p.t.slice(pos,m.s)); out += `<${m.find?'mark':'span'} class="${m.cls}" ${m.id?`data-hl="${m.id}"`:''}>${esc(p.t.slice(m.s,m.e))}</${m.find?'mark':'span'}>`; pos = m.e; });
  out += esc(p.t.slice(pos));
  const pg = (i===0 || (p.pg && d.paras[i-1].pg!==p.pg)) && p.pg ? `<div class="pgbreak">Page ${p.pg}</div>` : '';
  return `${pg}<div class="dp" id="dp-${i}" data-p="${i}"><span class="pn">¶${i+1}</span><span class="pt">${out}</span></div>`;
}
function drawText(){ const d=RD.doc; $('rdtext').innerHTML = d.paras.map((_,i)=>paraHTML(i)).join('') || '<p class="muted">No text could be read from this file.</p>'; const c=$('findcount'); if(c){ const n=$('rdtext').querySelectorAll('mark.find').length; c.textContent = RD.find ? n+' match'+(n===1?'':'es') : ''; } }
function drawReader(){
  const d = RD.doc, words = d.paras.reduce((n,p)=>n+p.t.split(/\s+/).length,0);
  const outline = d.paras.map((p,i)=>({p,i})).filter(o=>isHeading(o.p.t)).slice(0,30);
  $('rdroot').innerHTML = `<div class="page-head"><div><div class="row"><span class="pill note">${esc((KIND_TAG[d.kind]||'FILE'))}</span><span class="pill act">${esc(d.folder)}</span>${d.pages?`<span class="pill act">${d.pages} page${d.pages>1?'s':''}</span>`:''}<span class="pill act">${words.toLocaleString('en-IN')} words</span></div><h1 style="margin-top:8px;font-size:28px">${esc(d.name)}</h1></div>
    <div class="row"><button class="btn" data-a="rdview" data-v="${RD.view==='text'?'orig':'text'}">${RD.view==='text'?'View original file':'Back to text reader'}</button><button class="btn" data-a="rddownload">Download</button><button class="btn" data-go="/workspace">← Vault</button></div></div>
   <div class="rd-layout"><aside class="card rd-side"><div class="overline">Find in document</div><input class="field" id="rdfind" placeholder="Search this document" value="${esc(RD.find)}" aria-label="Search this document"><div class="row" style="margin:6px 0 12px"><small class="muted" id="findcount"></small><button class="linkbtn" data-a="findnext">Next ↓</button></div>
     ${outline.length?`<div class="overline">Outline</div><div class="outline">${outline.map(o=>`<button data-a="gopara" data-v="${o.i}">${esc(o.p.t.length>44?o.p.t.slice(0,42)+'…':o.p.t)}</button>`).join('')}</div>`:''}
     <div class="overline" style="margin-top:12px">Highlights (${d.highlights.length})</div><div id="hllist"></div></aside>
    <section class="rd-main"><div class="rd-bar"><span class="muted" style="font-size:13px">Select text to highlight, note or save it as an excerpt.</span></div><div id="rdmain"></div></section>
    <aside class="card rd-right"><div class="rd-tabs">${['Summary','Ask','Excerpts','Notes'].map(t=>`<button class="${RD.tab===t?'active':''}" data-a="rdtab" data-v="${t}">${t}${t==='Excerpts'?` (${d.excerpts.length})`:''}</button>`).join('')}</div><div id="rdpanel"></div></aside></div>`;
  drawMain(); drawHlList(); drawRdPanel();
  const f = $('rdfind'); f.addEventListener('input', ()=>{ RD.find=f.value.trim(); RD.cur=-1; drawText(); });
}
function drawMain(){
  const d = RD.doc, m = $('rdmain'); if(RD.view==='orig'){
    const url = URL.createObjectURL(d.blob);
    m.innerHTML = d.kind==='pdf' ? `<iframe src="${url}" title="${esc(d.name)}" style="width:100%;height:78vh;border:1px solid var(--line);border-radius:12px"></iframe>` : d.kind==='image' ? `<img src="${url}" alt="${esc(d.name)}" style="max-width:100%;border:1px solid var(--line);border-radius:12px">` : '<div class="callout">Word and text files cannot be shown in their original layout here. Use Download to open them in another application.</div>'; return; }
  m.innerHTML = d.kind==='image' ? `<img src="${URL.createObjectURL(d.blob)}" alt="${esc(d.name)}" style="max-width:100%;border:1px solid var(--line);border-radius:12px"><div class="callout" style="margin-top:12px"><b>No text to read</b>Images are stored for viewing and notes. Text recognition (OCR) is not available in this prototype.</div>` : `<div class="rd-text" id="rdtext"></div>`;
  if($('rdtext')){ drawText(); if(!d.paras.length) $('rdtext').innerHTML = `<div class="callout"><b>No selectable text found</b>${d.error?esc(d.error):'This file may be a scanned image. OCR is not available in this prototype. You can still view the original and add notes.'}</div>`; }
}
function drawHlList(){ const d=RD.doc; const el=$('hllist'); if(!el) return; el.innerHTML = d.highlights.map(h=>`<div class="rd-hl"><span class="sw hl-${h.color}"></span><button class="tx" data-a="gopara" data-v="${h.p}" title="Go to passage">${esc((d.paras[h.p].t.slice(h.s,h.e)).slice(0,70))}${h.note?`<br><i class="muted">${esc(h.note.slice(0,60))}</i>`:''}</button><button class="iconbtn sm" data-a="hldel" data-v="${h.id}" aria-label="Remove highlight">✕</button></div>`).join('') || '<small class="muted">None yet</small>'; }
function drawRdPanel(){
  const d=RD.doc, el=$('rdpanel'); document.querySelectorAll('.rd-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.v===RD.tab));
  if(RD.tab==='Summary'){
    if(!d.paras.length){ el.innerHTML='<div class="callout">There is no text to summarise. If this is a scanned document, OCR is needed.</div>'; return; }
    const s = d._sum ||= summariseDoc(d); el.innerHTML = summaryHTML(d, s);
  } else if(RD.tab==='Ask'){
    el.innerHTML = `<p class="muted" style="margin-top:0">Ask about this document. Answers quote the document and point to the paragraph. If it is not in the document, it says so.</p><div class="row" style="flex-wrap:nowrap"><input class="field" id="rdq" placeholder="e.g. Was the notice served in time?" aria-label="Question about this document"><button class="btn navy" data-a="rdask">Ask</button></div><div class="chips" style="margin:8px 0">${['Who are the parties?','What is the result?','Which sections are cited?','What dates are mentioned?'].map(x=>`<button class="chip" data-a="rdsugg" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div><div id="rdqa">${RD.qa.map(qaHTML).join('')}</div>`;
  } else if(RD.tab==='Excerpts'){
    el.innerHTML = `<p class="muted" style="margin-top:0">Passages you have pulled out, with their source. Add your own note to each.</p>${d.excerpts.map((x,i)=>`<div class="exc"><q>${esc(x.text.length>420?x.text.slice(0,418)+'…':x.text)}</q><span class="src">${esc(d.name)}, ¶${x.p+1}${d.paras[x.p]?.pg?', p.'+d.paras[x.p].pg:''}</span><textarea rows="2" data-a="excnote" data-v="${x.id}" placeholder="Your note">${esc(x.note||'')}</textarea><div class="row"><button class="btn sm" data-a="gopara" data-v="${x.p}">Go to source</button><button class="btn sm" data-a="excup" data-v="${i}" ${i?'':'disabled'}>↑</button><button class="btn sm" data-a="excdown" data-v="${i}" ${i<d.excerpts.length-1?'':'disabled'}>↓</button><button class="btn sm" data-a="excdel" data-v="${x.id}">Remove</button></div></div>`).join('') || '<div class="callout">No excerpts yet. Select text in the document and choose Excerpt.</div>'}${d.excerpts.length?'<div class="row"><button class="btn sm" data-a="exccopy">Copy all with citations</button><button class="btn sm" data-a="excdraft">Send to a draft</button></div>':''}`;
  } else {
    el.innerHTML = `<p class="muted" style="margin-top:0">Private notes about this document. Saved automatically.</p><textarea class="field" id="rdnotes" rows="14" placeholder="Your observations, arguments, questions…">${esc(d.notes||'')}</textarea>`;
  }
}
const qaHTML = x => `<div class="qa"><div class="q">${esc(x.q)}</div>${x.a?(x.a.passages?x.a.passages.map(p=>`<div style="margin-bottom:6px">${esc(p.t.length>320?p.t.slice(0,318)+'…':p.t)} ${pref(p.i)}</div>`).join(''):`<b>${esc(x.a.title)}</b><ul>${x.a.items.map((it,k)=>`<li>${esc(it)} ${x.a.refs&&x.a.refs[k]!==undefined?pref(x.a.refs[k]):(x.a.para!==undefined?pref(x.a.para):'')}</li>`).join('')}</ul>`):'<span class="muted">This is not stated in the document. Try different words, or read the relevant section directly.</span>'}</div>`;
function goPara(i){ if(RD.view!=='text'){ RD.view='text'; drawMain(); } const el=$('dp-'+i); if(!el) return; el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

/* ---------- selection toolbar ---------- */
document.body.insertAdjacentHTML('beforeend', `<div class="seltool" id="seltool" role="toolbar" aria-label="Selection tools"><button class="dot hl-yellow" data-a="selhl" data-v="yellow" aria-label="Highlight yellow"></button><button class="dot hl-green" data-a="selhl" data-v="green" aria-label="Highlight green"></button><button class="dot hl-red" data-a="selhl" data-v="red" aria-label="Highlight red"></button><button class="dot hl-blue" data-a="selhl" data-v="blue" aria-label="Highlight blue"></button><button data-a="selnote">Note</button><button data-a="selexc">Excerpt</button><button data-a="selask">Ask</button></div>`);
function hideSel(){ $('seltool').classList.remove('show'); }
document.addEventListener('mouseup', e => {
  if(!e.target.closest || !e.target.closest('#rdtext')) { if(!e.target.closest('#seltool')) hideSel(); return; }
  setTimeout(()=>{
    const sel = getSelection(); if(!sel || sel.isCollapsed || !RD.doc){ hideSel(); return; }
    const r = sel.getRangeAt(0); const a = (r.startContainer.nodeType===3?r.startContainer.parentElement:r.startContainer).closest('.pt'), b = (r.endContainer.nodeType===3?r.endContainer.parentElement:r.endContainer).closest('.pt');
    if(!a || !b){ hideSel(); return; }
    const pa = +a.parentElement.dataset.p, pb = +b.parentElement.dataset.p; const text = sel.toString().trim(); if(!text){ hideSel(); return; }
    let s=0, en=0; if(a===b){ const pre = document.createRange(); pre.selectNodeContents(a); pre.setEnd(r.startContainer, r.startOffset); s = pre.toString().length; en = s + r.toString().length; }
    RD.sel = {p:pa, pb, s, e:en, text, single:a===b};
    const rect = r.getBoundingClientRect(); const t=$('seltool'); t.classList.add('show'); t.style.left = Math.max(8, Math.min(window.innerWidth-300, rect.left + rect.width/2 - 130))+'px'; t.style.top = Math.max(70, rect.top - 52)+'px';
  }, 10);
});
function addHighlight(color){
  const s = RD.sel; if(!s) return null; if(!s.single){ notify('Highlights work within one paragraph. Use Excerpt for longer passages.'); return null; }
  const h = {id:uid(), p:s.p, s:s.s, e:s.e, color, note:''}; RD.doc.highlights.push(h); saveDoc(); getSelection().removeAllRanges(); hideSel(); drawText(); drawHlList(); return h;
}
function editNote(hid){
  const h = RD.doc.highlights.find(x=>x.id===hid); if(!h) return;
  openModal(`<div class="m-head"><h2 style="margin:0">Note on this passage</h2><button class="iconbtn" data-closemodal aria-label="Close">✕</button></div><div class="court-words" style="margin-bottom:10px"><span class="ph-text" style="font-style:normal">${esc(RD.doc.paras[h.p].t.slice(h.s,h.e))}</span></div><textarea class="field" id="hlnote" rows="4" placeholder="Your note">${esc(h.note||'')}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-closemodal>Cancel</button><button class="btn primary" data-a="hlnotesave" data-v="${hid}">Save note</button></div>`); setTimeout(()=>$('hlnote')?.focus(),50);
}
function confirmModal(msg, action, v){ openModal(`<h2 style="margin-top:0">${esc(msg)}</h2><p class="muted">This cannot be undone.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-closemodal>Cancel</button><button class="btn primary" data-a="${action}" data-v="${esc(v)}">Delete</button></div>`); }

/* ---------- actions ---------- */
Object.assign(ACTIONS, {
  vpick: () => pickFiles(true, f=>ingest(f)),
  uploadsum: () => pickFiles(false, f=>ingest(f, true)),
  vsample: async () => { const text = SAMPLE_DOC_PARAS.join('\n\n'); const d = {id:uid(), name:'Sample judgment (synthetic).txt', type:'text/plain', size:text.length, added:Date.now(), folder:'Research', tags:[], blob:new Blob([text],{type:'text/plain'}), paras:SAMPLE_DOC_PARAS.map(t=>({t})), pages:0, kind:'text', error:'', highlights:[], excerpts:[], notes:'', summary:null}; await VDB.put(d); addHistory(d.name,'doc','/doc/'+d.id); go('/doc/'+d.id+'?tab=Summary'); },
  vopen: el => go('/doc/'+el.dataset.v),
  vsum: el => go('/doc/'+el.dataset.v+'?tab=Summary'),
  vfolder: el => { VS.folder = el.dataset.v; drawFolderChips(); drawVaultList(); },
  vnewfolder: () => { openModal(`<div class="m-head"><h2 style="margin:0">New folder</h2><button class="iconbtn" data-closemodal aria-label="Close">✕</button></div><input class="field" id="nfname" placeholder="e.g. Meera Traders v. Anand"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-closemodal>Cancel</button><button class="btn primary" data-a="nfsave">Create</button></div>`); setTimeout(()=>$('nfname')?.focus(),50); },
  nfsave: () => { const n=$('nfname').value.trim(); if(!n) return; const f=getFolders(); if(!f.includes(n)) f.push(n); store('vfolders',f); closeModal(); VS.folder=n; drawFolderChips(); drawVaultList(); },
  vdel: el => confirmModal('Delete this document from the vault?','vdelok',el.dataset.v),
  vdelok: async el => { await VDB.del(el.dataset.v); closeModal(); VS.docs = await VDB.all(); drawFolderChips(); drawVaultList(); notify('Document deleted'); },
  rmsaved: el => { const [k,id]=el.dataset.v.split(':'); if(k==='i') store('saved', getSaved().filter(x=>x.id!==id)); else store('savedActs', getSavedActs().filter(x=>x!==id)); route(); },
  deldraft: el => { if(typeof getDrafts==='function'){ store('drafts', getDrafts().filter(d=>d.id!==el.dataset.v)); route(); } },
  rdtab: el => { RD.tab = el.dataset.v; drawRdPanel(); },
  rdview: el => { RD.view = el.dataset.v; drawReader(); },
  rddownload: () => { const d=RD.doc; const a=document.createElement('a'); a.href=URL.createObjectURL(d.blob); a.download=d.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); },
  gopara: el => goPara(+el.dataset.v),
  findnext: () => { const ms=[...document.querySelectorAll('#rdtext mark.find')]; if(!ms.length) return; ms.forEach(m=>m.classList.remove('cur')); RD.cur=(RD.cur+1)%ms.length; ms[RD.cur].classList.add('cur'); ms[RD.cur].scrollIntoView({behavior:'smooth',block:'center'}); },
  selhl: el => { addHighlight(el.dataset.v); },
  selnote: () => { const h = addHighlight('yellow'); if(h) editNote(h.id); },
  selexc: () => { const s=RD.sel; if(!s) return; RD.doc.excerpts.push({id:uid(), p:s.p, text:s.text, note:'', t:Date.now()}); saveDoc(); getSelection().removeAllRanges(); hideSel(); RD.tab='Excerpts'; drawRdPanel(); notify('Saved to excerpts'); },
  selask: () => { const s=RD.sel; hideSel(); RD.tab='Ask'; drawRdPanel(); if(s) $('rdq').value = s.text.slice(0,200); $('rdq').focus(); },
  hlnotesave: el => { const h=RD.doc.highlights.find(x=>x.id===el.dataset.v); if(h){ h.note=$('hlnote').value.trim(); saveDoc(); } closeModal(); drawText(); drawHlList(); },
  hldel: el => { RD.doc.highlights = RD.doc.highlights.filter(h=>h.id!==el.dataset.v); saveDoc(); drawText(); drawHlList(); },
  excdel: el => { RD.doc.excerpts = RD.doc.excerpts.filter(x=>x.id!==el.dataset.v); saveDoc(); drawRdPanel(); },
  excup: el => { const a=RD.doc.excerpts, i=+el.dataset.v; [a[i-1],a[i]]=[a[i],a[i-1]]; saveDoc(); drawRdPanel(); },
  excdown: el => { const a=RD.doc.excerpts, i=+el.dataset.v; [a[i+1],a[i]]=[a[i],a[i+1]]; saveDoc(); drawRdPanel(); },
  exccopy: () => { const d=RD.doc; copyText(d.excerpts.map((x,i)=>`${i+1}. “${x.text}”\n   (${d.name}, ¶${x.p+1}${d.paras[x.p]?.pg?', p.'+d.paras[x.p].pg:''})${x.note?'\n   Note: '+x.note:''}`).join('\n\n'), 'Excerpts copied with citations'); },
  excdraft: () => { const d=RD.doc; store('draftInsert', d.excerpts.map(x=>({text:x.text, src:`${d.name}, ¶${x.p+1}`, note:x.note||''}))); go('/drafting'); },
  rdask: () => { const q=$('rdq').value.trim(); if(!q) return; RD.qa.unshift({q, a:askDocument(RD.doc,q)}); drawRdPanel(); },
  rdsugg: el => { $('rdq').value = el.dataset.v; ACTIONS.rdask(); },
  copysum: () => copyText(summaryText(RD.doc, RD.doc._sum), 'Summary copied'),
  sum2excerpts: () => { const d=RD.doc, s=d._sum; s.overview.forEach(x=>{ if(!d.excerpts.some(e=>e.text===x.t)) d.excerpts.push({id:uid(), p:x.p, text:x.t, note:'', t:Date.now()}); }); saveDoc(); RD.tab='Excerpts'; drawRdPanel(); notify('Key points saved to excerpts'); },
  sumai: async () => { const box=$('sumai'); box.innerHTML='<p class="muted">Sending the extracted text to the endpoint you configured…</p>'; try{ const r=await fetch(window.LLR_AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:'summarise',text:RD.doc.paras.map(p=>p.t).join('\n\n').slice(0,60000)})}); const j=await r.json(); box.innerHTML=`<div class="quote">${esc(j.answer||j.summary||'No summary returned')}<span class="src">Generated by the connected model. Verify against the document.</span></div>`; }catch(e){ box.innerHTML='<div class="flag"><span>⚠</span><span>Could not reach the connected model.</span></div>'; } }
});
document.addEventListener('input', e => {
  const t=e.target;
  if(t.id==='vq'){ VS.q=t.value; drawVaultList(); }
  else if(t.id==='rdnotes'){ RD.doc.notes=t.value; saveDoc(); }
  else if(t.matches && t.matches('[data-a="excnote"]')){ const x=RD.doc.excerpts.find(y=>y.id===t.dataset.v); if(x){ x.note=t.value; saveDoc(); } }
});
document.addEventListener('change', e => {
  const t=e.target;
  if(t.id==='vsort'){ VS.sort=t.value; drawVaultList(); }
  else if(t.matches && t.matches('select[data-a="vmove"]')){ const d=VS.docs.find(x=>x.id===t.dataset.v); if(d){ d.folder=t.value; VDB.put(d).then(()=>{ drawFolderChips(); drawVaultList(); notify('Moved to '+t.value); }); } }
});
document.addEventListener('click', e => {
  const h = e.target.closest && e.target.closest('[data-hl]'); if(h && RD.doc){ editNote(h.dataset.hl); }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='rdq'){ e.preventDefault(); ACTIONS.rdask(); } else if(e.key==='Enter' && e.target.id==='rdfind'){ e.preventDefault(); ACTIONS.findnext(); } });

/* ===== CALENDAR: month / week / day / agenda, reminders, Section 138 deadline helper ===== */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const addMonths = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth()+n, 1); const last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const sameDay = (a,b) => ymd(a)===ymd(b);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const REMIND = {none:['No reminder',null],0:['At the time',0],15:['15 minutes before',15],60:['1 hour before',60],1440:['1 day before',1440],2880:['2 days before',2880]};
let CAL = {view:load('calview','month'), date:new Date(), hidden:load('calhidden',[])};
CAL.date.setHours(0,0,0,0);

function expandEvents(from, to){
  const out = []; const f = new Date(from).setHours(0,0,0,0), t = new Date(to).getTime();
  getEvents().forEach(e => {
    const base = parseYmd(e.date); const push = d => { const x = {...e, date:ymd(d), oid:e.id+'@'+ymd(d)}; x.ts = new Date(x.date+'T'+(e.allDay?'00:00':(e.start||'09:00'))).getTime(); if(x.ts>=f && x.ts<=t) out.push(x); };
    if(!e.repeat || e.repeat==='none'){ push(base); return; }
    const limit = addMonths(base, 24); let d = new Date(base), guard = 0;
    while(d <= limit && d.getTime() <= t && guard++ < 800){ push(d); d = e.repeat==='daily' ? addDays(d,1) : e.repeat==='weekly' ? addDays(d,7) : addMonths(base, Math.round((d.getFullYear()-base.getFullYear())*12 + d.getMonth()-base.getMonth()+1)); }

/* ---------- quick add ---------- */
function parseQuick(s){
  const t = s.trim(); const low = t.toLowerCase(); const today = new Date(); today.setHours(0,0,0,0); let date = null; let rest = t;
  let m = t.match(/(\d{1,2})(?:st|nd|rd|th)?\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s*,?\s*(\d{4})?/i);
  if(m){ date = new Date(m[3]?+m[3]:today.getFullYear(), MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase()), +m[1]); rest = rest.replace(m[0],''); }
  else if((m = t.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/))){ date = new Date(+m[3], +m[2]-1, +m[1]); rest = rest.replace(m[0],''); }
  else if(/\btomorrow\b/i.test(t)){ date = addDays(today,1); rest = rest.replace(/\btomorrow\b/i,''); }
  else if(/\btoday\b/i.test(t)){ date = today; rest = rest.replace(/\btoday\b/i,''); }
  else if((m = t.match(/\bin\s+(\d+)\s+days?\b/i))){ date = addDays(today,+m[1]); rest = rest.replace(m[0],''); }
  else if((m = t.match(/\b(?:next\s+)?(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/i))){ const idx = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf(m[1].toLowerCase()); let diff = (idx - today.getDay() + 7) % 7 || 7; date = addDays(today,diff); rest = rest.replace(m[0],''); }
  let start = null; const tm = t.match(/(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i) || t.match(/\bat\s+(\d{1,2}):(\d{2})\b/i);
  if(tm){ let h = +tm[1]; const ap = (tm[3]||'').toLowerCase(); if(ap==='pm' && h<12) h+=12; if(ap==='am' && h===12) h=0; start = `${pad(h)}:${tm[2]||'00'}`; rest = rest.replace(tm[0],''); }
  rest = rest.replace(/^\s*(remind me (of|about|to)|add|schedule)\s*/i,'').replace(/\s+on\s*$/i,'').replace(/\s+/g,' ').replace(/[,\s]+$/,'').trim();
  const type = /hearing|listed|argument/.test(low) ? 'Hearing' : /limitation/.test(low) ? 'Limitation' : /deadline|file|filing|reply|written statement/.test(low) ? 'Filing deadline' : /meeting|call|conference/.test(low) ? 'Meeting' : /draft/.test(low) ? 'Drafting' : 'Other';
  return {title: rest ? rest.charAt(0).toUpperCase()+rest.slice(1) : '', type, date: date?ymd(date):ymd(CAL.date), allDay: !start && type!=='Hearing' && type!=='Meeting', start: start||'10:00', end: start ? `${pad((+start.slice(0,2)+1)%24)}:${start.slice(3)}` : '11:00', found: !!date};
}

function checkReminders(){

  expandEvents(new Date(now-864e5), new Date(now+3*864e5)).forEach(e=>{
    const r = REMIND[e.remind]; if(!r || r[1]===null) return; const due = e.ts - r[1]*60000; if(now >= due && now < e.ts + 36e5 && !fired[e.oid]){
      fired[e.oid] = now; notify('Reminder: '+e.title+(e.allDay?'':' at '+to12(e.start)));
      try{ if('Notification' in window && Notification.permission==='granted') new Notification('LiveLaw Research reminder', {body:e.title+(e.allDay?'':' at '+to12(e.start))}); }catch(x){}
    }
  }); store('fired', fired);

function checkDraft(){
  const text = curText(); const paras = text.split(/\n+/).map(t=>({t})).filter(p=>p.t.trim()); const out = [];
  const blanks = $('dreditor').querySelectorAll('.ph-field').length; out.push(blanks ? ['warn', `${blanks} blank${blanks>1?'s':''} still to fill in (highlighted in the draft).`] : ['ok','No blanks left.']);
  const st = findStatutes(paras);
  st.sections.forEach(e=>{
    const lab = {ipc:'IPC',crpc:'CrPC',iea:'Evidence Act'}[e.act];
    if(lab){ const row = CROSSWALK.find(r=>r.old.toLowerCase()===(lab+' '+e.no).toLowerCase()); out.push(['warn', `${e.actName}, s.${e.no}: the ${lab} was repealed on 1 July 2024. Use it only for offences or proceedings that fall under the old law.${row?` Corresponding provision: ${row.nw} (${REL_LABEL[row.rel].toLowerCase()}, unverified).`:''}`]); }
    else if(['bns','bnss','bsa'].includes(e.act)) out.push(['ok', `${e.actName}, s.${e.no}: in force from 1 July 2024. Applies to offences on or after that date.`]);
    else if(!['ni'].includes(e.act)) out.push(['info', `${e.actName}, s.${e.no}: not in the loaded library. Verify the section number.`]);
  });
  findCitations(paras).forEach(c=>{ const k = CASES.find(x=>x.cite.replace(/\s+/g,' ')===c.cite); if(k){ out.push([/overrid|distinguish/i.test(k.treat||'')?'warn':'ok', `${k.name}, ${k.cite}: ${k.treat?'treatment recorded as “'+k.treat+'”.':'found in the database.'} ${k.note?k.note:''}`]); } else out.push(['info', `${c.name||''} ${c.cite}: not in the sample database. Verify the citation against the report.`]); });
  if(!st.sections.length && !findCitations(paras).length) out.push(['info','No statute or case citations found.']);
  $('drcheckres').innerHTML = `<div style="margin-top:10px">${out.map(o=>`<div class="chk ${o[0]}"><span>${o[0]==='ok'?'✓':o[0]==='warn'?'⚠':'ℹ'}</span><span>${esc(o[1])}</span></div>`).join('')}</div>`;
}

/* ===== COMPARE: old law <-> new law, in the manner of a translation tool ===== */
const CMP = {pair:'ipc-bns', dir:'fwd', q:'', filter:'', tab:'all'};
const pairOf = id => PAIRS.find(p=>p.id===id);
const sideLaws = () => { const p = pairOf(CMP.pair); return CMP.dir==='fwd' ? {from:p.old, to:p.nw} : {from:p.nw, to:p.old}; };
const LAW_OPTIONS = PAIRS.flatMap(p=>[p.old,p.nw]);
const numOf = (label, pre) => label.slice(pre.length).trim().toUpperCase().replace(/\s+AND RELATED$/,'').replace(/\s+/g,'');
function cmpRows(){ const p = pairOf(CMP.pair); return CROSSWALK.filter(r=>r.code===p.code); }
function cmpMatch(){
  const q = CMP.q.trim().toUpperCase().replace(/^(SECTION|SEC\.?|S\.?)\s*/,'').replace(/\s+/g,''); if(!q) return null;
  const {from} = sideLaws(); const key = CMP.dir==='fwd' ? 'old' : 'nw';
  return cmpRows().filter(r => r[key]!=='—' && (numOf(r[key], from.pre)===q || numOf(r[key], from.pre).replace(/\(.*\)/,'')===q));
}
function relPill(rel){ return `<span class="pill ${rel==='renumbered'||rel==='identical'?'same':rel==='new'?'new':rel==='omitted'||rel==='reframed'||rel==='split'?'warn':'note'}">${esc(REL_LABEL[rel])}</span>`; }
function cmpResultHTML(){
  const {from,to} = sideLaws(); const m = cmpMatch();
  if(m===null) return `<div class="cmp-empty"><b>The matching provision appears here.</b><p class="muted">Choose the law on each side, then type a section number on the left, for example 302 in the ${esc(from.name)}.</p></div>`;
  if(!m.length){ const near = cmpRows().filter(r=>r[CMP.dir==='fwd'?'old':'nw']!=='—').slice(0,8).map(r=>numOf(r[CMP.dir==='fwd'?'old':'nw'], from.pre).replace(/\(.*\)/,'')); return `<div class="cmp-empty"><b>No correspondence for ${esc(from.short)} ${esc(CMP.q.trim())} in this sample.</b><p class="muted">The prototype holds a sample of sections. The full table needs the official comparison tables.</p><div class="chips">${[...new Set(near)].map(n=>`<button class="chip" data-a="cmpchip" data-v="${esc(n)}">${esc(from.short)} ${esc(n)}</button>`).join('')}</div></div>`; }
  return m.map(r => {
    const tgt = CMP.dir==='fwd' ? r.nw : r.old; const src = CMP.dir==='fwd' ? r.old : r.nw; const none = tgt==='—';
    const th = headOf(tgt), sh = headOf(src); const oldN = r.oldKey && NODES[r.oldKey], newN = r.nwKey && NODES[r.nwKey]; const both = oldN && newN && !oldN.stub && !newN.stub;
    return `<div class="cmp-hit"><div class="row between"><span class="overline" style="margin:0">${esc(to.name)}</span>${relPill(r.rel)}</div>
     <div class="big">${none ? (r.rel==='omitted' ? 'Omitted' : 'No predecessor') : esc(tgt)}</div>${th&&!none?`<div class="hd">${esc(th)}</div>`:''}
     <p class="why">${none ? (r.rel==='omitted' ? `${esc(from.short)} ${esc(numOf(src,from.pre))} is not carried into the ${esc(to.short)}.` : `${esc(src)} is new and has no ${esc(to.short)} predecessor.`) : `${esc(src)}${sh&&sh!==th?` (${esc(sh)})`:''} corresponds to ${esc(tgt)}.`} ${esc(r.note)}</p>
     <div class="row" style="gap:8px"><span class="pill ${r.pun==='Same'?'same':r.pun==='Changed'?'warn':'act'}">Punishment: ${esc(r.pun)}</span><span class="pill ph">Verification pending</span></div>
     ${both?`<div class="row" style="margin-top:10px"><button class="btn sm navy" data-a="cmpfull" data-v="${esc(r.oldKey)}|${esc(r.nwKey)}">Compare the wording</button><button class="btn sm" data-go="/section/${CMP.dir==='fwd'?r.nwKey:r.oldKey}">Open ${esc(tgt)} →</button></div>`:''}
     <div class="row" style="margin-top:8px"><button class="btn sm" data-a="cmpcopy" data-v="${esc(src)} ↔ ${esc(tgt)}: ${esc(r.note)}">Copy</button></div></div>`; }).join('');
}
VIEWS.compare = () => {
  const q = parseHash().query.q; if(q){ const c = parseCite(q); if(c){ const p = PAIRS.find(p=>p.old.key===c.act || p.nw.key===c.act); if(p){ CMP.pair = p.id; CMP.dir = p.old.key===c.act ? 'fwd' : 'rev'; CMP.q = c.no.replace(/\(.*\)/,''); } } else CMP.filter = q; }
  const {from,to} = sideLaws();
  return `<div class="page"><div class="crumb"><a href="#/">Home</a> / <a href="#/statutes">Statutes</a> / Compare old and new law</div>
  <div class="page-head" style="margin-bottom:14px"><div><h1>Compare old and new law</h1><p class="lede" style="margin:4px 0 0">Choose a law on each side, type a section number, and see where it went. Works both ways.</p></div><button class="btn" data-go="/statutes">← Statute library</button></div>
  <div class="banner amber" style="margin-bottom:16px"><div><b>The new codes took effect on 1 July 2024</b><p>An offence committed before that date is still tried under the Indian Penal Code, the Code of Criminal Procedure and the Indian Evidence Act (see the repeal and savings clauses and Article 20(1) of the Constitution). Check the date of the offence, not the date of the FIR.</p></div></div>
  <div class="cmp-top"><select class="field cmpsel" id="cmpL" aria-label="Compare from">${LAW_OPTIONS.map(l=>`<option value="${l.key}" ${l.key===from.key?'selected':''}>${esc(l.name)}</option>`).join('')}</select><button class="swapbtn" data-a="cmpswap" aria-label="Swap the two laws" title="Swap">⇄</button><select class="field cmpsel" id="cmpR" aria-label="Compare to">${LAW_OPTIONS.map(l=>`<option value="${l.key}" ${l.key===to.key?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div>
  <div class="cmp-grid"><div class="cmp-card"><label class="overline" for="cmpq">Section in the ${esc(from.name)}</label><input id="cmpq" class="cmp-in" inputmode="text" autocomplete="off" placeholder="e.g. ${from.key==='ipc'?'302':from.key==='bns'?'103':from.key==='crpc'?'438':from.key==='bnss'?'482':from.key==='iea'?'65B':'63'}" value="${esc(CMP.q)}" aria-label="Section number"><button class="cmp-x ${CMP.q?'':'hidden'}" data-a="cmpclear" aria-label="Clear">✕</button>
    <div class="overline" style="margin-top:18px">Try</div><div class="chips" id="cmpchips"></div></div>
   <div class="cmp-card out" id="cmpout" aria-live="polite">${cmpResultHTML()}</div></div>
  <div id="cmpfull"></div>
  <div class="row between" style="margin:30px 0 10px"><h2 style="margin:0">All correspondences in this sample</h2><div class="row"><span class="seg" id="cmptabs">${[['all','All'],['ipc','IPC ↔ BNS'],['crpc','CrPC ↔ BNSS'],['iea','Evidence ↔ BSA']].map(x=>`<button class="${CMP.tab===x[0]?'active':''}" data-a="cmptab" data-v="${x[0]}">${x[1]}</button>`).join('')}</span><button class="btn sm" data-a="cmpcsv">↓ Export CSV</button></div></div>
  <input class="field" id="cmpfilter" placeholder="Filter the table, for example theft, bail or 420" value="${esc(CMP.filter)}" style="margin-bottom:10px" aria-label="Filter the table">
  <div class="tablewrap"><table class="xw"><thead><tr><th>Old law</th><th>New law</th><th>Relation</th><th>What changed</th><th>Punishment</th><th>Verified</th></tr></thead><tbody id="cmpbody"></tbody></table></div>
  <p class="footer-note">Reference tool. Mappings come from the official comparison tables and still need editor verification. Partial and one-to-many mappings are shown as separate rows and are never presented as simple equivalence. Check the gazette for authoritative text.</p></div>`;
};
VIEWS.compare.after = () => { drawCmpChips(); drawCmpTable(); };
VIEWS.crosswalk = VIEWS.compare;
function drawCmpChips(){ const {from} = sideLaws(); const key = CMP.dir==='fwd'?'old':'nw'; const nums = [...new Set(cmpRows().map(r=>r[key]).filter(x=>x!=='—').map(x=>numOf(x, from.pre).replace(/\(.*\)/,'')))].slice(0,9); const e=$('cmpchips'); if(e) e.innerHTML = nums.map(n=>`<button class="chip" data-a="cmpchip" data-v="${esc(n)}">${esc(from.short)} ${esc(n)}</button>`).join(''); }
function drawCmpTable(){
  const f = CMP.filter.trim().toLowerCase(); const rows = CROSSWALK.filter(r => (CMP.tab==='all'||r.code===CMP.tab) && (!f || (r.old+' '+r.nw+' '+r.note+' '+(headOf(r.old)||'')+' '+(headOf(r.nw)||'')).toLowerCase().includes(f)));
  const b = $('cmpbody'); if(!b) return;
  b.innerHTML = rows.map(r=>`<tr><td><b>${esc(r.old)}</b>${headOf(r.old)?`<br><small class="muted">${esc(headOf(r.old))}</small>`:''}${r.oldKey&&NODES[r.oldKey]&&!NODES[r.oldKey].stub?`<br><button class="xref" data-open="${r.oldKey}" style="font-size:12.5px">Preview</button>`:''}</td><td><b>${esc(r.nw)}</b>${headOf(r.nw)?`<br><small class="muted">${esc(headOf(r.nw))}</small>`:''}${r.nwKey&&NODES[r.nwKey]&&!NODES[r.nwKey].stub?`<br><button class="xref" data-open="${r.nwKey}" style="font-size:12.5px">Preview</button>`:''}</td><td>${relPill(r.rel)}</td><td>${esc(r.note)}</td><td>${esc(r.pun)}</td><td><span class="pill ph">Pending</span></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No rows match. Only a sample of sections is loaded.</td></tr>';
}
function cmpRefresh(full){ if(full){ const {from,to}=sideLaws(); $('cmpL').value=from.key; $('cmpR').value=to.key; const inp=$('cmpq'); inp.placeholder='e.g. '+({ipc:'302',bns:'103',crpc:'438',bnss:'482',iea:'65B',bsa:'63'})[from.key]; document.querySelector('label[for="cmpq"]').textContent='Section in the '+from.name; drawCmpChips(); } $('cmpout').innerHTML = cmpResultHTML(); $('cmpfull').innerHTML=''; document.querySelector('.cmp-x').classList.toggle('hidden', !CMP.q); }
function setLeft(key){ const p = PAIRS.find(p=>p.old.key===key||p.nw.key===key); CMP.pair = p.id; CMP.dir = p.old.key===key ? 'fwd' : 'rev'; }
Object.assign(ACTIONS, {

  cmpfull: el => { const [o,n] = el.dataset.v.split('|'); $('cmpfull').innerHTML = `<div class="card" style="margin-top:16px"><div class="row between"><h3 style="margin:0">${esc(nodeLabel(NODES[o]))} compared with ${esc(nodeLabel(NODES[n]))}</h3><button class="btn sm" data-a="cmpfullclose">Close</button></div>${compareHTML()}</div>`; $('cmpfull').scrollIntoView({behavior:'smooth',block:'start'}); },
  cmpfullclose: () => { $('cmpfull').innerHTML=''; }

  if(d.asksugg){ const [q,k,id] = d.asksugg.split('|'); $('q-'+id).value = q; $('a-'+id).innerHTML = askAnswer(k, q); return; }
  if(d.closemodal!==undefined){ closeModal(); return; }
  if(d.report!==undefined){ reportError(d.report); return; }
  if(d.senderr!==undefined){ closeModal(); notify('Thanks. In the live product this goes to the editors'); return; }
  if(d.font!==undefined){ const cur = +load('reader',19); setReader(d.font==='0'?19:Math.max(16,Math.min(26,cur+ +d.font*2))); return; }
  if(d.savepage!==undefined){ const a = NEWS.find(x=>x.id===current.args[0])||NEWS[0]; addSaved({id:'art_'+a.id, kind:'art', title:a.title, go:'/article/'+a.id}); return; }
  if(d.share!==undefined){ copyText(location.href, 'Link copied'); return; }
  if(d.print!==undefined){ window.print(); return; }
  if(d.xwcode){ XW.code=d.xwcode; document.querySelectorAll('[data-xwcode]').forEach(b=>b.classList.toggle('active', b.dataset.xwcode===d.xwcode)); drawXW(); return; }
  if(d.exportxw!==undefined){ const rows=[['Old','New','Relation','What changed','Punishment','Verified']].concat(CROSSWALK.map(r=>[r.old,r.nw,REL_LABEL[r.rel],r.note,r.pun,'Pending'])); const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='old-new-crosswalk-sample.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1200); return; }
  if(d.rclear!==undefined){ RQ.f={}; route(); return; }
  if(d.newalert!==undefined){ const v=$('newAlert').value.trim(); if(!v){ notify('Describe the issue first'); return; } const a=getAlerts(); a.unshift({id:'a'+Date.now(),title:v,scope:$('newScope').value,on:true,feed:[]}); store('alerts',a); refreshBell(); route(); return; }
  if(d.alertdel){ store('alerts', getAlerts().filter(a=>a.id!==d.alertdel)); refreshBell(); route(); return; }
  if(d.readfeed){ const [id,i]=d.readfeed.split('|'); const a=getAlerts(); const x=a.find(y=>y.id===id); if(x) x.feed[+i].unread=false; store('alerts',a); refreshBell(); route(); return; }
  if(d.upload!==undefined){ const f=$('fileInput'); if(f) f.click(); else { go('/workspace'); setTimeout(()=>$('fileInput')?.click(),150); } return; }
  if(d.opendoc){ curDoc=+d.opendoc; showDoc(load('docs',[])[curDoc]); return; }
  if(d.savedocnotes!==undefined){ if(curDoc<0){ notify('Upload a document first'); return; } const ds=load('docs',[]); ds[curDoc].notes=$('docNotes').value; store('docs',ds); notify('Notes saved'); return; }
  if(d.fmt){ document.execCommand(d.fmt,false,null); $('draft').focus(); return; }
  if(d.printdraft!==undefined){ const w=window.open('','_blank'); if(!w){ notify('Allow pop-ups to print'); return; } w.document.write('<html><body style="font-family:Georgia;max-width:780px;margin:48px auto">'+$('draft').innerHTML+'</body></html>'); w.document.close(); w.focus(); w.print(); return; }
  if(d.parserem!==undefined){ parseReminder(); return; }
  if(d.addrem!==undefined){ const ti=$('remTitle').value.trim(), dt=$('remDate').value; if(!ti||!dt){ notify('Enter a title and date'); return; } const r=load('reminders',[]); r.push({title:ti,date:dt}); store('reminders',r); renderRems(); notify('Reminder saved'); return; }
  if(d.ics!==undefined){ exportICS(); return; }
  if(d.gcal!==undefined){ openGcal(); return; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if(t.matches('[data-filterlist]')){ const v=t.value.toLowerCase(); document.querySelectorAll('#chlist .chap,#chlist .sec').forEach(b=>b.style.display = b.textContent.toLowerCase().includes(v)?'':'none'); }
  else if(t.id==='xwq') drawXW();
  else if(t.matches('[data-rt]')){ RQ.f[t.dataset.rt]=t.value; drawResearch(); }
  else if(t.id==='draft'){ clearTimeout(draftT); draftT=setTimeout(()=>{ store('draft',$('draft').innerHTML); notify('Draft saved locally'); },700); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-rf]')){ const k=t.dataset.rf; const s=new Set(RQ.f[k]||[]); t.checked ? s.add(t.value) : s.delete(t.value); RQ.f[k]=[...s]; drawResearch(); }
  else if(t.id==='rsort') drawResearch();
  else if(t.id==='fileInput') handleFile(e);
  else if(t.matches('[data-chk]')){ const [k,i]=t.dataset.chk.split('|'); store('chk_'+k+'_'+i, t.checked); }
  else if(t.matches('[data-alerton]')){ const a=getAlerts(); const x=a.find(y=>y.id===t.dataset.alerton); if(x) x.on=t.checked; store('alerts',a); refreshBell(); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closeModal(); closePanel(); $('lookdrop').classList.remove('show'); }
  else if(e.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){ e.preventDefault(); $('lookup').focus(); }
});
$('scrim').addEventListener('click', () => closePanel());
window.addEventListener('hashchange', route);


/* ===== INIT (loaded last) ===== */
seedEvents(); if(load('histopen',false)) setHist(true); setupLookup(); refreshBell(); setReader(+load('reader',19)); route();

</script>
</body>
