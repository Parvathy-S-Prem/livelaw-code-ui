/* ---------- microphone and document upload on every search bar ---------- */
const SX_SEL='#homeQ,#rq,#libq,#vq,#histQ,#mq,#dflibq,#rvq,#lookup,#ccq';
const STOP=new Set('the and for that this with from have been were their which shall will under such upon into than then them they there where when also any all not are was has had its may can our you your his her him she who whom whose other said same these those being before after between against within without hereby herein thereof thereto'.split(' '));
function keyTerms(t){
  const c={};(t.toLowerCase().match(/[a-zऀ-ॿഀ-ൿ]{4,}/g)||[]).forEach(w=>{if(!STOP.has(w))c[w]=(c[w]||0)+1});
  return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]).join(' ');
}
function sxSubmit(inp){
  const box=inp.closest('.searchbox,.libsearch,.lookup'),go_=box&&box.querySelector('button.go');
  if(go_){go_.click();return}
  if(inp.id==='lookup')inp.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
}
function sxMic(btn,inp){
  if(btn._rec){btn._rec.stop();return}
  const base=inp.value?inp.value.replace(/\s*$/,' '):'';
  const l=(LANGS.find(x=>x[0]===vlang())||LANGS[0])[2];
  btn.classList.add('rec');
  btn._rec=dictate({lang:l,
    onText:(f,i)=>{inp.value=base+f+(i?' '+i:'');inp.dispatchEvent(new Event('input',{bubbles:true}))},
    onError:er=>{btn.classList.remove('rec');btn._rec=null;gtoast(er==='unsupported'?'Voice typing needs Chrome, Edge or Safari. You can still type.':er==='not-allowed'?'Microphone blocked. Allow it in the browser address bar.':er==='no-speech'?'Did not catch anything. Try again.':'Voice typing stopped ('+er+')')},
    onEnd:()=>{btn.classList.remove('rec');btn._rec=null;if(inp.value.trim())sxSubmit(inp)}});
  if(btn._rec)gtoast('Listening… speak now');else btn.classList.remove('rec');
}
function sxUpload(inp){
  pickFile(async f=>{
    let t;try{t=await readFileText(f)}catch(e){gtoast(e.message);return}
    const k=keyTerms(t);if(!k){gtoast('No searchable text found in that file');return}
    inp.value=k;inp.dispatchEvent(new Event('input',{bubbles:true}));sxSubmit(inp);gtoast('Searching with key terms from '+f.name);
  });
}
const SXI=(p)=>`<svg class="sxi" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
function sxScan(){
  document.querySelectorAll(SX_SEL).forEach(inp=>{
    if(inp.dataset.sx||inp.tagName!=='INPUT')return;inp.dataset.sx='1';
    const w=document.createElement('span');w.className='sxw';
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    const m=document.createElement('button'),u=document.createElement('button');
    m.type=u.type='button';m.className=u.className='sxbtn';
    m.setAttribute('aria-label','Search by voice');m.title='Search by voice';m.innerHTML=SXI(IC.mic);
    u.setAttribute('aria-label','Search using a document');u.title='Upload a document to search with';u.innerHTML=SXI(IC.upload);
    m.onclick=e=>{e.preventDefault();e.stopPropagation();sxMic(m,inp)};
    u.onclick=e=>{e.preventDefault();e.stopPropagation();sxUpload(inp)};
    w.appendChild(m);w.appendChild(u);
  });
}
(function(){
  let raf=0;
  const start=()=>{sxScan();new MutationObserver(()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;sxScan()})}).observe(document.body,{childList:true,subtree:true})};
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();


/* ---------- STATUTE WORKSPACE: the Act on the left, the LiquidText-style workspace on the right ---------- */
function statWsText(x){
  let h = `<h3 class="dt">${esc(lawTitle(x))}</h3>`;
  if(x.key && TOC[x.key]){
    const secs = actSections(x.key);
    [...new Set(secs.map(s=>s.ch))].forEach(ch => {
      h += `<h4 class="dh">Chapter ${esc(ch)}${chName(x.key,ch)?' · '+esc(chName(x.key,ch)):''}</h4>`;
      secs.filter(s=>s.ch===ch).forEach(s => { const n = s.key && NODES[s.key]; h += `<h4 class="sh" id="ws-${esc(s.no)}" data-no="${esc(s.no)}">Section ${esc(s.no)}. ${esc(s.title)}</h4>` + (n ? statBody(n) : '<p class="muted">The text of this section is not loaded in this sample.</p>'); });
    });
  } else h += `<p>${esc(x.subject)} · ${esc(x.state||x.jur)} · ${esc(STATUS_LABEL[x.status])}</p><p class="muted">The full text of this law is not loaded in this prototype. You can still add notes to the workspace.</p>`;
  return h;
}
function viewStatWs(id, q){
  const x = lawById(id) || CENTRAL.find(c => c.key===id);
  if(!x){ window.go('/statutes'); return; }
  const d = {id:'stat-'+x.id}, secs = x.key && TOC[x.key] ? actSections(x.key) : [];
  app.innerHTML = `<div class="page wspage"><div class="crumb"><a href="#/statutes">Statutes</a> / <a href="#/savedlaws">Saved statutes</a> / ${esc(lawTitle(x))}</div>
   <div class="ohead"><div><h1>${esc(lawTitle(x))}</h1><div class="sub">Statute workspace. Select text on the left and pull it across to build your notes.</div></div>
    <div class="acts">${secs.length?`<select class="field" id="swjump" aria-label="Jump to a section"><option value="">Jump to a section…</option>${secs.map(s=>`<option value="${esc(s.no)}">Section ${esc(s.no)} · ${esc(s.title.length>40?s.title.slice(0,38)+'…':s.title)}</option>`).join('')}</select>`:''}<button class="btn" id="swopen">Open Act page</button><button class="btn navy" id="swdl">${ico('down','sm')} Download</button></div></div>
   <div class="wsgrid"><section class="wsleft" aria-label="Statute"><div class="outbox" id="outbox"><div class="statpaper"><div class="pbody" id="pbody">${statWsText(x)}</div></div></div></section>
    <section class="wsright" aria-label="Workspace"><div class="lqhead"><div><h2 style="margin:0">${ico('grid')} Workspace</h2><small class="muted" id="lqcount"></small></div>
     <div class="lqtools" id="lqtools"><button class="btn sm" data-t="note">${ico('stickynote','sm')} Note</button><button class="btn sm" data-t="tidy">Tidy</button><button class="btn sm" data-t="export">${ico('copy','sm')} Copy all</button><button class="btn sm ghost" data-t="clear">Clear</button></div></div>
     <div class="lqhint">Select text in the Act, then <b>Pull to workspace</b> or drag it across. Link cards with ${ico('link','sm')} to build your argument.</div>
     <select class="field" id="lqpull" aria-label="Pull a paragraph"></select>
     <div class="lqcanvas" id="lqcanvas"><div class="lqinner" id="lqinner"></div></div></section></div></div>`;
  const stop = wsInit(d); cleanup = () => stop();
  $('#swopen').onclick = () => window.go(x.key==='const' ? '/constitution' : (x.key && TOC[x.key]) ? '/act/'+x.key : '/actinfo/'+x.id);
  $('#swdl').onclick = () => dlAct(x.id);
  const j = $('#swjump'); if(j) j.onchange = () => { const el = document.getElementById('ws-'+j.value); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); };
  if(q && q.s){ setTimeout(() => { const el = document.getElementById('ws-'+q.s); if(el) el.scrollIntoView({block:'start'}); }, 80); }
}

window.__dfRender=()=>{if(cleanup){cleanup();cleanup=null}render()};

})();
VIEWS.drafting = () => '<div id="dfApp"><div id="dfMain"></div><div class="toast" id="dfToast" role="status" aria-live="polite"></div></div>';
VIEWS.drafting.after = () => window.__dfRender();

/* ===== INIT (loaded last) ===== */
seedEvents(); if(load('histopen',false)) setHist(true); setupLookup(); refreshBell(); setReader(+load('reader',19)); route();
