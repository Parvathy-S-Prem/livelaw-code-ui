2.1px;font-weight:750;color:var(--accent);text-transform:uppercase;margin-bottom:20px}.hero h1{font-size:clamp(62px,8.2vw,116px);font-weight:750;letter-spacing:-8px;line-height:1;margin:0 0 22px}.hero .sub{font-size:16px;color:#676c76;line-height:1.8;margin:0 auto 35px;max-width:650px}.searchbox{display:flex;align-items:center;border:1px solid #cfd2d6;border-radius:11px;box-shadow:0 8px 22px rgba(24,24,30,.045);max-width:745px;margin:auto;background:white;padding:7px 7px 7px 18px;gap:10px}.searchbox input{border:0;outline:none;flex:1;min-width:20px;font-size:14px;padding:11px}.searchbox select{border:0;outline:0;max-width:154px;background:white;color:#666;font-size:12px;border-left:1px solid var(--line);padding:10px}.searchbox button,.redbtn{background:var(--accent);border:0;color:white;border-radius:7px;padding:13px 18px;font-weight:650}.searchbox button:hover,.redbtn:hover{background:var(--accentdark)}.suggestions{display:flex;gap:12px;align-items:center;justify-content:center;margin:18px auto 0;color:#93969c;font-size:12px;flex-wrap:wrap}.suggestions button{border:none;background:none;color:#666;border-bottom:1px dotted #bbb;padding:2px}.hero-actions{display:flex;gap:9px;justify-content:center;margin-top:39px}.outline{border:1px solid #dfe1e4;background:white;border-radius:6px;padding:12px 18px;color:#383a40;font-size:12px;font-weight:650}.outline:hover{border-color:#b71f26;color:var(--accent)}.sectionline{border-top:1px solid var(--line);padding:30px 0 62px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}.sectionhead h2{font-size:18px;letter-spacing:-.4px;margin:0}.kicker{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#8e9197;text-transform:uppercase}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.tile{text-align:left;min-height:160px;background:white;border:1px solid var(--line);border-radius:9px;padding:22px;display:flex;flex-direction:column;align-items:flex-start;transition:.2s} :#50535a}.filterbtn.selected,.filterbtn:hover{background:#fff4f4;color:#a8212b}.workarea{min-height:380px}.editor{border:1px solid var(--line);border-radius:9px;width:100%;min-height:300px;padding:22px;outline:none;font-size:13px;line-height:1.9}.editor:focus{border-color:#bf8f91}.notice{font-size:11px;color:#92969d;line-height:1.8}.empty{padding:46px 20px;text-align:center;color:#818690;font-size:13px}.toast{position:fixed;bottom:26px;right:26px;background:#202127;color:white;border-radius:7px;padding:13px 18px;font-size:12px;z-index:100;display:none}.overlay{display:none;position:fixed;inset:0;background:rgba(25,27,30,.32);z-index:49}.drawer{position:fixed;right:-510px;top:0;height:100vh;width:min(500px,100vw);background:white;z-index:50;box-shadow:-10px 0 60px #0002;transition:right .2s;display:flex;flex-direction:column}.drawer.open{right:0}.overlay.show{display:block}.drawerheader{display:flex;align-items:center;justify-content:space-between;padding:25px 28px;border-bottom:1px solid var(--line)}.drawerbody{padding:30px;overflow:auto;line-height:1.8}.drawerbody h2{letter-spacing:-.9px;font-size:27px;margin:4px 0 17px}.drawerbody p{font-size:13px;color:#646a72}.drawer .close{border:0;background:#f3f4f5;padding:9px 12px;border-radius:5px}.mobilelinks{display:none}.footer{border-top:1px solid var(--line);padding:24px 0;color:#9a9da3;font-size:11px}.footer .layout{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap} @media(max-width:1050px){.nav{gap:12px}.nav button{font-size:11px}.headeract{gap:8px}}@media(max-width:820px){header{padding:0 20px}.nav{display:none}.mobilemenu{display:block}.mobilelinks{display:none;position:fixed;top:72px;left:0;right:0;background:white;border-bottom:1px solid var(--line);z-index:23;padding:12px 24px}.mobilelinks.show{display:grid}.mobilelinks button{border:0;background:white;text-align:left;padding:12px}.hero{padding:76px 0 70px}.hero h1{letter-spacing:-5px}.tiles{grid-template-columns:1fr 1fr}.gridside{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}@media(max-width:500px){.layout{padding:0 19px}.tiles{grid-template-columns:1fr 1fr;gap:9px}.tile{padding:16px;min-height:153px}.searchbox{flex-wrap:wrap}.searchbox input{flex-basis:60%}.searchbox select{max-width:120px}.hero-actions{flex-wrap:wrap}.logo{font-size:17px}.headeract .pill{display:none}.page{padding-top:28px}}
</style></head><body>
<header><a href="#home" class="logo" onclick="go('home')"><span class="live">Live</span><span class="law">Law</span><span class="code">Code.</span></a><nav class="nav"><button data-go="home">Home</button><button data-go="judgments">Judgments</button><button data-go="legislation">Acts, Statutes & Rules</button><button onclick="window.open('https://www.livelaw.in/','_blank','noopener')">Legal News ↗</button><button data-go="workspace">Research Workspace</button></nav><div class="headeract"><button class="pill" onclick="focusSearch()">⌕ &nbsp; Global search</button><div class="menuwrap"><button class="pill" aria-label="Account menu">☷ &nbsp;Account ▾</button><div class="dropdown"><div class="smallmeta">MY ACCOUNT</div><button data-go="saved">☆ &nbsp; Saved Items</button><button data-go="alerts">♧ &nbsp; Alerts & Notifications</button><button data-go="profile">◉ &nbsp; User Profile</button><button data-go="settings">⚙ &nbsp; Settings</button></div></div><button class="mobilemenu" onclick="document.querySelector('.mobilelinks').classList.toggle('show')">☰</button></div></header>
<div class="mobilelinks"><button data-go="home">Home</button><button data-go="judgments">Judgments</button><button data-go="legislation">Acts, Statutes, Rules & Regulations</button><button data-go="workspace">Research Workspace</button><button data-go="saved">Saved Items</button><button data-go="alerts">Alerts & Notifications</button><button data-go="profile">Profile</button><button onclick="window.open('https://www.livelaw.in/','_blank')">LiveLaw News ↗</button></div>
<main id="app"></main><footer class="footer"><div class="layout"><span>LiveLaw Code · Statutes connected to your reading</span><span>Article → Section → Supreme Court → High Courts</span><span>UI / UX PROTOTYPE · Illustrative records</span></div></footer>
<div class="overlay" id="overlay" onclick="closeDrawer()"></div><aside class="drawer" id="drawer"><div class="drawerheader"><b>LiveLaw Code · Quick reference</b><button class="close" onclick="closeDrawer()">✕</button></div><div class="drawerbody" id="drawerbody"></div></aside><div class="toast" id="toast"></div>
<script>
const cats=['All categories','Case names','Acts','Sections','Rules','Notifications','Citations','Judges','Courts','Keywords','Legal topics'];const records=[{id:'s138',type:'Sections',title:'Section 138 — Dishonour of cheque',sub:'Negotiable Instruments Act, 1881',body:'Illustrative quick reference: offence relating to dishonour of cheque for insufficiency of funds in the account.',court:'Statute'}, {id:'actni',type:'Acts',title:'Negotiable Instruments Act, 1881',sub:'Central legislation · India',body:'Provisions on negotiable instruments including promissory notes, bills of exchange and cheques.',court:'Statute'}, {id:'j1',type:'Case names',title:'Rangappa v. Sri Mohan',sub:'(2010) 11 SCC 441 · Supreme Court of India',body:'Illustrative search entry concerning presumption in cheque dishonour proceedings under the NI Act.',court:'Supreme Court'}, {id:'j2',type:'Case names',title:'Indian Bank Association v. Union of India',sub:'(2014) 5 SCC 590 · Supreme Court of India',body:'Illustrative search entry concerning Section 138 proceedings.',court:'Supreme Court'}, {id:'j3',type:'Case names',title:'K. Bhaskaran v. Sankaran Vaidhyan Balan',sub:'(1999) 7 SCC 510 · Supreme Court of India',body:'Illustrative search entry connected with cheque dishonour.',court:'Supreme Court'}, {id:'actcpc',type:'Acts',title:'Code of Civil Procedure, 1908',sub:'Central legislation · India',body:'Consolidated statutory reference and procedural rules for civil matters.',court:'Statute'}, {id:'rule1',type:'Rules',title:'Rules and Regulations',sub:'Central and state legal materials',body:'Browse rules, subordinate legislation, regulations, government notifications and circulars.',court:'Legislation'}, {id:'circ',type:'Notifications',title:'Notifications and Circulars',sub:'Circulars, notifications and regulatory updates',body:'Browse circulars and official notifications by authority and subject.',court:'Legislation'}];
let page='home',category='All categories',query='',filter='All',drawerRecord=null;const app=document.getElementById('app');const saved=()=>JSON.parse(localStorage.getItem('ll_saved')||'[]');function notify(m){let t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window.nt);window.nt=setTimeout(()=>t.style.display='none',2200)}function go(p){page=p;location.hash=p;document.querySelector('.mobilelinks').classList.remove('show');render();window.scrollTo(0,0)}function focusSearch(){go('home');setTimeout(()=>document.getElementById('query')?.focus(),70)}function searchNow(){query=document.getElementById('query')?.value||query;category=document.getElementById('category')?.value||category;go('results')}function searchTerm(s){query=s;category='All categories';go('results')}function save(id){let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];localStorage.setItem('ll_saved',JSON.stringify(a));notify(a.includes(id)?'Saved to your items':'Removed from saved items');render();if(drawerRecord)openRecord(drawerRecord)}function openRecord(id){drawerRecord=id;let r=records.find(x=>x.id===id);if(!r)return;document.getElementById('drawerbody').innerHTML=`<div class="kicker">${r.type.toUpperCase()} · QUICK REFERENCE</div><h2>${r.title}</h2><p><b>${r.sub}</b></p><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><p>${r.body}</p><p class="notice">This is a UI prototype with illustrative summaries. For authoritative law, consult official sources and the complete judgment.</p><div class="row" style="margin-top:26px"><button class="redbtn" onclick="save('${r.id}')">${saved().includes(id)?'★ Saved':'☆ Save item'}</button><button class="outline" onclick="go('judgments');closeDrawer()">Related judgments →</button></div>`;document.getElementById('overlay').classList.add('show');document.getElementById('drawer').classList.add('open')}function closeDrawer(){document.getElementById('overlay').classList.remove('show');document.getElementById('drawer').classList.remove('open');drawerRecord=null}
const btn=(name,p,desc,ico)=>`<button class="tile" onclick="go('${p}')"><span class="ico">${ico}</span><strong>${name} ↗</strong><small>${desc}</small></button>`;
function home(){return `<section class="hero"><div class="eyebrow">THE LAW, CONNECTED</div><h1>Code.</h1><p class="sub">From the provision to the precedent. Search statutes, read sections and discover relevant judgments — all in one place.</p><form class="searchbox" onsubmit="event.preventDefault();searchNow()"><span style="color:#999;font-size:24px">⌕</span><input id="query" placeholder="Try ‘138 NI Act’ or ‘cheque dishonour’" value="${esc(query)}"><select id="category">${cats.map(x=>`<option ${x===category?'selected':''}>${x}</option>`).join('')}</select><button type="submit">Search →</button></form><div class="suggestions"><span>TRY SEARCHING</span><button onclick="searchTerm('138 NI Act')">138 NI Act</button><button onclick="searchTerm('cheque dishonour')">cheque dishonour</button><button onclick="searchTerm('Supreme Court')">Supreme Court</button></div><div class="hero-actions"><button class="outline" onclick="openRecord('s138')">Article demo ↗</button><button class="outline" onclick="notify('Prototype only — developer documentation is not connected')">For developers ↗</button></div></section><section class="sectionline"><div class="sectionhead"><h2>Explore the law</h2><span class="kicker">ALL-SECTION NAVIGATION</span></div><div class="tiles">${btn('Browse Acts','legislation','Acts, statutes, regulations and circulars','▤')}${btn('Read a section','sections','Navigate to provisions and section references','§')}${btn('Judgments on this section','judgments','Explore connected judicial decisions','⚖')}${btn('Saved sections','saved','Return to the research you saved','☆')}</div></section><div class="strip"><span><b>LiveLaw Code</b> · Section reference and research</span><span>Selected judgments, not a complete database</span></div>`}
function head(t,desc,k='LEGAL RESEARCH'){return `<div class="pagetop"><div class="kicker">${k}</div><h1>${t}</h1><p>${desc}</p></div>`}function item(r){return `<article class="result"><div class="row space"><span class="tag">${r.type}</span><span class="tiny muted">${r.court}</span></div><h3>${r.title}</h3><p><b>${r.sub}</b><br>${r.body}</p><div class="row space"><button class="textbtn" onclick="openRecord('${r.id}')">Open quick reference →</button><button class="textbtn" onclick="save('${r.id}')">${saved().includes(r.id)?'★ Saved':'☆ Save'}</button></div></article>`}function results(data,title,desc){return `<div class="page">${head(title,desc)}<div class="gridside"><div class="panel panelpad" style="align-self:start"><b style="font-size:13px">Filter results</b><div style="margin-top:17px">${['All','Case names','Acts','Sections','Rules','Notifications'].map(x=>`<button class="filterbtn ${filter===x?'selected':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div></div><div class="panel">${data.filter(x=>filter==='All'||x.type===filter).length?data.filter(x=>filter==='All'||x.type===filter).map(item).join(''):'<div class="empty">No matching sample records. Try another category.</div>'}</div></div></div>`}function matches(r){if(category!=='All categories'&&category!=='Keywords'&&category!=='Legal topics'&&category!=='Courts'&&category!=='Judges'&&category!=='Citations'&&category!==r.type)return false;return !query||[r.title,r.sub,r.body,r.court,'138 NI Act cheque dishonour'].join(' ').toLowerCase().includes(query.toLowerCase())}function legis(){return `<div class="page">${head('Acts, Statutes, Rules & Regulations','Browse legislation, sections, subordinate rules, regulations, notifications and circulars.','STATUTORY RESEARCH')}<div class="tiles" style="margin-bottom:24px">${btn('Acts & Statutes','sections','Search central and state statutes','▤')}${btn('Rules','rules','Subordinate legislation and rules','▦')}${btn('Regulations','rules','Regulatory instruments','◇')}${btn('Circulars & Notifications','notifications','Official notices and circulars','◷')}</div><div class="panel">${records.filter(x=>['Acts','Rules','Notifications','Sections'].includes(x.type)).map(item).join('')}</div></div>`}function workspace(){return `<div class="page">${head('Research Workspace','Collect excerpts, organise notes and build a connected research trail.','YOUR WORKSPACE')}<div class="grid2"><div class="panel panelpad"><div class="row space" style="margin-bottom:15px"><b>Research notes</b><button class="textbtn" onclick="saveNotes()">Save notes →</button></div><div contenteditable="true" id="notes" class="editor" data-placeholder="Start writing your notes...">${localStorage.getItem('ll_notes')||'Start your research notes here. Highlight passages, compare sections and record important citations.'}</div><p class="notice">Select text to use your browser’s highlighting or copy tools. Notes are saved locally in this browser.</p></div><div class="panel panelpad"><b>Saved references</b><div style="margin-top:17px">${saved().map(id=>records.find(x=>x.id===id)).filter(Boolean).map(r=>`<button class="filterbtn" onclick="openRecord('${r.id}')">☆ ${r.title}</button>`).join('')||'<p class="notice">No saved references yet. Save a section or judgment to bring it into the workspace.</p>'}</div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><b>Citation collection</b><p class="notice">Open a saved reference to view its citation and context. Advanced LiquidText-style PDF linking and document annotation would require additional integration.</p></div></div></div>`}function saveNotes(){localStorage.setItem('ll_notes',document.getElementById('notes').innerHTML);notify('Notes saved in this browser')}function account(p){let m={saved:['Saved Items','Revisit bookmarked sections and judgments.'],alerts:['Alerts & Notifications','Track legal topics and important updates.'],profile:['User Profile','Manage your account information.'],settings:['Settings','Choose how you want to use this research interface.']}[p];if(p==='saved')return `<div class="page">${head(...m,'MY ACCOUNT')}<div class="panel">${saved().length?saved().map(id=>records.find(x=>x.id===id)).filter(Boolean).map(item).join(''):'<div class="empty">No saved items yet. Bookmark a section or judgment to see it here.</div>'}</div></div>`;if(p==='profile')return `<div class="page">${head(...m,'MY ACCOUNT')}<div class="panel panelpad" style="max-width:620px"><label class="field">Full name<input id="pname" placeholder="Enter full name" value="${esc(localStorage.getItem('ll_name')||'')}"></label><label class="field">Email<input id="pemail" type="email" placeholder="name@example.com" value="${esc(localStorage.getItem('ll_email')||'')}"></label><label class="field">Phone number<input id="pphone" type="tel" placeholder="Enter phone number" value="${esc(localStorage.getItem('ll_phone')||'')}"></label><button class="redbtn" onclick="['name','email','phone'].forEach(x=>localStorage.setItem('ll_'+x,document.getElementById('p'+x).value));notify('Profile saved locally')">Save profile</button></div></div>`;if(p==='alerts')return `<div class="page">${head(...m,'MY ACCOUNT')}<div class="panel panelpad" style="max-width:700px"><b>Topic alerts</b><p class="notice">Set a local alert preference. Notifications from live legal data require a connected backend.</p><label class="field">Watch a legal topic<input id="alerttopic" placeholder="e.g. cheque dishonour" value="${esc(localStorage.getItem('ll_alert')||'')}"></label><button class="redbtn" onclick="localStorage.setItem('ll_alert',document.getElementById('alerttopic').value);notify('Alert preference saved locally')">Save alert preference</button></div></div>`;return `<div class="page">${head(...m,'MY ACCOUNT')}<div class="panel panelpad" style="max-width:650px"><b>Research preferences</b><p class="notice">Your saved items, profile and notes are stored locally in your browser for this prototype.</p><label class="field">Default search category<select id="defaultcat">${cats.map(x=>`<option ${x===(localStorage.getItem('ll_defaultcat')||'All categories')?'selected':''}>${x}</option>`).join('')}</select></label><button class="redbtn" onclick="localStorage.setItem('ll_defaultcat',document.getElementById('defaultcat').value);notify('Settings saved locally')">Save settings</button></div></div>`}
function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}function render(){document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===page));if(page==='home')app.innerHTML=`<div class="layout">${home()}</div>`;else if(page==='results')app.innerHTML=`<div class="layout">${results(records.filter(matches),'Search results',`Searching ${category.toLowerCase()} for “${esc(query||'all records')}”. These are illustrative prototype records.`)}</div>`;else if(page==='judgments')app.innerHTML=`<div class="layout">${results(records.filter(x=>x.type==='Case names'),'Judgments','Find judgments by case name, citation, court, judge or legal topic.')}</div>`;else if(page==='legislation')app.innerHTML=`<div class="layout">${legis()}</div>`;else if(['sections','rules','notifications'].includes(page)){let a=page==='sections'?['Sections','Acts']:page==='rules'?['Rules']:['Notifications'];app.innerHTML=`<div class="layout">${results(records.filter(x=>a.includes(x.type)),page==='sections'?'Sections & Acts':page==='rules'?'Rules & Regulations':'Notifications & Circulars','Explore statutory references and related materials.')}</div>`}else if(page==='workspace')app.innerHTML=`<div class="layout">${workspace()}</div>`;else if(['saved','alerts','profile','settings'].includes(page))app.innerHTML=`<div class="layout">${account(page)}</div>`;else go('home')};page=(location.hash||'#home').slice(1);category=localStorage.getItem('ll_defaultcat')||'All categories';document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});window.addEventListener('hashchange',()=>{let p=location.hash.slice(1);if(p!==page){page=p;render()}});render();
</script></body></html>
