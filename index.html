/* ===== v3: Calendar (replaces Workspace) ===== */
.cc{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:calc(100vh - var(--hdr,60px));position:relative;background:#fff}
.cc-side{border-right:1px solid var(--line);padding:16px 16px 40px;overflow:auto;background:#fbfcfe;max-height:calc(100vh - var(--hdr,60px));position:sticky;top:var(--hdr,60px)}
.cc-side .mini{margin-bottom:14px}
.cc-grp{margin:0 0 18px}
.cc-grp .overline{margin:0 0 8px}
.cc-chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;cursor:pointer}
.cc-chk .sw,.cc-det .sw{width:12px;height:12px;border-radius:3px;flex-shrink:0;display:inline-block;margin-right:6px}
.cc-chk input{margin:0}
.cc-task{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.cc-task.done .cc-tt span{text-decoration:line-through;color:var(--muted)}
.cc-tt{flex:1;border:0;background:none;text-align:left;padding:0;font:inherit;cursor:pointer;min-width:0}
.cc-tt span{display:block;font-size:13.5px;line-height:1.35}
.cc-tt small{color:var(--muted);font-size:12px}
.cc-task .pri{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.cc-main{min-width:0;display:flex;flex-direction:column}
.cc-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:var(--hdr,60px);z-index:5}
.cc-nav{display:flex;align-items:center;gap:8px}
.cc-nav h1{font:600 22px/1.2 var(--serif);margin:0 0 0 10px;letter-spacing:-.01em}
.cc-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cc-search{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;background:#fff;width:250px}
.cc-search svg{color:var(--faint);flex-shrink:0}
.cc-search .sxw{flex:1}
.cc-search input{border:0;outline:0;padding:9px 8px;background:none;font:inherit;width:100%;min-width:0}
.cc-body{padding:14px 20px 30px;flex:1;min-width:0}
.cc-month{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.cc-month .dow{padding:8px;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;background:var(--pale);border-bottom:1px solid var(--line)}
.cc-cell{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cc-cell:hover{background:#fafbfd}
.cc-cell.out{background:#f7f8fa;color:var(--faint)}
.cc-cell.today{background:#fff8ee}
.cc-cell .dn{align-self:flex-end;border:0;background:none;font:600 12.5px var(--sans);padding:2px 6px;border-radius:99px;color:var(--ink2);cursor:pointer}
.cc-cell.today .dn{background:var(--red);color:#fff}
.cc-cell .more{border:0;background:none;color:var(--navy);font-size:12px;text-align:left;padding:1px 4px;cursor:pointer}
.cc-chip{display:block;width:100%;text-align:left;border:0;border-radius:5px;color:#fff;font-size:12px;line-height:1.35;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.cc-chip em{font-style:normal;opacity:.85}
.cc-tchip{display:flex;align-items:center;gap:4px;border-left:3px solid #69727e;background:#f0f2f5;border-radius:4px;padding:1px 4px;font-size:12px;min-width:0}
.cc-tchip input{margin:0;flex-shrink:0}
.cc-tchip button{border:0;background:none;padding:0;font:inherit;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;min-width:0}
.cc-tchip.done button{text-decoration:line-through;color:var(--muted)}
.cc-over{outline:2px dashed var(--red);outline-offset:-2px;background:#fff1f1!important}
.cc-week{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.cc-wh,.cc-wa,.cc-wb{display:grid}
.cc-wh>*{padding:8px 4px;text-align:center;border:0;background:#fff;font:500 12px var(--sans);color:var(--muted);border-left:1px solid var(--line);cursor:pointer}
.cc-wh>*:first-child{border-left:0;cursor:default}
.cc-wh b{display:block;font:600 20px var(--sans);color:var(--ink);margin-top:2px}
.cc-wh .today b{color:#fff;background:var(--red);width:34px;height:34px;line-height:34px;border-radius:50%;margin:2px auto 0}
.cc-wa{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#fcfcfd}
.cc-wa>div{border-left:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-height:30px;cursor:pointer}
.cc-wa>.lab{border-left:0;font-size:11px;color:var(--faint);padding:8px 6px;cursor:default}
.cc-wb{max-height:calc(100vh - var(--hdr,60px) - 240px);min-height:380px;overflow:auto;position:relative}
.cc-hours div{font-size:11px;color:var(--faint);text-align:right;padding:0 8px;box-sizing:border-box;border-top:1px solid transparent;transform:translateY(-7px)}
.cc-col{position:relative;border-left:1px solid var(--line);height:calc(24*48px);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-size:100% 48px;cursor:crosshair}
.cc-ev{position:absolute;border-radius:6px;color:#fff;padding:3px 7px;font-size:12px;line-height:1.3;overflow:hidden;border:1px solid #fff;cursor:grab;user-select:none;box-sizing:border-box}
.cc-ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-ev span{opacity:.9;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-rs{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.cc-ev:hover .cc-rs{background:#ffffff55}
.cc-col .nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:3;pointer-events:none}
.cc-ghost{position:fixed;z-index:300;background:#234e73cc;color:#fff;border-radius:6px;font-size:12px;padding:3px 7px;pointer-events:none;border:1px solid #fff}
body.cc-dragging{user-select:none;cursor:grabbing}
.cc-agenda{max-width:860px}
.cc-agenda .ag-ev input{margin-right:6px}
.cc-agenda .ad.today b{color:var(--red)}
.cc-scrim{position:fixed;inset:0;background:#10203a40;opacity:0;pointer-events:none;transition:.18s;z-index:60}
.cc-scrim.show{opacity:1;pointer-events:auto}
.cc-drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:#fff;box-shadow:-12px 0 40px #1f2c4a30;transform:translateX(105%);transition:transform .22s;z-index:70;display:flex;flex-direction:column}
.cc-drawer.open{transform:none}
.cc-dh2{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.cc-dh2 h2{margin:0;font:600 20px var(--serif)}
.cc-dbody{padding:16px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.cc-dbody .lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2)}
.cc-dbody .lbl .field{font-weight:400}
.cc-dbody .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-df{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line);background:#fbfcfe}
.cc-df .grow{flex:1}
.cc-quick{display:flex;gap:8px}
.cc-quick .field{flex:1}
.cc-warn{background:#fdf1d8;border-radius:8px;padding:8px 12px;font-size:13px}
.cc-att{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cc-att .field{flex:1;min-width:150px}
.cc-pill{display:inline-flex;align-items:center;gap:4px;background:#eef1f5;border-radius:99px;padding:3px 4px 3px 10px;font-size:13px;font-weight:400}
.cc-pill button{border:0;background:none;color:var(--muted);cursor:pointer;width:18px;height:18px;border-radius:50%;padding:0}
.cc-rem{display:flex;gap:6px;margin-bottom:6px}
.cc-rem .field{flex:1}
.cc-rl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cc-rl small{display:block;color:var(--muted);font-size:12px}
.cc-rl .field{width:150px;flex-shrink:0}
.cc-pop{position:fixed;z-index:200;min-width:260px;max-width:380px;max-height:70vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #1f2c4a2e;padding:6px}
.cc-pi{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
.cc-pi:hover{background:var(--pale)}
.cc-pi small{display:block;color:var(--muted);font-size:12.5px}
.cc-det{padding:10px 12px;min-width:300px}
.cc-dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-left:4px solid var(--navy);padding-left:10px;margin-bottom:8px}
.cc-dh h3{margin:0;font:600 17px/1.3 var(--serif)}
.cc-det dl{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;margin:8px 0 12px;font-size:13.5px}
.cc-det dt{color:var(--muted)}
.cc-det dd{margin:0}
.cc-da{display:flex;gap:6px;flex-wrap:wrap}
.cc-pop .ag-ev{width:100%}
@media (max-width:1000px){.cc{grid-template-columns:1fr}.cc-side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.cc-bar{position:static}.cc-search{width:100%}.cc-cell{min-height:84px}}
@media print{.cc-side,.cc-bar,.cc-drawer,.cc-scrim{display:none!important}}


/* ===== v4: Statutes ===== */
.libmain h1{font:700 34px/1.15 var(--serif);letter-spacing:-.01em;margin:6px 0 8px}
.libmain .lede{max-width:720px;color:var(--ink2);font-size:16px;line-height:1.6}
.libmain h2{font:600 22px/1.25 var(--serif);letter-spacing:-.005em}
.hubsec{margin-top:36px;padding-top:26px;border-top:1px solid var(--line)}
.hubsec>.row:first-child{margin-top:0!important}
.h2s{margin:26px 0 12px!important;font:600 20px var(--serif)}
.h2s .muted{font:500 14px var(--sans)}
.lawcard{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;background:#fff;flex-wrap:wrap}
.lawcard .ldoc{color:var(--navy);flex-shrink:0}
.lawcard .lname{flex:1 1 280px;min-width:0}
.lawcard .lt{border:0;background:none;padding:0;font:600 16.5px/1.35 var(--serif);text-align:left;color:var(--ink);cursor:pointer}
.lawcard .lt:hover{color:var(--red)}
.lawcard .lmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lawcard .lact2{display:flex;gap:6px;flex-wrap:wrap}
/* Act reader */
.actpage{max-width:1380px}
.actpage .page-head h1{font:700 32px/1.2 var(--serif)}
.aglay{display:grid;grid-template-columns:310px minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}
.aside-idx{position:sticky;top:calc(var(--hdr,60px) + 12px);border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 12px;max-height:calc(100vh - var(--hdr,60px) - 28px);display:flex;flex-direction:column}
.aih{padding:0 6px 10px}
.aih b{display:block;font:600 17px var(--serif)}
.aih span{font-size:12.5px;color:var(--muted)}
.aside-idx .field{margin:0 0 8px}
.aidxlist{overflow:auto;flex:1;padding-right:2px}
.ach{padding:12px 8px 4px;font-size:12px;color:var(--muted);line-height:1.35}
.ach b{display:block;font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.aidx{display:flex;gap:10px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:7px 8px;font:inherit;font-size:13.5px;line-height:1.35;cursor:pointer;border-radius:0 6px 6px 0}
.aidx b{min-width:38px;font-weight:600;color:var(--ink)}
.aidx span{color:var(--ink2)}
.aidx:hover{background:var(--pale)}
.aidx.on{border-left-color:var(--red);background:var(--red-t)}
.aidx.on span{color:var(--ink)}
.amain{min-width:0}
.achap{font:600 14px var(--sans)!important;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:30px 0 12px!important;padding-bottom:8px;border-bottom:2px solid var(--navy)}
.achap:first-child{margin-top:0!important}
.asec{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 22px;margin-bottom:14px;scroll-margin-top:calc(var(--hdr,60px) + 14px)}
.asec header{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:10px}
.asec h3{font:600 19px/1.35 var(--serif);margin:2px 0 0}
.asec h3 .no{display:block;font:700 13px var(--sans);letter-spacing:.04em;color:var(--red);margin-bottom:2px}
.acts2{display:flex;gap:6px;flex-shrink:0}
.asec .overline{margin:0}
@media(max-width:960px){.aglay{grid-template-columns:1fr}.aside-idx{position:static;max-height:360px}}
@media print{.aside-idx,.libside,.acts2,.page-head .row{display:none!important}.aglay{display:block}}
/* statute workspace */
#dfApp .statpaper{background:#fff;border-radius:10px;padding:30px 36px;font:16px/1.75 var(--serif);box-shadow:0 1px 3px #1f2c4a1a}
#dfApp .statpaper h3.dt{font:700 20px var(--serif);text-align:center;margin:0 0 14px}
#dfApp .statpaper h4.dh{font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--navy);margin:24px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
#dfApp .statpaper h4.sh{font:600 16.5px var(--serif);margin:18px 0 6px}
#dfApp .statpaper .stat p{margin:0 0 8px}
#dfApp .wspage .ohead .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#dfApp .wspage .ohead .acts .field{width:auto;max-width:240px}
/* compare: one consistent type system */
.cmpinline{margin-top:36px;padding-top:26px;border-top:1px solid var(--line);font-family:var(--sans)}
.cmpinline h2{font:600 22px/1.25 var(--serif)}
.cmpinline .cmp-card{border-radius:12px;padding:20px 22px;min-height:230px;box-shadow:none}
.cmpinline .cmp-card.out{background:#f8fafc}
.cmpinline .cmp-card .overline{font:600 11px var(--sans);letter-spacing:.08em}
.cmpinline .cmp-in{font:600 28px/1.2 var(--sans);letter-spacing:-.01em;padding:8px 36px 8px 0}
.cmpinline .cmp-hit .big{font:600 26px/1.2 var(--sans)}
.cmpinline .cmp-hit .hd{font:500 16px var(--sans);color:var(--ink2)}
.cmpinline .cmp-hit .why{font:400 14.5px/1.6 var(--sans)}
.cmpinline .comparegrid .cbox{border-radius:12px;padding:18px 20px;background:#fff}
.cmpinline .cbox h3{font:600 17px var(--sans)}
.cmpinline .cbox p{font:400 15.5px/1.7 var(--sans);color:var(--ink)}
.cmpinline table.xw,.cmpinline table.xw td,.cmpinline table.xw th{font-family:var(--sans)}
.cmpinline table.xw td{font-size:14px}
.cmpinline .cmp-top .field,.cmpinline select.cmpsel{font:500 15px var(--sans);border-radius:10px;padding:11px 14px}
.cmpinline .swapbtn{width:42px;height:42px}
.cmpinline .banner{font-family:var(--sans)}
.cmpinline details.cmpall summary{font:600 15px var(--sans)}

</style>
</head>

/* ---------- lookup: "IPC 302", "302 IPC", "s.138 NI Act", "BNS 103(1)" ---------- */
const ACT_ALIAS = {ipc:'ipc',bns:'bns',crpc:'crpc',bnss:'bnss','ni':'ni','ni act':'ni',bsa:'bsa','evidence act':'iea',iea:'iea'};
function parseCite(q){
  q = q.trim().replace(/\bsection\b|\bsec\.?|\bs\.(?=\s*\d)|\bu\/s\b|\bof the\b/gi,' ').replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();
  const act = '(ipc|bns|crpc|bnss|bsa|ni act|ni|evidence act|iea)';
  let m = q.match(new RegExp('^'+act+'\\s*(\\d+[a-z]?(?:\\(\\d+\\))?)$','i')) || null;
  if(m) return {act:ACT_ALIAS[m[1].toLowerCase()], no:m[2].toUpperCase()};
  m = q.match(new RegExp('^(\\d+[a-z]?(?:\\(\\d+\\))?)\\s*'+act+'$','i'));
  if(m) return {act:ACT_ALIAS[m[2].toLowerCase()], no:m[1].toUpperCase()};
  return null;
}
function lookupResults(q){
  const c = parseCite(q); const out = [];
  if(c){
    const base = c.no.replace(/\(.*\)/,'');
    for(const [k,n] of Object.entries(NODES)) if(n.act===c.act && n.no.toUpperCase()===base) out.push({title:`${nodeLabel(n)} · ${n.head}`, sub:(n.banner?.t)||'', key:k, status:n.status});
    const lab = (ACT_SHORT[c.act]||'') + ' ' + c.no;
    for(const r of CROSSWALK){
      const o = r.old.toUpperCase().replace(/\s+/g,' '), w = r.nw.toUpperCase();
      if(o===lab.toUpperCase() || w.startsWith(lab.toUpperCase().replace(/\(.*\)/,''))){
        if(!out.some(x=>x.key && r.oldKey===x.key)) out.push({title:`${r.old} ↔ ${r.nw}`, sub:`${REL_LABEL[r.rel]} · ${r.note}`, key:r.oldKey||r.nwKey||null, xw:true});
      }
    }
  } else if(q.length>1){
    const t=q.toLowerCase();
    for(const [k,n] of Object.entries(NODES)) if((n.head+' '+n.no).toLowerCase().includes(t)) out.push({title:`${nodeLabel(n)} · ${n.head}`, sub:n.statusLine, key:k});
  }
  return out;
}
function openLookupResult(r){
  $('lookdrop').classList.remove('show');
  if(r.key && NODES[r.key] && !NODES[r.key].stub){ addHistory($('lookup').value, 'statute', '/section/'+r.key); go('/section/'+r.key); }
  else go('/compare?q='+encodeURIComponent($('lookup').value));
}
function setupLookup(){
  const inp=$('lookup'), dd=$('lookdrop'); let items=[], sel=-1;
  const draw=()=>{
    const v=inp.value.trim(); if(!v){ dd.classList.remove('show'); return; }
    items = lookupResults(v);
    dd.innerHTML = items.length
      ? items.map((r,i)=>`<div class="lookitem ${i===sel?'sel':''}" data-i="${i}" role="option"><div><b>${esc(r.title)}</b><div class="eq">${esc(r.sub)}</div></div><span class="pill ${r.status==='repealed'?'old':r.status==='in_force'?'in':'note'}">${r.status==='repealed'?'Repealed':r.status==='in_force'?'In force':'Mapping'}</span></div>`).join('') + '<div class="lookhint">Press Enter to compare old and new law. Mappings need editorial verification.</div>'
      : '<div class="lookhint">No match in this sample. Try IPC 302, BNS 103, 420 IPC or 138 NI Act.</div>';
    dd.classList.add('show');
  };
  inp.addEventListener('input', ()=>{ sel=-1; draw(); });
  inp.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown'){ sel=Math.min(sel+1,items.length-1); draw(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ sel=Math.max(sel-1,0); draw(); e.preventDefault(); }
    else if(e.key==='Enter'){ e.preventDefault(); if(items[sel]) openLookupResult(items[sel]); else if(items.length===1) openLookupResult(items[0]); else { dd.classList.remove('show'); go('/compare?q='+encodeURIComponent(inp.value)); } }
    else if(e.key==='Escape'){ dd.classList.remove('show'); }
  });
  dd.addEventListener('mousedown', e=>{ const el=e.target.closest('.lookitem'); if(el){ e.preventDefault(); openLookupResult(items[+el.dataset.i]); } });
  document.addEventListener('click', e=>{ if(!$('lookupWrap').contains(e.target)) dd.classList.remove('show'); });
}

function outlineOf(n){
  const o = []; let mp = false;
  n.body.forEach(b => {
    if(b.k==='p' && !mp){ o.push(['p0', n.summary?'Summary of the section':'Section text', 0]); mp = true; }
    else if(b.k==='sub') o.push(['sub-'+b.l, 'Sub-section '+b.l, 0]);
    else if(b.k==='proviso'){ o.push(['proviso','Proviso (conditions)',0]); b.items.forEach(i=>o.push(['cl-'+i[0], 'Clause '+i[0], 1])); }

  });

  if(n.penal) o.push(['penal','Punishment and classification',0]);
  return o;
}

/* ---------- Ask: rule-based sample answers with source, version and flags ---------- */
function askAnswer(key, q){
  q = (q||'').toLowerCase(); const n = NODES[key];
  const disclaimer = 'Sample answer from the loaded text only. Not legal advice.';
  const A = (text, quote, src, flag, ver) => `<div class="aibox" style="margin:12px 0 0;padding:14px 16px"><div class="ai-h"><span class="ai-ico">✦</span>Answer</div><p style="margin:0 0 6px">${text}</p>${quote?`<div class="quote">${esc(quote)}<span class="src">${esc(src)}</span></div>`:''}${flag?`<div class="flag"><span>⚠</span><span>${flag}</span></div>`:''}<div class="srcs"><button>${esc(n?nodeLabel(n):'')}</button><button>${esc(ver)}</button></div><div class="disc">${disclaimer}</div></div>`;
  const ver = n ? (n.version.label) : '';
  if(key==='ni-138'){
    if(/notice|day|limit|time/.test(q)) return A('Three time limits apply: present the cheque within 3 months (or its validity), send written notice within 30 days of the bank’s dishonour information, and wait 15 days for payment. The complaint must then be filed within the period allowed after those 15 days lapse (see s.142).','(b) the payee or holder gave written notice of dishonour to the drawer within 30 days of receiving the bank’s information of the return','Summary of s.138 proviso (gazetted wording to be inserted)','Limitation runs from the date of the offence, so compute from the date the 15-day period ended. Confirm the exact complaint window in s.142.',ver);
    if(/bail/.test(q)) return A('The offence is bailable and non-cognizable, and it is triable by a Magistrate.', null,'', 'Under the new procedure code (BNSS), summons procedure and timelines can differ for the trial. Check the First Schedule for the version that applies to your complaint date.', ver);
    if(/punish|sentence|penalt|fine/.test(q)) return A('Imprisonment up to two years, or fine up to twice the cheque amount, or both.', null,'','Courts may also direct interim compensation under s.143A and deposit pending appeal under s.148.',ver);
    if(/compound|settle/.test(q)) return A('Yes. Section 147 makes the offence compoundable, and the Supreme Court has encouraged early compounding.',null,'','See Meters and Instruments v. Kanchan Mehta for the court’s approach to costs on compounding. Verify the proposition against the judgment.',ver);
    if(/security|company|director|presum/.test(q)) return A('This turns on case law rather than the section text. See the Cases tab filtered by issue (Security cheques, Company liability, Presumption & burden).',null,'','The retrieved material does not answer this directly. Read the cases before relying on any position.',ver);
  }
  if(key==='ipc-302' || key==='bns-103'){
    if(/bail/.test(q)) return A('The offence is non-bailable and cognizable, and it is triable by a Court of Session.',null,'','Depends on the date of the offence: IPC applies before 1 July 2024, BNS on or after.',ver);
    if(/punish|sentence|death|life/.test(q)) return A('Death, or imprisonment for life, and fine.', n.body[0].t || '', nodeLabel(n)+(key==='ipc-302'?' (text until 30 June 2024)':'(1)'),'Constitution Bench authority limits the death penalty to the rarest of rare cases (Bachan Singh). Mandatory death for life-convicts (s.303) was struck down.',ver);
    if(/new|replace|equiv|bns|ipc|lynch/.test(q)) return A('IPC 302 corresponds to BNS 103(1) and was renumbered with the same punishment. BNS 103(2), group murder on discriminatory grounds, is new and has no IPC predecessor.',null,'','The mapping is awaiting editorial verification.',ver);
  }
  return `<div class="aibox" style="margin:12px 0 0;padding:14px 16px"><div class="ai-h"><span class="ai-ico">✦</span>Cannot answer from the material loaded</div><p style="margin:0">The sample text and cases for this section do not answer that. In the live product this stage would say so instead of guessing, and point you to the section text and the Cases tab.</p><div class="disc">${disclaimer}</div></div>`;
}

function decadeOf(y){ return y<1940 ? 'Before 1940' : Math.floor(y/10)*10+'s'; }
function libSource(){
  if(LIB.tab!=='Acts & Codes'){ const want = DOC_TAB[LIB.tab]; return [...RULES_REGS, ...LIB_OTHER].filter(r => (r.type||'').replace(/s$/,'')===want); }
  if(LIB.scope==='central') return CENTRAL;
  if(LIB.scope==='state') return STATE_LAWS;
  if(LIB.scope==='saved') return getSavedActs().map(lawById).filter(Boolean);
  if(LIB.scope==='recent') return getRecentActs().map(lawById).filter(Boolean);
  return [...CENTRAL, ...STATE_LAWS];
}
function matchesFilters(x, skipLetter){
  const f = LIB.f;
  if(f.jur!=='All' && x.jur!==f.jur) return false;
  if(f.state!=='All' && x.state!==f.state) return false;
  if(f.subject!=='All' && x.subject!==f.subject) return false;
  if(f.year!=='Any' && decadeOf(x.year)!==f.year) return false;
  if(f.status!=='All' && STATUS_LABEL[x.status]!==f.status) return false;
  if(f.type!=='All' && x.type!==f.type) return false;
  if(f.nature!=='All' && (f.nature==='Procedural') !== !!x.proc) return false;
  if(f.cases && !x.cases) return false;
  if(f.from && x.year < +f.from) return false;
  if(f.to && x.year > +f.to) return false;
  if(f.penal && !x.penal) return false;
  if(f.xwalk && !x.xwalk) return false;
  if(f.text && !x.key) return false;
  if(LIB.q.trim()){ const hay = (x.name+' '+x.year+' '+(x.abbr||'')+' '+x.subject+' '+(x.state||'')+' '+(x.under||'')).toLowerCase(); if(!LIB.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w))) return false; }
  if(!skipLetter && LIB.letter && x.name.replace(/^The\s+/i,'')[0].toUpperCase()!==LIB.letter) return false;
  return true;
}
function libResults(){
  const r = libSource().filter(x=>matchesFilters(x));
  const s = LIB.sort;
  r.sort((a,b)=> s==='za' ? b.name.localeCompare(a.name) : s==='new' ? b.year-a.year || a.name.localeCompare(b.name) : s==='old' ? a.year-b.year || a.name.localeCompare(b.name) : a.name.localeCompare(b.name) || b.year-a.year);
  return r;
}
function activeFilters(){
  const f=LIB.f, out=[];
  [['jur','Jurisdiction'],['state','State/UT'],['subject','Subject'],['year','Year'],['status','Status'],['type','Type'],['nature','Nature of law']].forEach(([k,l])=>{ if(f[k]!==DEFAULT_F[k]) out.push([k,`${l}: ${f[k]}`]); });
  if(f.from||f.to) out.push(['range',`Enacted ${f.from||'…'}–${f.to||'…'}`]);
  if(f.penal) out.push(['penal','Has penal provisions']); if(f.xwalk) out.push(['xwalk','Old ↔ new correspondence']); if(f.text) out.push(['text','Full text loaded']); if(f.cases) out.push(['cases','Has linked case law']);
  if(LIB.letter) out.push(['letter','Starts with '+LIB.letter]); if(LIB.q.trim()) out.push(['q','“'+LIB.q.trim()+'”']);
  return out;
}

function resultsHTML(){
  const res = libResults(), src = libSource();
  const shown = res.slice(0, LIB.shown);
  const lettersPresent = new Set(src.filter(x=>matchesFilters(x,true)).map(x=>x.name.replace(/^The\s+/i,'')[0].toUpperCase()));
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button class="lt ${LIB.letter===l?'on':''}" data-lib="letter" data-v="${l}" ${lettersPresent.has(l)?'':'disabled'}>${l}</button>`).join('');

function drawConst(){

  $('cart').innerHTML = arts.map(a=>`<div class="case" style="margin:8px 0"><div class="row between"><h3>Article ${esc(a[0])} · <span style="font-weight:400;color:var(--muted)">${esc(a[1])}</span></h3>${a[3]?'<span class="pill red">Text</span>':'<span class="pill act">Heading only</span>'}</div>${a[2]?`<div class="stat" style="font-size:17px;margin-top:6px"><p>${esc(a[2])}</p></div>`:'<p class="muted" style="margin:6px 0 0">Text not loaded in this sample.</p>'}<div class="links row" style="margin-top:8px"><button class="btn sm" data-lib="artcases" data-v="Article ${esc(a[0])}">Cases on Article ${esc(a[0])} →</button>${a[2]?`<button class="btn sm" data-lib="copyart" data-v="${esc(a[0])}">Copy text</button>`:''}</div></div>`).join('') || '<div class="callout">No article matches. Only a sample is loaded.</div>';

  $('ctoc').innerHTML = `<h3>Contents</h3><div class="outline">${CONST_PARTS.map(p=>`<button data-a="cscroll" data-v="part-${esc(p[0])}"><b>Part ${esc(p[0])}</b> · ${esc(p[1].length>30?p[1].slice(0,28)+'…':p[1])}</button>${p[0]==='III'?`<div class="outl">${PART3.map(a=>`<button class="ol" data-a="cscroll" data-v="art-${esc(a[0])}">Art. ${esc(a[0])} · ${esc(a[1].length>26?a[1].slice(0,24)+'…':a[1])}</button>`).join('')}</div>`:''}`).join('')}<button data-a="cscroll" data-v="sched"><b>Schedules</b> · First to Twelfth</button></div>`;

/* ---------- events ---------- */
function libSearchSubmit(){
  const q = ($('libq')?.value||LIB.q).trim(); LIB.q = q; LIB.letter=''; LIB.shown=12;
  const hit = q && lookupResults(q).find(r=>r.key && NODES[r.key] && !NODES[r.key].stub);
  if(hit){ addHistory(q); LIB.q=''; go('/section/'+hit.key); return; }
  drawLibAll();
}
function setScope(s){
  LIB.scope=s; LIB.tab='Acts & Codes'; LIB.shown=12; LIB.letter='';
  LIB.f = {...DEFAULT_F}; if(s==='central') LIB.f.jur='Central';
  if(location.hash.replace(/^#\/?/,'').startsWith('statutes')) drawLibAll(); else go('/statutes');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-lib]'); if(!t || t.tagName==='SELECT' || t.tagName==='INPUT') return;
  const a = t.dataset.lib, v = t.dataset.v;
  switch(a){
    case 'scope': setScope(v); break;
    case 'const': go('/constitution'); break;
    case 'corr': go('/compare'); break;
    case 'collapse': LIB.collapsed = !LIB.collapsed; store('libcollapsed', LIB.collapsed); $('lib').classList.toggle('collapsed', LIB.collapsed); break;
    case 'tab': LIB.tab=v; LIB.shown=12; LIB.letter=''; drawLibAll(); break;
    case 'adv': LIB.adv=!LIB.adv; $('libfilters').innerHTML=filterBar(); break;
    case 'clear': LIB.f={...DEFAULT_F}; LIB.q=''; LIB.letter=''; LIB.shown=12; if(LIB.scope==='central') LIB.f.jur='Central'; drawLibAll(); break;
    case 'subject': LIB.f.subject = LIB.f.subject===v ? 'All' : v; LIB.shown=12; $('libfilters').innerHTML=filterBar(); $('libsubj').innerHTML=subjectTiles(); drawLibResults(); $('libres').scrollIntoView({behavior:'smooth',block:'start'}); break;
    case 'allsubj': LIB.allSubj=!LIB.allSubj; $('libsubj').innerHTML=subjectTiles(); break;
    case 'letter': LIB.letter = v||''; LIB.shown=12; drawLibResults(); break;
    case 'mode': LIB.mode=v; store('libmode', v); drawLibResults(); break;
    case 'more': LIB.shown += 12; drawLibResults(); break;
    case 'open': openLaw(v); break;
    case 'save': { const s=getSavedActs(); const i=s.indexOf(v); if(i>=0){ s.splice(i,1); notify('Removed from saved statutes'); } else { s.unshift(v); notify('Saved. Find it under Saved statutes'); } store('savedActs', s); if(['statutes','central','stateut'].includes(current.name)){ drawLibResults(); const sd=document.querySelector('.libside'); if(sd) sd.outerHTML=libSidebar(LIB.scope); } else route(); break; }
    case 'rmchip': { if(v==='range'){ LIB.f.from=''; LIB.f.to=''; } else if(v==='letter') LIB.letter=''; else if(v==='q') LIB.q=''; else LIB.f[v]=DEFAULT_F[v]; drawLibAll(); break; }
    case 'search': libSearchSubmit(); break;
    case 'try': LIB.q=v; $('libq').value=v; libSearchSubmit(); break;
    case 'artcases': go('/research?q='+encodeURIComponent(v)); break;
    case 'copyart': { const a2=CONST_ARTICLES.find(x=>x[0]===v); copyText(`Article ${a2[0]}, Constitution of India\n${a2[2]}`, 'Article text copied'); break; }
  }
});
document.addEventListener('change', e => {
  const t = e.target.closest('[data-lib]'); if(!t) return; const a=t.dataset.lib;
  if(a==='f'){ const k=t.dataset.k; LIB.f[k] = t.type==='checkbox' ? t.checked : t.value; LIB.shown=12; if(k==='jur' && !['State','Union Territory'].includes(t.value)) LIB.f.state='All'; drawLibAll(); }
  else if(a==='sort'){ LIB.sort=t.value; drawLibResults(); }
  else if(a==='moretab'){ if(t.value){ LIB.tab=t.value; drawLibAll(); } }
});
document.addEventListener('input', e => {
  if(e.target.id==='libq'){ LIB.q=e.target.value; LIB.shown=12; LIB.letter=''; drawLibResults(); }
  else if(e.target.id==='cq'){ CQ=e.target.value; drawConst(); }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='libq'){ e.preventDefault(); libSearchSubmit(); } });

   <div class="adv-sec"><h4>Law</h4><div class="adv-grid">${F('act','Act or Code','e.g. Negotiable Instruments Act, 1881')}${F('section','Section or Article','e.g. 138')}${S('subject','Subject',SUBJECTS,'Any subject')}${S('docType','Document type',DOC_TYPES,'Any type')}</div></div>
   <div class="adv-sec"><h4>Date and outcome</h4><div class="adv-grid">${F('from','Decided or issued from','', 'date')}${F('to','Decided or issued to','', 'date')}${S('disposition','Disposition',DISPOSITIONS,'Any outcome')}${S('treatment','Treatment by later courts',TREATMENTS,'Any treatment')}</div>
    <div class="row" style="margin-top:12px;gap:18px"><label class="check"><input type="checkbox" data-adv="reportable" ${v.reportable?'checked':''}> Reportable judgments only</label><label class="check"><input type="checkbox" data-adv="sc1st" ${v.sc1st===false?'':'checked'}> Show Supreme Court decisions first</label></div></div>
   <div class="row between adv-foot"><small class="muted">Judge, advocate, case number and disposition search needs the full database. In this prototype they are recorded but only title, citation, court, year, Act, section, subject, document type and treatment are applied.</small><div class="row"><button class="btn" data-a="advreset">Reset</button><button class="btn primary" data-a="advsearch">Search</button></div></div></div>`;

function readAdv(root){
  const v = {}; (root||document).querySelectorAll('[data-adv]').forEach(e=>{ const k=e.dataset.adv; if(e.type==='checkbox') v[k]=e.checked; else if(e.value.trim()) v[k]=e.value.trim(); });

}

/* ===== ACTIONS: header controls, history drawer, home search. Uses data-a / data-hist attributes ===== */
const ACTIONS = {};   // name -> (el, event) => void ; modules add their own entries

function doSearch(q, cat, adv){
  q = (q||'').trim();
  const hit = !adv && q && lookupResults(q).find(r=>r.key && NODES[r.key] && !NODES[r.key].stub);
  if(hit && cat==='Section or Article lookup' && parseCite(q)){ addHistory(q,'statute','/section/'+hit.key); go('/section/'+hit.key); return; }
  RQ = {q: q||'Section 138 NI Act', cat: cat||'All sources', adv: adv||{}, f:{}, tab:'All', court:'All'};
  addHistory(RQ.q, 'search');
  go('/research?q='+encodeURIComponent(RQ.q)+'&r='+Date.now());
}
function advToQuery(v){ return [v.all, v.phrase?'"'+v.phrase+'"':'', v.title, v.act&&v.section?v.section+' '+v.act:(v.act||v.section||''), v.citation].filter(Boolean).join(' ').trim(); }

document.addEventListener('click', e => {

});

});

/* ===== RESEARCH: unified search, answer composer, category tabs, filters ===== */
let RQ = {q:'', cat:'All sources', adv:{}, f:{}, tab:'All', court:'All', sort:'rel', advOpen:false};
const R_TABS = ['All','Judgments','Acts','Rules','Regulations','Notifications','Circulars'];
const R_MORE = ['Amendment','Form','Manual','Order','Ordinance','Policy','Press release','Scheme / guideline','State amendment','LiveLaw reports'];
const STOP = new Set('the and for what are how can does did under section act with that this from have has any not who when where which about into your their there than then them they its was were will would should could may might must shall also onto upon within without between over after before while being been'.split(' '));
const GROUP_SUBJECT = {ni138:'Corporate & commercial',murder:'Criminal',crimproc:'Criminal',evidence:'Criminal',const:'Constitutional',civil:'Civil & procedure'};
const CAT_TO_TAB = {'Judgments (all courts)':['Judgments'],'Supreme Court':['Judgments','Supreme Court'],'Constitution Bench decisions':['Judgments','Constitution Bench'],'High Courts':['Judgments','High Court'],'Tribunals and commissions':['Judgments','Tribunal'],'District and subordinate courts':['Judgments','District'],'Acts and Codes':['Acts'],'Rules':['Rules'],'Regulations':['Regulations'],'Notifications':['Notifications'],'Circulars':['Circulars'],'Amendments and State amendments':['Amendment'],'Ordinances and Bills':['Ordinance'],'Constitution of India':['Acts'],'Citation (for example, (2014) 9 SCC 129)':['Judgments'],'LiveLaw news reports':['LiveLaw reports'],'Articles and commentary':['LiveLaw reports'],'Law Commission and committee reports':['More'],'Forms and templates':['Form'],'Orders and practice directions':['Order'],'Court rules':['Rules'],'Policies, schemes and guidelines':['Policy']};

const words = s => (s||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ\s()\/.-]/g,' ').split(/\s+/).map(w=>w.replace(/^[.()\-]+|[.()\-]+$/g,'')).filter(w=>w && !STOP.has(w) && (w.length>2 || /^\d+$/.test(w)));
function benchClass(b){ b=(b||'').toLowerCase(); return /constitution|five|seven|nine|thirteen|\b[5-9]\b/.test(b)?'Constitution Bench':/three|\b3\b/.test(b)?'Three judges':/two|\b2\b|division/.test(b)?'Two judges':'Not recorded'; }
function courtClass(c){ return c==='Supreme Court'?'Supreme Court':/^High Court/.test(c)?'High Court':/Tribunal|NCLT|NCLAT|ITAT|NCDRC|NGT|SAT|CESTAT/i.test(c)?'Tribunal':'District'; }

/* ---------- corpus ---------- */
function corpus(){
  const d = [];
  CASES.forEach(c => d.push({kind:'case', tab:'Judgments', c, title:c.name, type:'Judgment', court:c.court, cc:courtClass(c.court), year:c.year, issue:c.issue, treat:c.treat||'', bench:benchClass(c.bench), subject:GROUP_SUBJECT[c.group]||'', group:c.group, text:[c.name,c.cite,c.prop,c.note,c.issue].join(' ')}));
  Object.entries(NODES).filter(([k,n])=>!n.stub).forEach(([k,n]) => d.push({kind:'node', tab:'Acts', key:k, n, title:`${nodeLabel(n)} · ${n.head}`, type:'Section', year:null, subject:GROUP_SUBJECT[n.group]||'', group:n.group, status:n.status==='repealed'?'Repealed':'In force', jur:'Central', docType:'Main Act', text:[nodeLabel(n),n.head,n.body.map(b=>b.t||'').join(' ')].join(' ')}));
  CENTRAL.concat(STATE_LAWS).forEach(x => d.push({kind:'law', tab:'Acts', x, title:lawTitle(x), type:'Act', year:x.year, subject:x.subject, status:STATUS_LABEL[x.status], jur:x.jur, docType:'Main Act', text:[x.name,x.abbr,x.subject,x.state||''].join(' ')}));
  RULES_REGS.forEach(x => d.push({kind:'law', tab:x.tab, x, title:lawTitle(x), type:x.type.replace(/s$/,''), year:x.year, subject:x.subject, status:STATUS_LABEL[x.status], jur:x.jur, docType:x.type.replace(/s$/,''), text:[x.name,x.under,x.subject].join(' ')}));
  OTHER_DOCS.forEach(o => d.push({kind:'other', tab:o.type==='Notification'?'Notifications':o.type, o, title:`${o.name}, ${o.year}`, type:o.type, year:o.year, subject:o.subject, jur:'Central', docType:o.type, text:[o.name,o.note,o.subject].join(' ')}));
  CONST_ARTICLES.forEach(a => d.push({kind:'art', tab:'Acts', a, title:`Article ${a[0]} · ${a[1]}`, type:'Constitution', year:1950, subject:'Constitutional', jur:'Central', status:'In force', docType:'Main Act', text:['Article',a[0],a[1],a[2]].join(' ')}));
  NEWS.forEach(n => d.push({kind:'news', tab:'LiveLaw reports', n, title:n.title, type:'LiveLaw reports', year:null, subject:'', text:[n.title,n.sub].join(' ')}));
  return d;
}
function relevance(doc, terms, q){
  if(!terms.length) return 1;
  const t = doc.title.toLowerCase(), x = doc.text.toLowerCase(); let s = 0;
  terms.forEach(w => { if(t.includes(w)) s += 3; else if(x.includes(w)) s += 1; });
  const sc = researchScope(q); if(doc.group && doc.group===sc) s += 2;
  return s;
}
function researchScope(q){
  const t = (q||'').toLowerCase();
  if(/\b138\b|cheque|dishonour|negotiable/.test(t)) return 'ni138';
  if(/\b302\b|\b103\b|murder|culpable/.test(t)) return 'murder';
  return '';
}
function advMatch(doc, a){
  const x = (doc.text+' '+doc.title).toLowerCase();
  if(a.all && !words(a.all).every(w=>x.includes(w))) return false;
  if(a.phrase && !x.includes(a.phrase.toLowerCase())) return false;
  if(a.any && !words(a.any).some(w=>x.includes(w))) return false;
  if(a.none && words(a.none).some(w=>x.includes(w))) return false;
  if(a.title && !doc.title.toLowerCase().includes(a.title.toLowerCase())) return false;
  if(a.citation && !(doc.c && doc.c.cite.toLowerCase().includes(a.citation.toLowerCase()))) return false;
  if(a.act && !x.includes(a.act.toLowerCase().replace(/,.*$/,''))) return false;
  if(a.section && !new RegExp('(^|\\D)'+a.section.replace(/[^\w()]/g,'')+'(\\D|$)','i').test(x)) return false;
  if(a.subject && doc.subject && doc.subject!==a.subject) return false;
  if(a.subject && !doc.subject) return false;
  if(a.docType && doc.docType!==a.docType && !(a.docType==='Main Act' && doc.kind==='case' && false)) { if(doc.kind!=='case' || a.docType!=='Judgment') return false; }
  if(a.courtType){ if(doc.kind!=='case') return false; const m={'Supreme Court':'Supreme Court','High Court':'High Court','Tribunal or commission':'Tribunal','District or subordinate court':'District'}; if(doc.cc!==m[a.courtType]) return false; }
  if(a.hc && !(doc.court||'').toLowerCase().includes(a.hc.toLowerCase())) return false;
  if(a.bench){ if(doc.kind!=='case') return false; const m={'Single judge':'Not recorded','Division bench (2 judges)':'Two judges','Three judges':'Three judges','Constitution Bench (5 or more)':'Constitution Bench'}; if(doc.bench!==m[a.bench]) return false; }
  if(a.treatment && doc.treat!==a.treatment) return false;
  const yf = a.from ? +a.from.slice(0,4) : 0, yt = a.to ? +a.to.slice(0,4) : 0;
  if((yf||yt) && !doc.year) return false; if(yf && doc.year<yf) return false; if(yt && doc.year>yt) return false;
  return true;
}
function sideMatch(doc){
  const f = RQ.f;
  if(f.court?.length && !f.court.includes(doc.cc||'')) return false;
  if(f.issue?.length && !f.issue.includes(doc.issue)) return false;
  if(f.treat?.length && !f.treat.includes(doc.treat)) return false;
  if(f.bench?.length && !f.bench.includes(doc.bench)) return false;
  if(f.subject?.length && !f.subject.includes(doc.subject)) return false;
  if(f.status?.length && !f.status.includes(doc.status)) return false;
  if(f.jur?.length && !f.jur.includes(doc.jur)) return false;
  if(f.from && (!doc.year || doc.year < +f.from)) return false;
  if(f.to && (!doc.year || doc.year > +f.to)) return false;
  return true;
}
function runSearchCore(){
  const terms = words(RQ.q.replace(/"/g,'')); const pc = parseCite(RQ.q);
  let docs = corpus().map(d => ({d, s: relevance(d, terms, RQ.q)})).filter(o => o.s>0 && advMatch(o.d, RQ.adv));
  if(pc){ const lab = ((ACT_SHORT[pc.act]||'')+' '+pc.no).toLowerCase(); docs = docs.filter(o => o.d.kind==='node' ? (o.d.n.act===pc.act && o.d.n.no.toUpperCase()===pc.no.replace(/\(.*\)/,'')) || o.d.group===researchScope(RQ.q) : true); }
  return docs;
}
function tabOf(doc){ return doc.tab; }
function inTab(doc, tab){
  if(tab==='All') return true;
  if(tab==='More') return !R_TABS.includes(doc.tab) && doc.tab!=='Judgments';
  return doc.tab===tab;
}

/* ---------- answer composer ---------- */
const caseById = id => CASES.find(c=>c.id===id);
function scoreTopic(t, q){ const s=q.toLowerCase(); let n=0; t.kw.forEach(k=>{ if(s.includes(k)) n += k.length>4?2:1; }); return n; }
function composeAnswer(q){
  const s = q.toLowerCase().trim(); if(!s) return null;
  const sc = researchScope(q);
  const pc = parseCite(q);
  /* 1. A bare section reference: show its correspondence */
  if(pc && !/\b(bail|limit|punish|notice|company|security)\b/.test(s)){
    const lab = ((ACT_SHORT[pc.act]||'')+' '+pc.no).toLowerCase();
    const row = CROSSWALK.find(r => r.old.toLowerCase()===lab || r.nw.toLowerCase().replace(/\(.*\)/,'').replace(/ and related/,'')===lab);
    if(row){ const oldN = row.oldKey&&NODES[row.oldKey], newN = row.nwKey&&NODES[row.nwKey];
      return {title:`${row.old} ↔ ${row.nw}`, paras:[`${CODE_NAME[row.code]?CODE_NAME[row.code][0]:''} ${row.old.replace(/^\D+/,'')} corresponds to ${CODE_NAME[row.code]?CODE_NAME[row.code][1]:''} ${row.nw.replace(/^\D+/,'')} (${REL_LABEL[row.rel].toLowerCase()}). ${row.note}`], law:[[row.old, row.nw, oldN?'/section/'+row.oldKey:'', newN?'/section/'+row.nwKey:'']], cases:[], flags:['Offences committed before 1 July 2024 are still tried under the old law. Check the date of the offence.','Mapping is pending editorial verification.'], more:`<button class="btn sm" data-go="/compare?q=${encodeURIComponent(q)}">Compare these provisions →</button>`}; }
  }
  /* 2. Section 138 NI Act */
  if(sc==='ni138') return composeNI(s);
  if(sc==='murder' && !/bail|anticipatory/.test(s)) return composeMurder(s);
  /* 3. General topics */
  let best=null, bs=0; TOPICS.forEach(t=>{ const n=scoreTopic(t,q); if(n>bs){ bs=n; best=t; } });
  if(best && bs>=1) return {title:best.title, paras:best.answer, law:best.law.map(l=>[l[0], l[1], '', '']), cases:best.cases.map(caseById).filter(Boolean), flags:best.flags};
  return null;
}
const CODE_NAME = {ipc:['IPC','BNS'],crpc:['CrPC','BNSS'],iea:['Evidence Act','BSA']};
function composeNI(s){
  const n = NODES['ni-138']; const pick = re => re.test(s);
  const base = {law:[['Negotiable Instruments Act, 1881, s.138',null,'/section/ni-138','']], flags:[]};
  const casesFor = issue => CASES.filter(c=>c.group==='ni138' && !c.ph && (!issue || c.issue===issue));
  if(pick(/time|limit|day|period|deadline|within/)) return {...base, title:'Section 138: time limits', paras:['Three time limits matter. The cheque must be presented within three months of its date (or within its validity, if shorter). The payee must give written notice within 30 days of receiving the bank’s information of dishonour. The drawer then has 15 days from receiving the notice to pay.','If the drawer does not pay, the complaint must be filed within one month after those 15 days expire (see s.142). Missing any step defeats the complaint.'], cases:casesFor('Service of notice').slice(0,1), flags:['Compute each period from the correct trigger date. The 30 days run from receipt of the bank’s information, not from the date on the cheque return memo alone.','The deadline helper in the Reminders calendar can add all three dates for you.'], more:'<button class="btn sm" data-go="/calendar?helper=138">Open the Section 138 deadline helper →</button>'};
  if(pick(/notice|serv|dispatch|registered post/)) return {...base, title:'Section 138: service of notice', paras:['The demand notice must be in writing and reach the drawer within 30 days of the payee receiving the bank’s information of dishonour.','Where notice is sent by registered post to the correct address, service can be presumed. A drawer who does not pay even after receiving the summons cannot then argue that the notice was never received.'], cases:casesFor('Service of notice'), flags:['Keep the postal receipt, tracking report and acknowledgment. The address on the notice should match the one in the cheque records.']};
  if(pick(/compan|director|vicarious|141/)) return {...base, title:'Section 138: offences by companies', paras:['Where the drawer is a company, s.141 makes persons in charge of its business liable. The Supreme Court has held that the company itself must be arraigned for the directors or officers to be prosecuted vicariously.','Mere designation as a director is not enough; the complaint should say how the person was in charge of, and responsible for, the conduct of the business.'], cases:casesFor('Company liability'), flags:['Check the specific averments against each director. A bare allegation is a common ground for quashing.']};
  if(pick(/security|blank|post-?dated|pdc/)) return {...base, title:'Section 138: cheques given as security', paras:['A cheque given as security can attract s.138 if the underlying liability has crystallised by the time it is presented. A cheque for a debt that is not yet due, or is disputed in a way that defeats the liability, stands differently.'], cases:casesFor('Security cheques'), flags:['The outcome turns on the facts: what was the debt, when did it fall due, and what did the parties agree about the cheque.']};
  if(pick(/jurisdiction|territorial|where.*(file|lodg)|142/)) return {...base, title:'Section 138: where to file', paras:['In 2014 the Supreme Court held that jurisdiction lay where the cheque was dishonoured. Parliament then amended the Act in 2015 so that, for a cheque delivered for collection through an account, jurisdiction lies where the payee’s branch is situated.'], cases:casesFor('Jurisdiction'), flags:['The 2014 decision is partly overridden by the 2015 amendment. Cite it only for what survives.']};
  if(pick(/presum|burden|139|rebut|enforceable debt/)) return {...base, title:'Section 138: presumption and burden', paras:['Section 139 raises a presumption that the cheque was issued for a legally enforceable debt. The accused can rebut it by showing a probable defence on a preponderance of probability, and need not always lead evidence.'], cases:casesFor('Presumption & burden'), flags:[]};
  if(pick(/compound|settle|147|summary|interim|143a|148/)) return {...base, title:'Section 138: compounding, summary trial and interim relief', paras:['The offence is compoundable (s.147) and the Supreme Court encourages early settlement. Trial should proceed summarily where possible (s.143).','Section 143A lets the court direct interim compensation to the complainant, and s.148 lets the appellate court order a deposit pending appeal.'], cases:casesFor('Compounding & trial'), flags:['Check the current limits on interim compensation and the appeal deposit in the text of ss.143A and 148.']};
  if(pick(/bail/)) return {...base, title:'Section 138: bail', paras:['The offence is bailable and non-cognizable, and it is triable by a Magistrate.'], cases:[], flags:['Under the BNSS, summons and trial procedure can differ. Check the date of the complaint.']};
  if(pick(/punish|penalt|sentence|fine|imprison/)) return {...base, title:'Section 138: punishment', paras:['Imprisonment up to two years, or fine up to twice the amount of the cheque, or both.'], cases:[], flags:[]};
  const cs = ['c4','c3','c2'].map(caseById).filter(Boolean);
  return {...base, title:'Section 138, Negotiable Instruments Act, 1881', paras:['Section 138 makes it an offence if a cheque is returned unpaid because the drawer’s account has insufficient funds or the amount exceeds the arrangement with the bank.','The offence is complete only if all three conditions are met: the cheque is presented within three months (or its validity); written notice is given within 30 days of the bank’s information; and the drawer fails to pay within 15 days of receiving the notice.','Punishment: imprisonment up to two years, or fine up to twice the cheque amount, or both. The offence is bailable, non-cognizable, compoundable (s.147) and triable by a Magistrate.'], cases:cs, quote:{t:n.body[0].t, src:'Summary of s.138 (gazetted wording to be inserted)'}, flags:['The three time limits are strict. Compute each from the correct trigger date.'], more:'<button class="btn sm" data-go="/section/ni-138">Open Section 138 →</button>'};
}
function composeMurder(s){
  const n = NODES['ipc-302']; const base = {law:[['Indian Penal Code, 1860, s.302 (repealed)','Bharatiya Nyaya Sanhita, 2023, s.103(1)','/section/ipc-302','/section/bns-103']], flags:['Offences committed before 1 July 2024 continue under the IPC, and Article 20(1) of the Constitution bars a heavier penalty than the law allowed when the act was done.']};
  const by = issue => CASES.filter(c=>c.group==='murder' && c.issue===issue);
  if(/sentenc|death|capital|rarest|life imprison|remission/.test(s)) return {...base, title:'Murder: sentencing', paras:['The sentence is death or imprisonment for life, and fine. Death is confined to the rarest of rare cases, decided by weighing aggravating and mitigating circumstances together. The Supreme Court has also recognised a fixed-term life sentence beyond the usual remission period as a middle path.'], cases:by('Sentencing')};
  if(/intention|culpable|knowledge|differ/.test(s)) return {...base, title:'Murder and culpable homicide: intention', paras:['The difference turns on intention and knowledge. For murder by intentional bodily injury, the injury must exist, be intentionally inflicted, and be sufficient in the ordinary course of nature to cause death.'], cases:by('Intention')};
  if(/evidence|circumstantial|dying declaration/.test(s)) return {...base, title:'Murder: proof by evidence', paras:['On circumstantial evidence, each circumstance must be fully proved and together they must form a chain pointing to guilt and nothing else. A dying declaration can be relied on without a doctor’s certificate of fitness if the court is satisfied that it is voluntary and true.'], cases:by('Evidence')};
  return {...base, title:'Murder: IPC section 302 and BNS section 103', paras:['Whoever commits murder is punished with death, or imprisonment for life, and is liable to fine. The offence is cognizable, non-bailable, non-compoundable and triable by a Court of Session.','IPC s.302 corresponds to BNS s.103(1), which carries the same punishment. BNS s.103(2) is new: murder by a group of five or more persons acting in concert on specified discriminatory grounds, which has no IPC predecessor.'], cases:CASES.filter(c=>c.group==='murder').slice(0,3), quote:{t:n.body[0].t, src:'IPC s.302 (text until 30 June 2024)'}};
}
function answerHTML(a, q){
  if(!a){
    return `<div class="aibox"><div class="ai-h"><span class="ai-ico">✦</span>No direct answer in the loaded material</div><p style="margin:0 0 8px">The sample database does not answer that question directly. In the live product this stage would say so instead of guessing. The results below match your words. You can also try one of these questions:</p><div class="chips">${TOPICS.map(t=>`<button class="chip" data-a="chipq2" data-v="${esc(t.title)}">${esc(t.title)}</button>`).join('')}</div><div class="disc">Not legal advice.</div></div>`;
  }
  const ca = a.cases.slice(0,3).sort((x,y)=>(x.court==='Supreme Court'?0:1)-(y.court==='Supreme Court'?0:1));

/* ===== VAULT STORE: IndexedDB storage and text extraction (PDF, Word, text) ===== */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const _scripts = {};
function loadScript(url){ return _scripts[url] ||= new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=url; s.onload=res; s.onerror=()=>{ delete _scripts[url]; rej(new Error('Could not load '+url)); }; document.head.appendChild(s); }); }

const VDB = (() => {
  let db = null, tried = false; const mem = new Map();
  const open = () => new Promise(res => {
    if(db || tried || !window.indexedDB) return res(db); tried = true;
    try{ const rq = indexedDB.open('llr-vault', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('docs', {keyPath:'id'}); rq.onsuccess = () => { db = rq.result; res(db); }; rq.onerror = () => res(null); rq.onblocked = () => res(null); }catch(e){ res(null); }
  });
  const run = async (mode, fn) => { const d = await open(); return new Promise((res,rej)=>{ const t = d.transaction('docs', mode); const r = fn(t.objectStore('docs')); t.oncomplete = () => res(r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    async put(d){ if(!(await open())){ mem.set(d.id, d); return; } await run('readwrite', s=>s.put(d)); },
    async get(id){ if(!(await open())) return mem.get(id); return run('readonly', s=>s.get(id)); },
    async all(){ if(!(await open())) return [...mem.values()]; return run('readonly', s=>s.getAll()); },
    async del(id){ if(!(await open())){ mem.delete(id); return; } await run('readwrite', s=>s.delete(id)); },
    persistent(){ return !!db; }
  };
})();

const splitParas = text => text.replace(/\r/g,'').split(/\n\s*\n/).map(s=>s.replace(/\s*\n\s*/g,' ').trim()).filter(s=>s.length>1);
async function pdfParas(buf){
  await loadScript(PDFJS); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise; const out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent(); const lines = [];
    tc.items.forEach(it => { if(!it.str || !it.str.trim()) return; const y = Math.round(it.transform[5]); let L = lines.find(l=>Math.abs(l.y-y)<=2); if(!L){ L={y,items:[]}; lines.push(L); } L.items.push({x:it.transform[4], s:it.str}); });
    lines.sort((a,b)=>b.y-a.y);
    const texts = lines.map(l=>({y:l.y, t:l.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()})).filter(l=>l.t);
    const gaps = []; for(let i=1;i<texts.length;i++) gaps.push(texts[i-1].y-texts[i].y);
    const med = [...gaps].sort((a,b)=>a-b)[Math.floor(gaps.length/2)] || 12;
    let cur = '';
    texts.forEach((l,i) => { const gap = i ? texts[i-1].y-l.y : 0; if(i && gap > med*1.5 && cur){ out.push({t:cur, pg:p}); cur=''; } if(cur.endsWith('-')) cur = cur.slice(0,-1)+l.t; else cur += (cur?' ':'')+l.t; });
    if(cur) out.push({t:cur, pg:p});
  }
  return {paras:out, pages:pdf.numPages};
}
async function extractFile(file){
  const name = file.name.toLowerCase(); const ext = (name.match(/\.([a-z0-9]+)$/)||[])[1]||'';
  if(ext==='pdf' || file.type==='application/pdf'){ const r = await pdfParas(await file.arrayBuffer()); return {...r, kind:'pdf'}; }
  if(ext==='docx'){ await loadScript(MAMMOTH); const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()}); return {paras: splitParas(r.value).map(t=>({t})), pages:0, kind:'docx'}; }
  if(['txt','md','text','rtf','html','htm'].includes(ext) || file.type.startsWith('text/')){ let t = await file.text(); if(/html?$/.test(ext)) t = new DOMParser().parseFromString(t,'text/html').body.textContent; const ps = splitParas(t); return {paras:(ps.length>1?ps:t.split('\n').filter(x=>x.trim()).map(x=>x.trim())).map(t=>({t})), pages:0, kind:'text'}; }
  if(file.type.startsWith('image/')) return {paras:[], pages:1, kind:'image'};
  return {paras:[], pages:0, kind:'other'};
}
const uid = () => 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function addToVault(file, folder){
  let ex; try{ ex = await extractFile(file); }catch(e){ ex = {paras:[], pages:0, kind:'other', error:String(e.message||e)}; }
  const doc = {id:uid(), name:file.name, type:file.type, size:file.size, added:Date.now(), folder:folder||'General', tags:[], blob:file, paras:ex.paras, pages:ex.pages, kind:ex.kind, error:ex.error||'', highlights:[], excerpts:[], notes:'', summary:null};
  await VDB.put(doc); return doc;
}

const SW = new Set('the and for that this with from have has had are was were will would should could may might must shall also not but their there which who whom whose when where while been being into onto upon over under than then them they its his her our your any all each such these those other another more most only very can did does done make made said above below herein thereof hereby'.split(' '));
const CUE = /\b(held|hold|we are of the view|accordingly|therefore|dismissed|allowed|directed|ordered|convicted|acquitted|upheld|set aside|quashed|remitted|decreed|liable|entitled|it is clear|in view of)\b/i;
const ACT_PAT = "(Code of (?:Criminal|Civil) Procedure(?:,?\\s*(?:of\\s+)?\\d{4})?|(?:[A-Z][A-Za-z()&.\\-]*\\s+){1,9}?(?:Act|Code|Sanhita|Adhiniyam)(?:,?\\s*(?:of\\s+)?\\d{4})?|IPC|I\\.P\\.C\\.?|CrPC|Cr\\.P\\.C\\.?|CPC|BNSS|BNS|BSA|NI Act|N\\.I\\. Act)";
function normAct(a){
  const t = a.toLowerCase();
  if(/penal code|^i\.?p\.?c/.test(t)) return ['ipc','Indian Penal Code, 1860'];
  if(/nyaya/.test(t)||t==='bns') return ['bns','Bharatiya Nyaya Sanhita, 2023'];
  if(/nagarik/.test(t)||t==='bnss') return ['bnss','Bharatiya Nagarik Suraksha Sanhita, 2023'];
  if(/sakshya/.test(t)||t==='bsa') return ['bsa','Bharatiya Sakshya Adhiniyam, 2023'];
  if(/criminal procedure|^cr\.?p\.?c/.test(t)) return ['crpc','Code of Criminal Procedure, 1973'];
  if(/civil procedure|^cpc/.test(t)) return ['cpc','Code of Civil Procedure, 1908'];
  if(/evidence act/.test(t)) return ['iea','Indian Evidence Act, 1872'];
  if(/negotiable instruments|^n\.?i\.? act/.test(t)) return ['ni','Negotiable Instruments Act, 1881'];
  return [a.replace(/\s+/g,' ').trim(), a.replace(/\s+/g,' ').trim()];
}
function findStatutes(paras){
  const re = new RegExp('\\b(?:Sections?|Secs?\\.?|S\\.|u/s)\\s*(\\d+[A-Z]{0,2}(?:\\(\\w+\\))*(?:\\s*(?:,|and|&|/)\\s*\\d+[A-Z]{0,2}(?:\\(\\w+\\))*)*)\\s*(?:,\\s*)?(?:of\\s+(?:the\\s+)?)?'+ACT_PAT,'g');
  const m = new Map();
  paras.forEach((p,pi)=>{ let x; re.lastIndex=0; while((x=re.exec(p.t))){ const [ak,an] = normAct(x[2]); x[1].split(/\s*(?:,|and|&|\/)\s*/).filter(Boolean).forEach(no=>{ const key = ak+'|'+no; const e = m.get(key) || {act:ak, actName:an, no, count:0, p:pi}; e.count++; m.set(key,e); }); } });
  const arts = new Map(); const ar = /\bArticles?\s+(\d+[A-Z]?(?:\(\d+\))?(?:\s*(?:,|and|&)\s*\d+[A-Z]?(?:\(\d+\))?)*)/g;
  paras.forEach((p,pi)=>{ let x; ar.lastIndex=0; while((x=ar.exec(p.t))) x[1].split(/\s*(?:,|and|&)\s*/).forEach(no=>{ const e = arts.get(no)||{no,count:0,p:pi}; e.count++; arts.set(no,e); }); });
  /* bare references such as "Section 139" with no Act named: assume the document's main Act and say so */
  const dom = [...m.values()].reduce((a,e)=>{ a[e.act]=(a[e.act]||0)+e.count; return a; },{}); const top = Object.entries(dom).sort((a,b)=>b[1]-a[1])[0];
  if(top){
    const nm = [...m.values()].find(e=>e.act===top[0]).actName;
    const bare = /\b(?:Sections?|Secs?\.?)\s*(\d+[A-Z]{0,2}(?:\(\w+\))*(?:\s*(?:,|and|&|\/)\s*\d+[A-Z]{0,2}(?:\(\w+\))*)*)(?!\s*(?:\(\w+\))*\s*(?:,\s*)?(?:of\s+(?:the\s+)?)?(?:[A-Z][A-Za-z()&.\-]*\s+){0,9}(?:Act|Code|Sanhita|Adhiniyam)\b)/g;
    paras.forEach((p,pi)=>{ let x; bare.lastIndex=0; while((x=bare.exec(p.t))) x[1].split(/\s*(?:,|and|&|\/)\s*/).filter(Boolean).forEach(no=>{ const key = top[0]+'|'+no; const e = m.get(key); if(e) e.count++; else m.set(key,{act:top[0], actName:nm, no, count:1, p:pi, inferred:true}); }); });
  }

}
function findCitations(paras){
  const out = new Map(); const re = /\(\d{4}\)\s*\d+\s*SCC\s*\d+|AIR\s*\d{4}\s*SC\s*\d+|\d{4}\s*SCC OnLine\s*\w+\s*\d+|\[\d{4}\]\s*\d+\s*SCR\s*\d+|\d{4}\s*Supp\s*\(\d+\)\s*SCC\s*\d+/g;
  paras.forEach((p,pi)=>{ let x; re.lastIndex=0; while((x=re.exec(p.t))){ const before = p.t.slice(Math.max(0,x.index-130), x.index); let nm = null; { let vi = -1; for(const mm of before.matchAll(/\s+v(?:s)?\.?\s+(?=[A-Z])/g)) vi = mm.index; if(vi>0){ const left = before.slice(0,vi); const lm = left.match(/((?:[A-Z][\w.&'’-]*\s+(?:(?:of|and|the|&)\s+)?){0,5}[A-Z][\w.&'’-]*)$/); const right = before.slice(vi).replace(/[\s,(\[]+$/,'').trim(); if(lm) nm = [null, (lm[1].trim()+' '+right).replace(/\s+/g,' ')]; } } const key = x[0].replace(/\s+/g,' '); if(!out.has(key)) out.set(key,{cite:key, name:nm?nm[1].trim():'', p:pi}); } });
  return [...out.values()];
}
function findDates(paras){
  const re = /\b(\d{1,2}(?:st|nd|rd|th)?\s+(?:January|February|March|April|May|June|July|August|September|October|November|December),?\s+\d{4}|\d{1,2}[./-]\d{1,2}[./-]\d{2,4})\b/g; const out=[]; const seen=new Set();
  paras.forEach((p,pi)=>{ let x; re.lastIndex=0; while((x=re.exec(p.t))){ if(seen.has(x[1])) continue; seen.add(x[1]); const a=Math.max(0,x.index-70), b=Math.min(p.t.length,x.index+x[0].length+50); out.push({d:x[1], ctx:(a?'\u2026':'')+p.t.slice(a,b).trim()+(b<p.t.length?'\u2026':''), p:pi}); } });
  return out;
}
function findAmounts(paras){ const re=/(?:Rs\.?|INR|\u20b9)\s?[\d,]+(?:\.\d+)?(?:\s?(?:lakhs?|crores?))?/gi; const s=new Map(); paras.forEach((p,pi)=>{ let x; re.lastIndex=0; while((x=re.exec(p.t))) if(!s.has(x[0])) s.set(x[0],pi); }); return [...s].map(([a,p])=>({a,p})); }
function findDeadlines(paras){ const re=/\bwithin\s+(?:a\s+period\s+of\s+)?(?:[\w-]+\s+)?(?:\(\s*\d+\s*\)\s*)?(?:\d+\s+)?(?:days?|weeks?|months?|years?)(?:\s+(?:of|from|after)\s+[^.,;]{3,50})?/gi; const out=[]; const seen=new Set(); paras.forEach((p,pi)=>{ let x; re.lastIndex=0; while((x=re.exec(p.t))){ const k=x[0].toLowerCase(); if(seen.has(k)) continue; seen.add(k); out.push({t:x[0].trim(), p:pi}); } }); return out; }
function sentencesOf(paras){ const out=[]; paras.forEach((p,pi)=>{ p.t.split(/(?<=[.?!])\s+(?=[A-Z0-9\u201c"(])/).forEach(s=>{ s=s.trim(); if(s.length>25) out.push({t:s,p:pi}); }); }); return out; }
function docKind(text){
  const t = text.toLowerCase(); const c = re => (t.match(re)||[]).length;
  const score = {judgment:c(/\b(appellant|respondent|judgment|held|bench|hon.ble|court)\b/g)+3*c(/we are of the view|appeal is (allowed|dismissed)/g), notice:c(/\b(notice|hereby|call upon|demand)\b/g)*1.5, agreement:c(/\b(agreement|whereas|clause|hereinafter|witnesseth|party of the)\b/g)*1.5, petition:c(/\b(prayer|petitioner|humbly|most respectfully|writ)\b/g)*1.5, order:c(/\b(it is ordered|list on|listed|ordered that)\b/g)*3, statute:c(/\b(be it enacted|chapter|sub-section|short title)\b/g)*2};
  const k = Object.entries(score).sort((a,b)=>b[1]-a[1])[0]; return k[1]>2 ? k[0] : 'document';
}
const KIND_LABEL = {judgment:'Judgment or order of a court',notice:'Notice or demand',agreement:'Agreement or contract',petition:'Petition or application',order:'Court order',statute:'Statute or legislation',document:'Document'};
function summariseDoc(doc){
  const paras = doc.paras; const text = paras.map(p=>p.t).join('\n'); const sents = sentencesOf(paras);
  const freq = {}; text.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).forEach(w=>{ if(w.length>3 && !SW.has(w)) freq[w]=(freq[w]||0)+1; });
  const score = (s,i) => { const ws = s.t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w=>w.length>3&&!SW.has(w)); let v = ws.reduce((a,w)=>a+(freq[w]||0),0)/Math.pow(Math.max(ws.length,4),0.6); if(CUE.test(s.t)) v*=1.6; if(/\bSections?\s+\d|Article\s+\d|\bv\.\s/.test(s.t)) v*=1.15; if(s.p<2) v*=1.1; if(s.t.length>420) v*=0.7; return v; };
  const ranked = sents.map((s,i)=>({...s,v:score(s,i),i})).sort((a,b)=>b.v-a.v);
  const pick = (arr,n) => arr.slice(0,n).sort((a,b)=>a.i-b.i);
  const kind = docKind(text);
  const head = text.slice(0,1800);
  const pm = head.match(/([A-Z][\w.&'\u2019-]*(?:\s+[A-Z&][\w.&'\u2019-]*){0,5})\s+(?:v\.?|vs\.?|versus)\s+([A-Z][\w.&'\u2019-]*(?:\s+[A-Za-z&][\w.&'\u2019-]*){0,6}?)(?=[.,;(\n]|\s+\d|$)/);
  const cm2 = head.match(/\b(supreme court of india|high court of [a-z&]+(?:\s(?!at\b)[a-z&]+){0,3})/i);
  const cm = head.match(/(Supreme Court of India|High Court of [A-Z][A-Za-z&]+(?:\s[A-Za-z&]+){0,3}|[A-Z][a-z]+ High Court|National Company Law (?:Appellate )?Tribunal|Income Tax Appellate Tribunal|National Green Tribunal|[A-Z][A-Za-z ]+ Tribunal)/);
  const op = sents.filter(s=>s.p>=Math.floor(paras.length*0.7)).map((s,i)=>({...s,v:/\b(dismissed|allowed|set aside|directed|ordered|remitted|quashed|convicted|acquitted|decreed|disposed)\b/i.test(s.t)?5:0})).filter(s=>s.v).slice(0,4);
  const issues = sents.filter(s=>/\b(whether|question (?:before|for)|issue)\b/i.test(s.t)).slice(0,3);
  const duties = sents.filter(s=>/\b(shall|must|agrees? to|undertakes?|liable to|bound to|obliged)\b/i.test(s.t)).slice(0,6);
  const st = findStatutes(paras);
  return {kind, kindLabel:KIND_LABEL[kind], words:text.split(/\s+/).filter(Boolean).length, parties: pm?{a:pm[1].trim(), b:pm[2].split(/\.\s+(?=[A-Z])/)[0].replace(/[.,;]+$/,'').trim()}:null, court: cm?cm[1].trim():(cm2?cm2[1].toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bOf\b/g,'of'):''), overview: pick(ranked,5), operative: op, issues, duties, statutes: st.sections, articles: st.articles, cites: findCitations(paras), dates: findDates(paras).slice(0,10), amounts: findAmounts(paras).slice(0,6), deadlines: findDeadlines(paras).slice(0,8)};
}
function pref(i){ return `<button class="pref" data-a="gopara" data-v="${i}" title="Go to this passage">\u00b6${i+1}</button>`; }
function statuteLink(e){ const k = e.act+'-'+e.no.replace(/\(.*/,''); const tag = e.inferred ? ' <span class="muted">(Act inferred from context)</span>' : ''; return (NODES[k] && !NODES[k].stub ? `<button class="xref" data-open="${k}">${esc(e.actName)}, s.${esc(e.no)}</button>` : esc(`${e.actName}, s.${e.no}`)) + tag; }
function summaryHTML(doc, s){
  const sec = (title, body) => body ? `<div class="sum-sec"><h4>${title}</h4>${body}</div>` : '';
  const li = (arr, f) => arr.length ? `<ul class="sum-list">${arr.map(f).map(x=>`<li>${x}</li>`).join('')}</ul>` : '';
  const sent = x => `${esc(x.t)} ${pref(x.p)}`;
  let h = `<div class="callout" style="margin-bottom:12px"><b>Automatic summary, built in your browser</b>It selects the most important sentences and finds citations, dates and provisions. It does not rewrite or interpret. Check each point against the source paragraph.</div>
   <div class="sum-meta"><span class="pill note">${esc(s.kindLabel)}</span><span class="pill act">${s.words.toLocaleString('en-IN')} words</span>${doc.pages?`<span class="pill act">${doc.pages} page${doc.pages>1?'s':''}</span>`:''}${s.court?`<span class="pill act">${esc(s.court)}</span>`:''}</div>`;
  if(s.parties) h += sec('Parties', `<p style="margin:0"><b>${esc(s.parties.a)}</b> <span class="muted">v.</span> <b>${esc(s.parties.b)}</b></p>`);
  h += sec('In short', li(s.overview, sent));
  if(s.issues.length) h += sec('Issues raised', li(s.issues, sent));
  if(s.operative.length) h += sec(s.kind==='judgment'||s.kind==='order'?'Operative part (result)':'Closing terms', li(s.operative, sent));
  if(['agreement','notice'].includes(s.kind)||(s.duties.length&&s.kind!=='judgment')) h += sec('Obligations and terms', li(s.duties, sent));
  if(s.deadlines.length) h += sec('Time limits mentioned', li(s.deadlines, d=>`${esc(d.t)} ${pref(d.p)}`));
  if(s.dates.length) h += sec('Dates', `<table class="mini">${s.dates.map(d=>`<tr><td>${esc(d.d)}</td><td>${esc(d.ctx)} ${pref(d.p)}</td></tr>`).join('')}</table>`);
  if(s.amounts.length) h += sec('Amounts', li(s.amounts, a=>`${esc(a.a)} ${pref(a.p)}`));
  if(s.statutes.length||s.articles.length) h += sec('Provisions cited', li([...s.statutes.map(e=>`${statuteLink(e)} <span class="muted">\u00d7${e.count}</span> ${pref(e.p)}`), ...s.articles.map(e=>`Constitution of India, Article ${esc(e.no)} <span class="muted">\u00d7${e.count}</span> ${pref(e.p)}`)], x=>x));
  if(s.cites.length) h += sec('Cases cited', li(s.cites, c=>`${c.name?`<b>${esc(c.name)}</b> `:''}${esc(c.cite)} ${pref(c.p)}`));
  h += `<div class="row" style="margin-top:14px"><button class="btn sm" data-a="copysum">Copy summary</button><button class="btn sm" data-a="sum2excerpts">Save key points to excerpts</button>${window.LLR_AI_ENDPOINT?'<button class="btn sm" data-a="sumai">Improve with the connected model</button>':''}</div><div id="sumai"></div>`;
  return h;
}
function summaryText(doc, s){
  return [doc.name, s.kindLabel, s.parties?`${s.parties.a} v. ${s.parties.b}`:'', '', 'In short:', ...s.overview.map(x=>'- '+x.t+' (para '+(x.p+1)+')'), '', s.operative.length?'Result:':'', ...s.operative.map(x=>'- '+x.t), '', s.statutes.length?'Provisions: '+s.statutes.map(e=>`${e.actName} s.${e.no}`).join('; '):'', s.cites.length?'Cases: '+s.cites.map(c=>`${c.name} ${c.cite}`.trim()).join('; '):''].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');

/* ---------- ask this document: grounded in passages, never invented ---------- */
function askDocument(doc, q){
  const s = doc._sum || (doc._sum = summariseDoc(doc)); const t = q.toLowerCase();
  const lst = (title, arr, f) => arr.length ? {title, items:arr.map(f)} : null;
  if(/\bparties|who (is|are)|petitioner|appellant|respondent/.test(t) && s.parties) return {title:'Parties', items:[`${s.parties.a} v. ${s.parties.b}`], para:0};
  if(/\b(when|date|dates|timeline|chronolog)/.test(t) && s.dates.length) return {title:'Dates found in the document', items:s.dates.map(d=>`${d.d}: ${d.ctx}`), refs:s.dates.map(d=>d.p)};
  if(/(statute|section|provision|act|article|law)s?\b.*(cited|referred|relied|invoked|mentioned)|which sections|provisions/.test(t)) return {title:'Provisions cited', items:[...s.statutes.map(e=>`${e.actName}, s.${e.no} (\u00d7${e.count})`), ...s.articles.map(e=>`Article ${e.no} (\u00d7${e.count})`)], refs:[...s.statutes.map(e=>e.p), ...s.articles.map(e=>e.p)]};
  if(/(cases?|precedents?|judgments?|authorit)(ies)?\b.*(cited|referred|relied)|cited cases/.test(t)) return {title:'Cases cited', items:s.cites.map(c=>`${c.name} ${c.cite}`.trim()), refs:s.cites.map(c=>c.p)};
  if(/\b(amount|sum|rs\.?|rupees|money|payable|compensation)\b/.test(t) && s.amounts.length) return {title:'Amounts mentioned', items:s.amounts.map(a=>a.a), refs:s.amounts.map(a=>a.p)};
  if(/\b(deadline|time limit|within how|period|days)\b/.test(t) && s.deadlines.length) return {title:'Time limits mentioned', items:s.deadlines.map(d=>d.t), refs:s.deadlines.map(d=>d.p)};
  if(/\b(result|outcome|held|decision|decided|order|relief|direction|conclusion|dispos)/.test(t) && s.operative.length) return {title:'Result', items:s.operative.map(x=>x.t), refs:s.operative.map(x=>x.p)};
  const terms = words(q); if(!terms.length) return null;
  const df = {}; doc.paras.forEach(p=>{ const set = new Set(words(p.t)); terms.forEach(w=>{ if(set.has(w)) df[w]=(df[w]||0)+1; }); });
  const N = doc.paras.length||1;
  const scored = doc.paras.map((p,i)=>{ const pw = words(p.t); let v=0; terms.forEach(w=>{ const tf = pw.filter(x=>x===w).length; if(tf) v += (1+Math.log(tf)) * Math.log(1+N/(df[w]||1)); }); return {i,v,t:p.t}; }).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);
  const need = Math.max(1, Math.min(terms.length, 2));
  if(!scored.length || scored[0].v < 1.0*need) return null;
  return {title:'Most relevant passages', passages:scored};
}

function snippet(d, q){ if(!q) return ''; const p = (d.paras||[]).find(p=>p.t.toLowerCase().includes(q)); if(!p) return ''; const i = p.t.toLowerCase().indexOf(q); const a = Math.max(0,i-60); return `<div class="vsnip">…${esc(p.t.slice(a,i))}<mark class="find">${esc(p.t.slice(i,i+q.length))}</mark>${esc(p.t.slice(i+q.length,i+q.length+90))}…</div>`; }

async function ingest(files, openAfter){
  files = files.filter(Boolean); if(!files.length) return; let last=null;
  for(const f of files){ notify('Reading '+f.name+'…'); const d = await addToVault(f, VS.folder==='All'?'General':VS.folder); last=d; addHistory(d.name,'doc','/doc/'+d.id); if(d.error) notify('Could not read the text of '+d.name+'. It is stored for viewing.'); else if(!d.paras.length && d.kind!=='image') notify(d.name+' has no selectable text (possibly scanned). OCR is not available in this prototype.'); }
  if(openAfter && last){ go('/doc/'+last.id+'?tab=Summary'); return; }
  if($('vlist')){ VS.docs = await VDB.all(); drawFolderChips(); drawVaultList(); } else go('/workspace');

}
function pickFiles(multi, cb){ const i=document.createElement('input'); i.type='file'; i.multiple=multi; i.accept='.pdf,.docx,.txt,.md,.rtf,.html,.png,.jpg,.jpeg'; i.style.display='none'; document.body.appendChild(i); i.onchange=()=>{ cb([...i.files]); i.remove(); }; i.click(); }

/* ---------- Reader ---------- */
VIEWS.doc = id => `<div class="page"><div class="crumb"><a href="#/">Home</a> / <a href="#/workspace">Workspace</a> / Document</div><div id="rdroot"><p class="muted">Opening document…</p></div></div>`;

  const tab = parseHash().query.tab;
  RD = {doc:d, tab: tab || 'Summary', find:'', color:'yellow', view:'text', cur:-1, qa:[], sel:null};

function isHeading(t){ return t.length<90 && (/^[A-Z0-9 ,.'()\-:&]{4,}$/.test(t) || /^(\d+\.|[IVX]+\.|[A-Z]\.|chapter|section|clause|article|schedule|part)\b/i.test(t)); }
function paraHTML(i){
  const d = RD.doc, p = d.paras[i]; const marks = [];
  d.highlights.filter(h=>h.p===i).forEach(h=>marks.push({s:h.s,e:h.e,cls:'hl hl-'+h.color+(h.note?' noted':''),id:h.id}));
  if(RD.find){ const t=p.t.toLowerCase(), f=RD.find.toLowerCase(); let k=0; while((k=t.indexOf(f,k))>=0){ marks.push({s:k,e:k+f.length,cls:'find',find:true}); k+=f.length; } }
  marks.sort((a,b)=>a.s-b.s||a.find-b.find); let out='', pos=0;
  marks.forEach(m=>{ if(m.s<pos) return; out += esc(p.t.slice(pos,m.s)); out += `<${m.find?'mark':'span'} class="${m.cls}" ${m.id?`data-hl="${m.id}"`:''}>${esc(p.t.slice(m.s,m.e))}</${m.find?'mark':'span'}>`; pos = m.e; });
  out += esc(p.t.slice(pos));
  const pg = (i===0 || (p.pg && d.paras[i-1].pg!==p.pg)) && p.pg ? `<div class="pgbreak">Page ${p.pg}</div>` : '';
  return `${pg}<div class="dp" id="dp-${i}" data-p="${i}"><span class="pn">¶${i+1}</span><span class="pt">${out}</span></div>`;
}
function drawText(){ const d=RD.doc; $('rdtext').innerHTML = d.paras.map((_,i)=>paraHTML(i)).join('') || '<p class="muted">No text could be read from this file.</p>'; const c=$('findcount'); if(c){ const n=$('rdtext').querySelectorAll('mark.find').length; c.textContent = RD.find ? n+' match'+(n===1?'':'es') : ''; } }
function drawReader(){
  const d = RD.doc, words = d.paras.reduce((n,p)=>n+p.t.split(/\s+/).length,0);

  $('rdroot').innerHTML = `<div class="page-head"><div><div class="row"><span class="pill note">${esc((KIND_TAG[d.kind]||'FILE'))}</span><span class="pill act">${esc(d.folder)}</span>${d.pages?`<span class="pill act">${d.pages} page${d.pages>1?'s':''}</span>`:''}<span class="pill act">${words.toLocaleString('en-IN')} words</span></div><h1 style="margin-top:8px;font-size:28px">${esc(d.name)}</h1></div>
    <div class="row"><button class="btn" data-a="rdview" data-v="${RD.view==='text'?'orig':'text'}">${RD.view==='text'?'View original file':'Back to text reader'}</button><button class="btn" data-a="rddownload">Download</button><button class="btn" data-go="/workspace">← Vault</button></div></div>
   <div class="rd-layout"><aside class="card rd-side"><div class="overline">Find in document</div><input class="field" id="rdfind" placeholder="Search this document" value="${esc(RD.find)}" aria-label="Search this document"><div class="row" style="margin:6px 0 12px"><small class="muted" id="findcount"></small><button class="linkbtn" data-a="findnext">Next ↓</button></div>
     ${outline.length?`<div class="overline">Outline</div><div class="outline">${outline.map(o=>`<button data-a="gopara" data-v="${o.i}">${esc(o.p.t.length>44?o.p.t.slice(0,42)+'…':o.p.t)}</button>`).join('')}</div>`:''}
     <div class="overline" style="margin-top:12px">Highlights (${d.highlights.length})</div><div id="hllist"></div></aside>
    <section class="rd-main"><div class="rd-bar"><span class="muted" style="font-size:13px">Select text to highlight, note or save it as an excerpt.</span></div><div id="rdmain"></div></section>
    <aside class="card rd-right"><div class="rd-tabs">${['Summary','Ask','Excerpts','Notes'].map(t=>`<button class="${RD.tab===t?'active':''}" data-a="rdtab" data-v="${t}">${t}${t==='Excerpts'?` (${d.excerpts.length})`:''}</button>`).join('')}</div><div id="rdpanel"></div></aside></div>`;
  drawMain(); drawHlList(); drawRdPanel();

function drawMain(){
  const d = RD.doc, m = $('rdmain'); if(RD.view==='orig'){
    const url = URL.createObjectURL(d.blob);
    m.innerHTML = d.kind==='pdf' ? `<iframe src="${url}" title="${esc(d.name)}" style="width:100%;height:78vh;border:1px solid var(--line);border-radius:12px"></iframe>` : d.kind==='image' ? `<img src="${url}" alt="${esc(d.name)}" style="max-width:100%;border:1px solid var(--line);border-radius:12px">` : '<div class="callout">Word and text files cannot be shown in their original layout here. Use Download to open them in another application.</div>'; return; }

}
function drawHlList(){ const d=RD.doc; const el=$('hllist'); if(!el) return; el.innerHTML = d.highlights.map(h=>`<div class="rd-hl"><span class="sw hl-${h.color}"></span><button class="tx" data-a="gopara" data-v="${h.p}" title="Go to passage">${esc((d.paras[h.p].t.slice(h.s,h.e)).slice(0,70))}${h.note?`<br><i class="muted">${esc(h.note.slice(0,60))}</i>`:''}</button><button class="iconbtn sm" data-a="hldel" data-v="${h.id}" aria-label="Remove highlight">✕</button></div>`).join('') || '<small class="muted">None yet</small>'; }

  } else {

  }
}
const qaHTML = x => `<div class="qa"><div class="q">${esc(x.q)}</div>${x.a?(x.a.passages?x.a.passages.map(p=>`<div style="margin-bottom:6px">${esc(p.t.length>320?p.t.slice(0,318)+'…':p.t)} ${pref(p.i)}</div>`).join(''):`<b>${esc(x.a.title)}</b><ul>${x.a.items.map((it,k)=>`<li>${esc(it)} ${x.a.refs&&x.a.refs[k]!==undefined?pref(x.a.refs[k]):(x.a.para!==undefined?pref(x.a.para):'')}</li>`).join('')}</ul>`):'<span class="muted">This is not stated in the document. Try different words, or read the relevant section directly.</span>'}</div>`;
