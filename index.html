<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LiveLaw — Legal Research</title>
<style>
:root{--red:#d51d31;--ink:#171b23;--muted:#737986;--line:#e6e8eb;--surface:#f8f9fb;--shadow:0 12px 30px rgba(15,23,42,.06)}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f4a8b0;outline-offset:2px}header{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 35px;gap:45px;background:#fff}.brand{border:0;background:none;padding:0;display:flex;align-items:center}.brand img{width:180px;height:62px;object-fit:contain}nav{display:flex;height:100%;align-items:center;gap:38px;flex:1}nav button{height:100%;background:none;border:0;color:#303744;padding:0 6px;border-bottom:2px solid transparent}nav button.active{color:#111827;border-bottom-color:var(--red);font-weight:700}.header-right{display:flex;align-items:center;gap:20px;color:#343e4a}.iconbtn{border:0;background:none;color:inherit;padding:7px}.avatar{width:35px;height:35px;border-radius:50%;background:#e9ebef;display:grid;place-items:center}.account{display:flex;align-items:center;gap:9px;font-size:14px}.shell{display:grid;grid-template-columns:minmax(230px,22.5%) minmax(470px,1fr) minmax(310px,27%);height:calc(100vh - 78px);min-height:620px}.history{background:#fbfbfc;border-right:1px solid var(--line);padding:32px 22px 18px;display:flex;flex-direction:column;min-height:0}.history-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:17px;font-weight:700;gap:12px}.history-head .hist-title{display:flex;align-items:center;gap:10px;font-size:17px}.new{border:0;background:none;color:var(--red);font-size:14px;white-space:nowrap}.history-list{overflow:auto;flex:1;padding:9px 0;scrollbar-width:thin}.group-title{color:#9198a3;font-size:13px;margin:16px 0 8px}.history-item{display:flex;align-items:flex-start;gap:10px;padding:9px 6px;width:100%;border:0;border-radius:8px;background:transparent;text-align:left;color:#343b47}.history-item:hover{background:#f0f1f3}.history-item svg{flex-shrink:0;margin-top:3px}.history-item .txt{min-width:0}.history-item strong{font-size:13px;font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item small{display:block;color:#8a929e;font-size:12px;margin-top:5px}.clear{border:1px solid var(--line);background:transparent;border-radius:8px;padding:10px;color:#6d7581;width:100%}.main{min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:0 26px}.hero{width:100%;max-width:860px;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:clamp(42px,7vh,90px);position:relative;z-index:1}.hero-logo{width:192px;height:140px;object-fit:contain;margin-bottom:10px}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(35px,3.7vw,55px);line-height:1.1;letter-spacing:-1.5px;margin:6px 0 20px;font-weight:600}.intro{font-size:16px;line-height:1.65;color:#7b818b;max-width:650px;margin:0 0 30px}.searchbar{display:flex;align-items:center;gap:15px;width:100%;border:1px solid #dfe3e8;border-radius:12px;box-shadow:var(--shadow);padding:10px 10px 10px 19px;background:#fff}.searchbar input{width:100%;min-width:0;flex:1;border:0;outline:0;font-size:15px;padding:13px 0;color:#252b34}.searchbar input::placeholder{color:#9aa1ad}.go{width:48px;height:48px;background:var(--red);border:0;border-radius:9px;color:white;font-size:25px;display:grid;place-items:center;flex-shrink:0}.suggestions{width:100%;text-align:left;margin-top:24px}.suggestions-label{color:#858b95;font-size:13px;margin-bottom:12px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{border:1px solid #e4e5e9;background:#fff;border-radius:22px;padding:9px 12px;font-size:12px;color:#5b626d}.chip:hover{border-color:var(--red);color:var(--red)}.art{flex:1;min-height:115px;width:100%;max-width:760px;position:relative;display:flex;align-items:end;justify-content:center;opacity:.65;pointer-events:none;overflow:hidden}.art svg{width:100%;height:100%;max-height:290px}.art .quote{position:absolute;right:4%;bottom:32px;text-align:left;font-family:Georgia,serif;font-style:italic;color:#626a73;line-height:1.35;font-size:clamp(12px,1.3vw,18px);padding-left:20px;border-left:1px solid #a9adb5}.side{border-left:1px solid var(--line);background:#fbfbfc;padding:34px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}.feature{display:flex;align-items:center;width:100%;gap:16px;background:white;border:1px solid var(--line);border-radius:12px;text-align:left;flex:1;min-height:104px;max-height:150px;padding:18px 19px;box-shadow:0 1px 2px rgba(0,0,0,.015);transition:border-color .15s,transform .15s}.feature:hover{border-color:#eca3aa;transform:translateY(-1px)}.feature svg{flex:0 0 auto}.feature-copy{flex:1;min-width:0}.feature-copy strong{display:block;font-family:Georgia,serif;font-size:23px;font-weight:600;margin-bottom:8px}.feature-copy span{display:block;font-size:13px;line-height:1.55;color:#828995}.arrow{color:var(--red);font-size:26px}.content-view{width:100%;max-width:800px;padding:44px 5px 50px;display:none}.content-view.show{display:block}.main.detail .hero,.main.detail .art{display:none}.eyebrow{color:var(--red);font-weight:700;font-size:12px;letter-spacing:1.6px;text-transform:uppercase}.content-view h2{font-family:Georgia,serif;font-size:36px;margin:13px 0}.desc{color:#707783;line-height:1.7}.result{border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:13px 0;background:white}.result h3{font-family:Georgia,serif;margin:0 0 8px;font-size:21px}.result p{color:#737b86;line-height:1.6;font-size:14px;margin:0 0 12px}.linkbtn{border:0;background:none;padding:0;color:var(--red);font-size:13px}.back{background:none;border:0;color:#697280;font-size:14px;padding:0 0 16px}.search-mini{display:flex;gap:10px;margin:20px 0}.search-mini input,.editor{padding:13px;border:1px solid var(--line);border-radius:9px;flex:1;min-width:0}.primary{background:var(--red);border:0;border-radius:8px;color:white;padding:12px 18px}.muted-box{background:#fafafa;border:1px solid var(--line);padding:19px;border-radius:10px;color:#68717e;line-height:1.7}.editor{display:block;width:100%;min-height:150px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tooltile{padding:22px;background:#fff;border:1px solid var(--line);border-radius:10px;text-align:left;cursor:pointer}.tooltile b{font-family:Georgia,serif;font-size:19px}.tooltile p{color:#7c8490;font-size:13px;line-height:1.5}.tooltile:hover{border-color:#df8792}.mobile-hist{display:none}@media(max-width:1150px){header{gap:25px;padding:0 20px}nav{gap:18px}.shell{grid-template-columns:220px minmax(360px,1fr) 285px}.history{padding:25px 12px}.side{padding:22px 10px}.feature{padding:12px;gap:9px}.feature-copy strong{font-size:20px}.feature-copy span{font-size:12px}.hero{padding-top:40px}.hero-logo{height:100px;width:160px}.hero h1{font-size:37px}}@media(max-width:850px){header{height:64px;gap:20px}.brand img{height:49px;width:125px}nav{gap:10px;overflow:auto}nav button{font-size:12px}.header-right{display:none}.shell{height:auto;min-height:calc(100vh - 64px);display:grid;grid-template-columns:minmax(0,1fr)}.history{display:none}.main{min-height:540px}.side{border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible}.feature{height:110px}.art{display:none}}@media(max-width:520px){header{padding:0 12px}.brand img{width:103px}nav{gap:5px}nav button{padding:0 2px}.main{padding:0 17px;min-height:480px}.hero{padding-top:38px}.hero h1{font-size:34px}.intro{font-size:14px}.searchbar input{font-size:13px}.side{grid-template-columns:1fr}.feature{height:100px}.twocol{grid-template-columns:1fr}}

/* Feature navigation belongs exclusively to Home; inner pages expand to available space. */
nav button .nav-news-arrow{color:var(--red);font-size:18px;margin-left:5px;font-weight:600;vertical-align:-1px;display:inline-block;transition:transform .15s}
nav button:hover .nav-news-arrow{transform:translateX(3px)}
.shell.on-detail{grid-template-columns:minmax(230px,22.5%) minmax(0,1fr)}
.shell.on-detail .side{display:none!important}
.shell.on-detail .main{align-items:stretch}
.shell.on-detail .content-view{max-width:1050px;width:100%;margin:0 auto}
@media(max-width:1150px) and (min-width:851px){.shell.on-detail{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:850px){.shell.on-detail{grid-template-columns:minmax(0,1fr)}}

(function(){'use strict';const sample=['Bail under Section 439 CrPC','Quashing of FIR High Court','Section 138 Negotiable Instruments Act','Arbitration and Conciliation Act','Service law principles natural justice','Right to privacy Supreme Court','Consumer Protection Act remedies','Land acquisition compensation','Article 21 interpretation','Specific performance of contract'];const storageKey='livelaw-research-history-v2';let history=[];try{const s=JSON.parse(localStorage.getItem(storageKey));history=Array.isArray(s)?s:sample.map((q,i)=>({q,at:Date.now()-(i<3?i*7200000:i<6?86400000:(i-3)*86400000)}))}catch(e){history=sample.map((q,i)=>({q,at:Date.now()-i*86400000}))}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function save(){try{localStorage.setItem(storageKey,JSON.stringify(history))}catch(e){}}function renderHistory(){const root=document.getElementById('history');let groups={'Today':[],'Yesterday':[],'Previous 7 days':[]};history.forEach(h=>{let days=(Date.now()-h.at)/86400000;groups[days<1?'Today':days<2?'Yesterday':'Previous 7 days'].push(h)});root.innerHTML=Object.entries(groups).map(([name,items])=>items.length?'<div class="group-title">'+name+'</div>'+items.map(h=>'<button class="history-item" data-query="'+escapeHTML(h.q)+'"><svg width="17" height="17" viewBox="0 0 24 24" stroke="#7d8794" stroke-width="1.7" fill="none"><circle cx="10" cy="10" r="7"/><path d="m16 16 5 5"/></svg><span class="txt"><strong>'+escapeHTML(h.q)+'</strong><small>'+ (Math.max(0,Math.floor((Date.now()-h.at)/86400000))>=1?Math.floor((Date.now()-h.at)/86400000)+' day(s) ago':Math.max(1,Math.floor((Date.now()-h.at)/3600000))+' hour(s) ago')+'</small></span></button>').join(''):'').join('')||'<p class="desc">Your searches will appear here.</p>';root.querySelectorAll('[data-query]').forEach(el=>el.addEventListener('click',()=>window.runSearch(el.getAttribute('data-query'))))}window.clearHistory=function(){history=[];save();renderHistory()};window.newSearch=function(){showHome();document.getElementById('query').value='';document.getElementById('query').focus()};function setTab(name){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.getAttribute('data-tab')===name))}window.showHome=function(){document.querySelector('.shell').classList.remove('on-detail');document.getElementById('main').classList.remove('detail');document.getElementById('content').classList.remove('show');setTab('Home');location.hash='home'};function page(content,name){document.getElementById('content').innerHTML='<button class="back" onclick="showHome()">← Back to home</button>'+content;document.querySelector('.shell').classList.add('on-detail');document.getElementById('main').classList.add('detail');document.getElementById('content').classList.add('show');document.getElementById('main').scrollTop=0;setTab(name==='Statutes'||name==='Legal News'||name==='Research'?name:'Tools');location.hash=name.toLowerCase().replace(/ /g,'-')};window.runSearch=function(q){q=String(q||'').trim();if(!q)return;history=history.filter(h=>h.q.toLowerCase()!==q.toLowerCase());history.unshift({q,at:Date.now()});history=history.slice(0,25);save();renderHistory();page('<span class="eyebrow">Legal Research</span><h2>Search results</h2><p class="desc">Showing a demonstration research workspace for: <strong>'+escapeHTML(q)+'</strong></p><div class="muted-box">This standalone UI demonstrates the research workflow. Live judgment results and AI answers will appear here once a legal database and AI service are connected.</div><div class="result"><h3>Explore related judgments</h3><p>Search courts, judges, legal principles and citation references using advanced filters.</p><button class="linkbtn" onclick="showPage(\'Research\')">Open research tools →</button></div><div class="result"><h3>Explore relevant statutes</h3><p>Find the current legislation, sections, rules and amendments related to your research.</ oin('')+'</div>';else if(name==='Drafting')content+='<div class="result"><h3>Your draft</h3><p>Use this editor to begin your drafting notes. Text is kept in your browser while this page remains open.</p><textarea class="editor" id="draft" placeholder="Begin drafting your notice, pleading, agreement or research memo..."></textarea><p style="margin-top:15px"><button class="primary" onclick="downloadDraft()">Download text draft</button></p></div>';else if(name==='Workspace')content+='<div class="twocol">'+[['Saved Cases','Cases you have bookmarked'],['My Notes','Research notes and annotations'],['Research History','Revisit past queries'],['Folders','Organise research by matter'],['Compilations','Prepare lists of authorities'],['Alerts','Follow important updates']].map(x=>'<button class="tooltile" onclick="demoLookup(\''+x[0]+'\')"><b>'+x[0]+'</b><p>'+x[1]+'</p></button>').join('')+'</div>';else if(name==='Legal News')content+='<div class="result"><h3>Read the latest legal news</h3><p>Visit LiveLaw for reporting on court decisions, legislation and legal developments.</p><a class="primary" style="display:inline-block;text-decoration:none" target="_blank" rel="noopener" href="https://www.livelaw.in/">Open LiveLaw ↗</a></div>';else content+='<div class="twocol">'+[['Document Analysis','Review uploaded document content'],['Case Comparison','Compare decisions'],['Citation Research','Find citing and cited cases'],['Case Compilation','Arrange authorities for export']].map(x=>'<button class="tooltile" onclick="demoLookup(\''+x[0]+'\')"><b>'+x[0]+'</b><p>'+x[1]+'</p></button>').join('')+'</div>';page(content,name)};window.demoLookup=function(type){const el=document.getElementById('section-query');let q=el&&el.value.trim();if(q){runSearch(q);return}page('<span class="eyebrow">'+escapeHTML(type)+'</span><h2>'+escapeHTML(type)+'</h2><p class="desc">The '+escapeHTML(type)+' workspace is ready for backend integration. This standalone front-end does not fabricate legal search results
