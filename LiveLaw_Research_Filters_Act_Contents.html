/* Non-blocking statute inspector: keeps the article independently scrollable. */
.popover{position:fixed;top:72px;right:0;left:auto;transform:none;width:min(440px,42vw);height:calc(100dvh - 72px);max-height:none;overflow-y:auto;overscroll-behavior:contain;border-radius:0;border:0;border-left:1px solid #dce2e8;box-shadow:-12px 0 28px #14233713;z-index:40;padding:22px 21px 36px;background:white;display:none}
.popover.show{display:block}
.content.reading-with-panel{padding-right:min(440px,42vw);transition:padding-right .16s ease}
.popover .comparison{grid-template-columns:1fr}
.popover .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
.popover .tabs{position:sticky;top:-22px;z-index:1;background:white;padding-top:10px}
.popover .pop-footer{flex-wrap:wrap}
.popover .action{white-space:normal}
@media(max-width:900px){.popover{width:min(420px,80vw)}.content.reading-with-panel{padding-right:min(420px,80vw)}}
@media(max-width:640px){.popover{top:72px;width:100%;height:calc(100dvh - 72px);border-left:0;border-top:1px solid #dce2e8}.content.reading-with-panel{padding-right:0}}

function selectActChapter(id){selectedChapter=id;navigate('actcontents')}
function actcontents(){let chapter=actChapters.find(x=>x[0]===selectedChapter)||actChapters[17];return `<div class="page"><div class="breadcrumb">Statutes / Indian Penal Code, 1860 / Chapter ${esc(chapter[0])}</div><div class="page-head"><div><h1>Contents of the Act</h1><p class="muted">Navigate chapters and legal components. Only IPC 302 / BNS 103 text is loaded in this sample.</p></div><button class="action" onclick="navigate('statutes')">← All Acts</button></div><div class="act-content-layout"><aside class="panel toc"><h3>Indian Penal Code, 1860</h3><input class="field" placeholder="Find chapter" oninput="document.querySelectorAll('.chapter-link').forEach(x=>x.hidden=!x.innerText.toLowerCase().includes(this.value.toLowerCase()))"><div class="chapter-list">${actChapters.map(x=>`<button class="chapter-link ${x[0]===selectedChapter?'sel':''}" onclick="selectActChapter('${x[0]}')">Chapter ${x[0]} · ${x[1]}</button>`).join('')}</div></aside><section class="panel"><div class="overline">Act → Chapter → Section</div><h2>Chapter ${esc(chapter[0])} · ${esc(chapter[1])}</h2><p class="muted">Choose a section to open its available text, old/new comparison and citing cases.</p>${chapter[0]==='XVI'?`<div class="chapter-sections">${[['299','Culpable homicide'],['300','Murder'],['301','Culpable homicide by causing death of person other than intended'],['302','Punishment for murder'],['303','Punishment for murder by life-convict'],['304','Punishment for culpable homicide not amounting to murder'],['307','Attempt to murder']].map(x=>`<button class="chapter-section" onclick="${x[0]==='302'?"sectionMode='ipc';navigate('section')":"notify('This section text has not yet been loaded into the demo')"}"><strong>Section ${x[0]}</strong><span>${x[1]}</span><span>→</span></button>`).join('')}</div>`:'<div class="notice">This chapter is available in the navigation outline. Individual sections require the full verified Act database.</div>'}<h3>Legal components within a section</h3><div class="component-grid">${['Section','Sub-section','Clause','Proviso','Explanation','Exception','Illustration','Schedule','Amendment','Repeal and savings clause','Gazette notification'].map(x=>`<div class="component-item"><b>${x}</b><small>${x==='Section'?'Browse numbered provisions':x==='Amendment'?'Track versions and effective dates':x==='Gazette notification'?'Link to publication source':'Displayed when present in the Act'}</small></div>`).join('')}</div><p class="footer-note">Not every section contains each component. This is the complete display structure, not fabricated statutory text.</p></section></div></div>`}
function statutes(){return `<div class="page"><div class="breadcrumb">Home / Statutes</div><div class="page-head"><div><h1>Statutes & sections</h1><p class="muted">Look up a section and see its previous or corresponding provision.</p></div><div class="actions"><button class="action" onclick="navigate('actcontents')">Browse all chapters →</button><button class="action" onclick="navigate('article')">Read linked article →</button></div></div><div class="panel"><div class="overline">Section lookup</div><div class="row"><input class="field" style="flex:1" id="lookup" placeholder="Try IPC 302 or BNS 103" value="IPC 302" onkeydown="if(event.key==='Enter')navigate('section')"><button class="action primary" onclick="navigate('section')">Look up →</button></div><div class="grid3" style="margin-top:20px">${[['Indian Penal Code, 1860','Repealed 1 Jul 2024','ipc'],['Bharatiya Nyaya Sanhita, 2023','In force since 1 Jul 2024','bns'],['CrPC ↔ BNSS','Cross-reference catalogue · planned','bnss'],['Evidence Act ↔ BSA','Cross-reference catalogue · planned','bsa'],['NI Act, Section 138','Statute catalogue · planned','ni'],['Constitution of India','Statute catalogue · planned','constitution']].map(x=>`<button class="panel" onclick="${x[2]==='ipc'||x[2]==='bns'?`sectionMode='${x[2]}';navigate('actcontents')`:'notify(\'Section data not included in this sample\')'}" style="text-align:left"><h3>${x[0]}</h3><small>${x[1]}</small><p style="color:var(--red)">Browse →</p></button>`).join('')}</div></div><div class="footer-note">This prototype uses the provided IPC 302 / BNS 103 sample data. Mappings await editorial and gazette verification.</div></div>`}
function section(){let isOld=sectionMode==='ipc';return `<div class="page"><div class="breadcrumb">Statutes / ${isOld?'Indian Penal Code, 1860':'Bharatiya Nyaya Sanhita, 2023'} / Section ${isOld?'302':'103'}</div><div class="page-head"><div><div class="row"><span class="status ${isOld?'old':''}">${isOld?'Repealed · 1 July 2024':'In force · since 1 July 2024'}</span><span class="status note">Example · verification pending</span></div><h1 style="margin-top:8px">Section ${isOld?'302':'103'} · Punishment for murder</h1><p class="muted">${isOld?'Indian Penal Code, 1860':'Bharatiya Nyaya Sanhita, 2023'} · ${isOld?'Chapter XVI':'Chapter VI'}</p></div><div class="actions"><button class="action" onclick="saveIssue()">☆ Save issue</button><button class="action" onclick="print()">↓ PDF</button></div></div><div class="columns"><aside class="panel toc"><h3>${isOld?'Indian Penal Code':'Bharatiya Nyaya Sanhita'}</h3><input class="field" id="chapFilter" placeholder="Filter chapters or sections" oninput="filterChapters()"><div id="chapterList">${chapters()}</div></aside><article><div class="notice ${isOld?'amber':''}"><b>${isOld?'Replaced by BNS s.103(1) from 1 July 2024':'Corresponds to IPC s.302'}</b><p>${isOld?'The applicable statute may depend on when the offence occurred.':'Section 103(2) is presented separately: the sample describes it as a new provision with no IPC predecessor.'}</p><button class="action primary" onclick="sectionMode='${isOld?'bns':'ipc'}';navigate('section')">View ${isOld?'BNS 103':'IPC 302'} →</button></div><section class="section-block" id="text"><h2>Text of the section</h2><p class="muted">${isOld?'Text as supplied for the period ending 30 June 2024':'Sample text effective from 1 July 2024 · verify against gazette'}</p><div class="stat-text">${isOld?esc(old.versions[0].text):'<b>(1)</b> '+esc(fresh.versions[0].children[0].text)}</div>${!isOld?'<div class="notice"><b>New subsection (2) · no IPC predecessor</b><p>'+esc(fresh.versions[0].children[1].text)+'</p><small>Illustrative paraphrase in supplied sample JSON, not gazetted wording.</small></div>':''}<div class="facts"><div><label>Punishment</label><strong>Death or imprisonment for life and fine</strong></div><div><label>Bailable</label><strong>Non-bailable*</strong></div><div><label>Cognizable</label><strong>Yes*</strong></div><div><label>Triable by</label><strong>Court of Session*</strong></div></div><small>*Quick facts are carried from the supplied IPC sample. Classification for BNS must be confirmed against the applicable schedule before publication.</small></section><section class="section-block" id="compare"><h2>Old and new, side by side</h2><div class="row" style="margin-bottom:12px"><span class="status note">Renumbered · proposed</span><span class="status">Punishment unchanged · sample mapping</span></div><div class="comparison"><div class="comparebox"><div class="overline">IPC s.302 · repealed</div><p>Whoever commits murder shall be punished with <mark>death, or</mark> imprisonment for life, and shall also be liable to fine.</p></div><div class="comparebox"><div class="overline">BNS s.103(1) · in force</div><p>Whoever commits murder shall be punished with <mark>death or</mark> imprisonment for life, and shall also be liable to fine.</p></div></div><p class="muted">The supplied sample shows a punctuation difference in subsection (1). BNS 103(2) is an additional subsection, not an equivalent of IPC 302.</p><table style="width:100%;border-collapse:collapse" cellspacing="0" cellpadding="10"><tr style="background:#f4f6f8"><th align="left">Item</th><th align="left">Old</th><th align="left">New</th></tr><tr><td>Section</td><td>IPC 302</td><td>BNS 103(1)</td></tr><tr><td>Relation</td><td colspan="2">Renumbered (subject to source verification)</td></tr><tr><td>Additional rule</td><td>None in this mapping</td><td>103(2) — new, no predecessor</td></tr><tr><td>Verified</td><td colspan="2">Pending editorial sign-off</td></tr></table><div class="notice"><b>Which law applies?</b><p>Consider the date of the alleged offence and applicable saving provisions. This comparison is a reference aid, not a determination of applicable law.</p></div></section><section class="section-block" id="related"><h2>Related provisions</h2><div class="grid3">${SOURCE_DATA.related_nodes.map(n=>`<button class="panel" onclick="notify('Related entry shown for reference; full text not included in sample')" style="text-align:left"><b>${esc(n.node_id.toUpperCase().replace('/S',' s.'))}</b><p class="muted">${esc(n.relation)}</p><span class="status">${esc(n.new_equivalent.toUpperCase().replace('/S',' s.'))}</span></button>`).join('')}</div></section><section class="section-block" id="cases"><h2>Cases on this provision</h2><p class="muted">Illustrative case list from your visual reference; no live citation database is connected.</p><div class="filters" id="caseFilters">${['All','Intention','Evidence','Sentencing'].map(n=>`<button class="${activeFilter===n?'active':''}" onclick="activeFilter='${n}';renderCases()">${n}</button>`).join('')}</div><div id="caseList"></div></section><section class="section-block" id="issues"><h2>Save this issue</h2><p>Keep the section, its mapping and your notes together for later research.</p><textarea class="field" id="issueNotes" rows="4" placeholder="Your research notes…">${esc(load('issueNotes',''))}</textarea><div class="row" style="margin-top:10px"><button class="action primary" onclick="store('issueNotes',$('issueNotes').value);saveIssue()">Save notes</button><button class="action" onclick="navigate('workspace')">Open Workspace</button></div></section><p class="footer-note">Source: user-provided sample JSON. Last verified: pending editor sign-off. Check authoritative gazettes and schedules before legal use. <a href="mailto:editor@example.invalid" onclick="event.preventDefault();notify('Editorial reporting requires a configured inbox')">Report an error</a></p></article><aside><div class="panel" style="position:sticky;top:95px"><div class="overline">On this page</div>${[['text','Text of the section'],['compare','Old vs new'],['related','Related provisions'],['cases','Cases'],['issues','Save issue']].map(x=>`<a style="display:block;padding:7px 0;border-bottom:1px solid #edf0f3" href="#${x[0]}" onclick="scrollSection('${x[0]}');return false">${x[1]}</a>`).join('')}<div class="overline" style="margin-top:19px">Quick facts</div><p>Status: <b>${isOld?'Repealed':'In force'}</b></p><p>Equivalent: <b>${isOld?'BNS 103(1)':'IPC 302'}</b></p><p>Verification: <b>Pending</b></p><div class="overline" style="margin-top:18px">Ask about this section</div><input class="field" id="question" placeholder="e.g. Is it bailable?"><button class="action primary" style="margin-top:8px;width:100%" onclick="askSample('question','askAnswer')">Ask (sample)</button><div id="askAnswer" style="font-size:12px;margin-top:8px"></div></div></aside></div></div>`}
function chapters(){return actChapters.map(x=>`<button onclick="selectActChapter('${x[0]}')">${x[0]} · ${esc(x[1])}</button>`).join('')+`<button class="sel" onclick="scrollSection('text')">302 · Punishment for murder</button>`}function filterChapters(){let v=$('chapFilter').value.toLowerCase();document.querySelectorAll('#chapterList button').forEach(b=>b.style.display=b.innerText.toLowerCase().includes(v)?'':'none')}function xSection(x){if(x.includes('302'))scrollSection('text');else notify('Only IPC 302 / BNS 103 full data is supplied for this demonstration')}function scrollSection(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'})}function renderCases(){let node=$('caseList');if(!node)return;node.innerHTML=sampleCases.filter(x=>activeFilter==='All'||x.issue===activeFilter).map(x=>`<div class="case"><div class="row" style="justify-content:space-between"><h3>${esc(x.name)}</h3><span class="status note">${x.issue}</span></div><small>${esc(x.cite)} · ${esc(x.court)} · cites ${x.code}</small><p>${esc(x.summary)}</p><div class="case-links"><a href="#article" onclick="navigate('article');return false">View reference context →</a><a href="https://www.livelaw.in/" target="_blank" rel="noopener">Search LiveLaw ↗</a></div></div>`).join('');let f=$('caseFilters');if(f)f.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.textContent===activeFilter))}function saveIssue(){let a=load('savedIssues',[]);if(!a.includes('IPC 302 ↔ BNS 103'))a.push('IPC 302 ↔ BNS 103');store('savedIssues',a);notify('Issue saved to your workspace')}
function article(){return `<div class="page"><div class="breadcrumb">Legal News / Connected article · demonstration</div><div class="article-layout"><article><div class="overline" style="color:var(--navy)">Section Tag · Supreme Court · Sample Article</div><h1 class="article-title">Legal report with linked statutory provisions</h1><p class="muted">Illustrative report · No invented reporter, case citation or date</p><hr style="border:0;border-top:1px solid var(--line);margin:23px 0"><div class="reader"><p>Under <button class="click-section" onclick="openPop('ipc')">Section 302 IPC</button>, the issue concerned punishment for murder and the interpretation of the applicable criminal law.</p><p>The corresponding provision under the newer code is <button class="click-section" onclick="openPop('bns')">Section 103 BNS</button>. The correct law can depend on the date of the alleged offence, alongside the relevant saving provisions.</p><p>Tap a highlighted section above to read its text, compare old and new provisions, browse linked cases, and open the complete section page.</p></div><div class="notice"><b>Editorial demonstration</b><p>This article is a sample built to demonstrate citation-linked reading. It is not a published LiveLaw news report.</p></div><button class="action" onclick="navigate('section')">Open full section view →</button></article><aside><div class="panel"><div class="overline">Provisions cited</div><button class="case" style="width:100%;text-align:left" onclick="openPop('ipc')"><b>Section 302 IPC</b><div><small>Repealed 1 July 2024</small></div></button><button class="case" style="width:100%;text-align:left" onclick="openPop('bns')"><b>Section 103 BNS</b><div><small>In force</small></div></button><hr style="border:0;border-top:1px solid var(--line)"><div class="overline">Related workflow</div><button class="action" onclick="navigate('section')">Read & compare sections</button><p class="muted">Statutory references are visibly separated from editorial commentary.</p></div></aside></div></div>`}
function openPop(mode='ipc'){sectionMode=mode;popTab='Text';drawPop();$('popover').classList.add('show');$('app').classList.add('reading-with-panel');$('popover').focus({preventScroll:true})}function closePop(){$('popover').classList.remove('show');$('app').classList.remove('reading-with-panel')}function drawPop(){let o=sectionMode==='ipc';$('popover').innerHTML=`<div class="row" style="justify-content:space-between"><div class="row"><span class="status ${o?'old':''}">${o?'IPC · 1860':'BNS · 2023'}</span><span class="status ${o?'old':''}">${o?'Repealed':'In force'}</span></div><button class="action" onclick="closePop()" aria-label="Close">✕</button></div><h2>Section ${o?'302':'103'} · <span style="font-weight:400;color:#66717d">Punishment for murder</span></h2><div class="notice ${o?'amber':''}"><b>${o?'Replaced by BNS s.103(1) from 1 July 2024':'Corresponds to IPC s.302'}</b><p>${o?'Offences before commencement may continue under the former code.':'New subsection (2) has no IPC predecessor in the sample mapping.'}</p><button class="action primary" onclick="sectionMode='${o?'bns':'ipc'}';drawPop()">View ${o?'BNS 103':'IPC 302'} →</button></div><div class="tabs">${['Text','Compare','Related','Cases','Ask'].map(t=>`<button class="${popTab===t?'active':''}" onclick="popTab='${t}';drawPop()">${t}</button>`).join('')}</div><div class="pop-body">${popContent(o)}</div><div class="pop-footer"><a href="#section" onclick="closePop();navigate('section');return false">Open full section page →</a><span>Last verified: Pending · <a href="#" onclick="notify('Error reporting requires editorial backend');return false">Report an error</a></span></div>`}function popContent(o){if(popTab==='Text')return `<div class="overline">${o?'Text until 30 June 2024':'Sample text from 1 July 2024'}</div><p style="font:18px/1.65 Georgia,serif">${o?esc(old.versions[0].text):esc(fresh.versions[0].children[0].text)}</p><div class="facts"><div><label>Punishment</label><strong>Death, life imprisonment and fine</strong></div><div><label>Bailable</label><strong>No*</strong></div><div><label>Cognizable</label><strong>Yes*</strong></div><div><label>Triable by</label><strong>Sessions court*</strong></div></div><small>*Please verify against the authoritative schedules.</small>`;if(popTab==='Compare')return `<div class="comparison"><div class="comparebox"><small>IPC 302</small><p>Whoever commits murder shall be punished with <mark>death, or</mark> imprisonment for life, and shall also be liable to fine.</p></div><div class="comparebox"><small>BNS 103(1)</small><p>Whoever commits murder shall be punished with <mark>death or</mark> imprisonment for life, and shall also be liable to fine.</p></div></div><p class="muted">BNS 103(2) is a separate new provision in the supplied sample, without an IPC predecessor.</p>`;if(popTab==='Related')return `<div class="stack">${SOURCE_DATA.related_nodes.map(x=>`<div class="alert"><b>${esc(x.node_id)} ↔ ${esc(x.new_equivalent)}</b><div class="muted">${esc(x.relation)}</div></div>`).join('')}</div>`;if(popTab==='Cases')return `<div class="row"><label>Code <select id="popCaseFilter" onchange="popCases()"><option>Both</option><option>IPC</option><option>BNS</option></select></label></div><div id="popCases">${sampleCases.slice(0,3).map(x=>`<div class="case"><b>${esc(x.name)}</b><p class="muted">${esc(x.cite)} · ${x.code} · illustrative reference</p></div>`).join('')}</div><small>No BNS-specific case records were supplied.</small>`;return `<p class="muted">Ask about the supplied section text (sample rules only; no AI backend).</p><div class="row"><input class="field" id="popQuestion" placeholder="Does IPC 302 allow bail?"><button class="action primary" onclick="askSample('popQuestion','popAnswer')">Ask</button></div><div id="popAnswer" class="alert" style="margin-top:12px">Source: IPC 302 sample JSON. Not legal advice.</div>`}function popCases(){let f=$('popCaseFilter').value;$('popCases').innerHTML=(f==='BNS'?[]:sampleCases.slice(0,3)).map(x=>`<div class="case"><b>${esc(x.name)}</b><p>${x.cite} · ${x.code}</p></div>`).join('')||'<p>No BNS-tagged case records available in the supplied sample.</p>'}function askSample(id,target){let q=($(id)?.value||'').toLowerCase(),ans='The supplied sample does not establish an answer to that question. Please consult the official text and applicable judicial sources.';if(/bail/.test(q))ans='The supplied IPC 302 sample marks the offence as non-bailable. Verify applicable classification and law version from the authoritative schedule.';if(/punish|sentence/.test(q))ans='The supplied IPC 302 text states death or imprisonment for life, and liability to fine.';if(/equiv|new|replace|bns/.test(q))ans='The supplied crosswalk maps IPC 302 to BNS 103(1) as renumbered and lists BNS 103(2) as new with no predecessor. Editorial verification is pending.';$(target).innerHTML=`<p>${esc(ans)}</p><small>Sample source: ipc/s302 and bns/s103 · last verified: pending · not legal advice.</small>`}

function drawResults(){let node=$('researchResults');if(!node)return;let docs=[{title:'IPC Section 302 · Punishment for murder',type:'Statute',court:'Legislation',date:'2024-06-30',act:'Indian Penal Code, 1860',section:'302',state:'All India',treatment:'',content:'Historical statute; corresponding BNS provision: 103(1).',action:'section',sort:3},{title:'BNS Section 103 · Punishment for murder',type:'Statute',court:'Legislation',date:'2024-07-01',act:'Bharatiya Nyaya Sanhita, 2023',section:'103',state:'All India',treatment:'',content:'In-force statute; subsection (2) is new in the sample mapping.',action:'section',sort:4},...sampleCases.map((x,i)=>({title:x.name,type:'Judgment',court:x.court||'Supreme Court',date:'',judge:'',act:'IPC',section:'302',state:'All India',treatment:'',content:x.summary,action:'section',sort:10-i}))];let f=resultFilters;let q=lastQuery.toLowerCase();let hits=docs.filter(d=>{if(f.court?.length&&!f.court.some(v=>d.court.toLowerCase().includes(v.toLowerCase())))return false;if(f.type?.length&&!f.type.includes(d.type))return false;if(f.act&&!d.act.toLowerCase().includes(f.act.toLowerCase()))return false;if(f.section&&!d.section.includes(f.section))return false;if(f.judge&&!(d.judge||'').toLowerCase().includes(f.judge.toLowerCase()))return false;if(f.state&&!d.state.toLowerCase().includes(f.state.toLowerCase()))return false;if(f.from&&d.date&&d.date<f.from)return false;if(f.to&&d.date&&d.date>f.to)return false;if(f.treatment?.length&&!f.treatment.includes(d.treatment))return false;return true});let sort=$('resultSort')?.value||'relevance';if(sort==='newest')hits.sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(sort==='oldest')hits.sort((a,b)=>(a.date||'').localeCompare(b.date||''));node.innerHTML=`<p class="muted" style="margin:0 0 12px">${hits.length} sample records · filters apply to the sample dataset only. No live database connected.</p>`+(hits.length?hits.map(d=>`<article class="case result-case"><div class="row"><span class="status note">${esc(d.type)}</span><small>${esc(d.court)}</small></div><h3>${esc(d.title)}</h3><small>${esc(d.date||'Court date not included in sample')} · ${esc(d.act)}</small><p>${esc(d.content)}</p><button class="action" onclick="sectionMode='${d.title.startsWith('BNS')?'bns':'ipc'}';navigate('section')">Read source →</button></article>`).join(''):'<div class="panel"><h3>No sample records match these filters</h3><p>The connected database will supply actual matching results in production.</p></div>')}

function research(){return `<div class="page"><div class="breadcrumb">Home / Research / Results</div><div class="page-head"><div><h1>Research results</h1><p class="muted">Narrow results by court, date, document type and legal treatment.</p></div><button class="action" onclick="uploadFromSearch()">↑ Upload document</button></div><div class="searchbox" style="margin:0 0 13px;max-width:100%"><select id="researchCat"><option>All sources</option><option>Judgments</option><option>Statutes</option><option>Sections</option><option>Citations</option></select><input id="researchInput" value="${esc(lastQuery)}" onkeydown="if(event.key==='Enter')searchFrom('researchInput')"><button class="go" onclick="searchFrom('researchInput')">→</button></div><div class="results-layout"><aside class="panel filters-panel"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Filter results</h3><button class="linkbtn" onclick="resetResultFilters()">Clear</button></div>${filterGroup('Court',['Supreme Court','High Court','Tribunal','District Court'],'court')}<div class="filter-field"><b>Date</b><label>From date<input class="field" type="date" data-filter="from" onchange="checkResultFilters()"></label><label>To date<input class="field" type="date" data-filter="to" onchange="checkResultFilters()"></label></div><div class="filter-field"><label><b>Judge / author</b><input class="field" placeholder="Judge name" data-filter="judge" oninput="checkResultFilters()"></label></div><div class="filter-field"><label><b>Act</b><input class="field" placeholder="e.g. Indian Penal Code" data-filter="act" oninput="checkResultFilters()"></label></div><div class="filter-field"><label><b>Section</b><input class="field" placeholder="e.g. 302" data-filter="section" oninput="checkResultFilters()"></label></div>${filterGroup('Document type',['Judgment','Order','Statute','Rule','Notification','Article'],'type')}<div class="filter-field"><label><b>State / jurisdiction</b><input class="field" placehold div class="overline" style="margin-top:18px">Draft editor</div><div class="row" style="margin-bottom:8px"><button class="action" onclick="formatDraft('bold')"><b>B</b></button><button class="action" onclick="formatDraft('italic')"><i>I</i></button><button class="action" onclick="formatDraft('insertUnorderedList')">≡ List</button><button class="action" onclick="saveDraft()">Save</button><button class="action" onclick="printDraft()">Print / PDF</button></div><div id="draft" contenteditable="true" class="editor" spellcheck="true" oninput="scheduleDraftSave()"><h3>Research notes</h3><p>Start writing here...</p></div><small>Autosaves in this browser. Do not store confidential case records in this demo.</small></div></section></div></div>`}
let currentDoc=-1,fileBuffer=null,draftTimer;function docs(){return load('docs',[])}function renderVault(){let ds=docs(),fs=load('folders',['General','Case notes']);$('vaultFolders').innerHTML=fs.map(f=>`<button onclick="notify('Folder: '+${JSON.stringify(f)})">▱ ${esc(f)}</button>`).join('');$('vaultFiles').innerHTML=ds.map((d,i)=>`<button onclick="openDoc(${i})">▤ ${esc(d.name)} <small>· ${esc(d.folder||'General')}</small></button>`).join('')||'<small>No files yet</small>';$('savedIssues').innerHTML=load('savedIssues',[]).map(x=>`<button class="action" style="margin:3px" onclick="navigate('section')">${esc(x)}</button>`).join('')||'<small>No saved issues</small>';if(currentDoc>=0&&ds[currentDoc])openDoc(currentDoc);$('draft').innerHTML=load('draft','<h3>Research notes</h3><p>Start writing here...</p>')}function newFolder(){let n=prompt('New folder name');if(!n?.trim())return;let f=load('folders',['General','Case notes']);if(!f.includes(n.trim()))f.push(n.trim());store('folders',f);renderVault()}function handleFile(e){let f=e.target.files?.[0];if(!f)return;let folder=prompt('Folder name (existing or new)','General')||'General';let rd=new FileReader();rd.onload=()=>{let ds=docs();let entry={name:f.name,type:f.type,folder,size:f.size,data:rd.result,notes:'',at:Date.now()};ds.push(entry);try{localStorage.setItem('llref_docs',JSON.stringify(ds));currentDoc=ds.length-1;renderVault();notify('Document saved in this browser')}catch(err){notify('Storage limit reached. Large PDFs cannot be saved locally; showing preview only.');fileBuffer=entry;currentDoc=-2;showFile(entry)}};rd.readAsDataURL(f)}function openDoc(i){currentDoc=i;showFile(docs()[i])}function showFile(d){$('docName').textContent=d.name;$('docNotes').value=d.notes||'';let el=$('docPreview');el.innerHTML='';if((d.type||'').includes('pdf')){let frame=document.createElement('iframe');frame.src=d.data;frame.title=d.name;el.appendChild(frame)}else if((d.type||'').startsWith('image')){let im=document.createElement('img');im.src=d.data;im.alt=d.name;im.style.maxWidth='100%';el.appendChild(im)}else if(/\.txt$|\.md$/i.test(d.name)){let txt=decodeURIComponent(escape(atob((d.data||'').split(',')[1])));let pre=document.createElement('pre');pre.textContent=txt;pre.style.whiteSpace='pre-wrap';el.appendChild(pre)}else el.textContent='This file is stored locally. For DOCX editing, connect a dedicated document editor.'}function saveDocNotes(){let d=currentDoc===-2?fileBuffer:docs()[currentDoc];if(!d)return notify('Upload a document first');d.notes=$('docNotes').value;if(currentDoc>=0){let ds=docs();ds[currentDoc]=d;store('docs',ds)}notify('Notes saved')}function addAnnotation(){let n=prompt('Note / annotation (you can include page or paragraph number)');if(!n)return;$('docNotes').value+=($('docNotes').value?'\n':'')+'• '+n;saveDocNotes()}function formatDraft(c){document.execCommand(c,false,null);$('draft').focus()}function scheduleDraftSave(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,600)}function saveDraft(){store('draft',$('draft').innerHTML);notify('Draft saved locally')}function printDraft(){let a=window.open('','_blank');if(!a)return notify('Allow pop-ups to print');a.document.write('<html><body style="font-family:Georgia;max-width:780px;margin:48px auto">'+$('draft').innerHTML+'</body></html>');a.document.close();a.focus();a.print()}
function calendar(){return `<div class="page"><div class="breadcrumb">Workspace / Reminders</div><h1>Hearing calendar & reminders</h1><p class="muted">Add a reminder in plain language, review the date, and open it in Google Calendar or download an Outlook-compatible file.</p><div class="grid2"><div class="panel"><h3>Ask the calendar</h3><textarea class="field" id="reminderChat" rows="4" placeholder="Remind me of the client hearing on 25 October 2026 at 10:30 AM"></textarea><div class="row" style="margin-top:10px"><button class="action primary" onclick="parseReminder()">Prepare reminder →</button></div><div class="alert" style="margin-top:15px" id="reminderParsed">Enter a hearing or deadline above. Dates should be confirmed before adding to a calendar.</div><h3 style="margin-top:22px">Manual entry</h3><label>Title<input id="remTitle" class="field" placeholder="Court hearing" value="Court hearing"></label><label>Date & time<input type="datetime-local" id="remDate" class="field"></label><div class="row" style="margin-top:12px"><button class="action primary" onclick="addReminder()">Save reminder</button><button class="action" onclick="exportICS()">Download .ics</button><button class="action" onclick="openGoogleCalendar()">Open Google Calendar ↗</button></div></div><div class="panel"><h3>Your upcoming reminders</h3><div id="reminderList"></div><small>These entries are stored only in this browser. They do not synchronize automatically with Google or Outlook.</small></div></div></div>`}function parseReminder(){let s=$('reminderChat').value;let date=s.match(/(\d{1,2})\s+(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d{2})/i);let iso='';if(date){let mo=['january','february','march','april','may','june','july','august','september','october','november','december'].indexOf(date[2].toLowerCase())+1;iso=`${date[3]}-${String(mo).padStart(2,'0')}-${date[1].padStart(2,'0')}`;}let time=s.match(/(?:at\s+)(\d{1,2})(?::(\d\d))?\s*(AM|PM)?/i);let hh=time?Number(time[1]):9;if(time&&time[3])hh=(hh%12)+(time[3].toUpperCase()==='PM'?12:0);$('remTitle').value=s.replace(/^remind me (of|about)\s*/i,'').replace(/\s+on\s+\d{1,2}.*/i,'').trim()||'Court hearing';if(iso)$('remDate').value=iso+'T'+String(hh).padStart(2,'0')+':'+(time?.[2]||'00');$('reminderParsed').innerHTML='Please confirm the event title, date and time below before saving. Calendar sync requires account authorization.'}function addReminder(){let t=$('remTitle').value.trim(),d=$('remDate').value;if(!t||!d)return notify('Enter a title and date');let r=load('reminders',[]);r.push({title:t,date:d});store('reminders',r);renderReminders();notify('Reminder saved locally')}function renderReminders(){let el=$('reminderList');if(!el)return;el.innerHTML=load('reminders',[]).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div class="case"><b>${esc(x.title)}</b><p>${esc(x.date.replace('T',' at '))}</p></div>`).join('')||'<p class="muted">No reminders scheduled</p>'}function eventData(){let t=$('remTitle')?.value||'Court hearing',d=$('remDate')?.value;if(!d){notify('Choose date and time first');return null}let start=new Date(d),end=new Date(start.getTime()+3600000);return {t,start,end}}function formatUTC(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z')}function exportICS(){let e=eventData();if(!e)return;let contents=`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//LiveLaw Prototype//EN\r\nBEGIN:VEVENT\r\nUID:${Date.now()}@livelaw-demo.local\r\nDTSTAMP:${formatUTC(new Date())}\r\nDTSTART:${formatUTC(e.start)}\r\nDTEND:${formatUTC(e.end)}\r\nSUMMARY:${e.t.replace(/[\n,;]/g,' ')}\r\nEND:VEVENT\r\nEND:VCALENDAR`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contents],{type:'text/calendar'}));a.download='hearing-reminder.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}function openGoogleCalendar(){let e=eventData();if(!e)return;let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.t)+'&dates='+formatUTC(e.start)+'/'+formatUTC(e.end);window.open(u,'_blank','noopener')}
